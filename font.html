            <style>
                 .logo-svg {
            width: 40px;
            height: 40px;
        }
        .link{text-decoration: none;
        color:inherit}
        
         .navbar {
            background: var(--white);
            box-shadow: var(--shadow);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--primary-color);
        }
        .nav-menu {
            display: flex;
            list-style: none;
            gap: 30px;
        }
         .nav-link {
            text-decoration: none;
            color: var(--text-color);
            font-weight: 500;
            transition: var(--transition);
            padding: 8px 16px;
            border-radius: var(--radius);
        }

        .nav-link:hover {
            color: var(--primary-color);
            background: var(--bg-light);
        }
        .admin-btn {
            background: var(--primary-color);
            color: var(--white) !important;
        }

        .admin-btn:hover {
            background: var(--primary-dark);
        }
         .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
        }

        .hamburger span {
            width: 25px;
            height: 3px;
            background: var(--text-color);
            margin: 3px 0;
            transition: var(--transition);
        }

        :root {
            --primary-color: #8f0e04;
            --text-color: #333;
            --text-light: #666;
            --bg-light: #f8f8f8;
            --white: #fff;
            --radius: 10px;
            --shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        body {
            font-family: "Noto Sans Devanagari", Arial, sans-serif;
            background: #fff;
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 60px 20px;
        }

        .section-title {
            text-align: center;
            font-size: 2.2rem;
            color: var(--primary-color);
            margin-bottom: 50px;
        }

                .footer {
            background: #1a1919;
            color: var(--white);
            padding: 0px 0 0px;
        }

        .footer-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 170px;
            margin-bottom: 10px;
        }

        .footer-section h3 {
            margin-bottom: 10px;
            color: var(--secondary-color);
        }

        .footer-links {
            list-style: none;
        }

        .footer-links li {
            margin-bottom: 5px;
        }

        .footer-links a {
            color: #ccc;
            text-decoration: none;
            transition: var(--transition);
        }

        .footer-links a:hover {
            color: var(--secondary-color);
        }

        .footer-bottom {
            text-align: center;
            padding-top: 5px;
            border-top: 1px solid #444;
            color: #999;
        }
    </style>
</head>
