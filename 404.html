<!doctype html>
<html lang="ne">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#8f0e04">
<link rel="manifest" href="/site.webmanifest">
<title>पृष्ठ भेटिएन — नारायण भण्डारी</title>
<style>
:root{--primary:#8f0e04;--dark:#650a03;--gold:#f4c400}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#fafafa;color:#222;font-family:"Noto Sans Devanagari","Segoe UI",Arial,sans-serif}
main{width:min(680px,100%);background:#fff;border:1px solid #e8e8e8;border-radius:24px;padding:48px 28px;text-align:center;box-shadow:0 16px 45px rgba(0,0,0,.08)}
.logo{width:72px;height:72px;object-fit:cover;border-radius:50%;border:2px solid #eee}
h1{margin:20px 0 8px;color:var(--primary);font-size:clamp(2rem,6vw,3.4rem)}
p{color:#666;line-height:1.9;margin:0 auto 24px;max-width:540px}
a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:10px 20px;border-radius:12px;background:var(--primary);color:#fff;text-decoration:none;font-weight:800}
a:hover{background:var(--dark)}
</style>
</head>
<body>
<main>
<img class="logo" src="/image/logo.png" alt="नारायण भण्डारी" width="72" height="72">
<h1>४०४</h1>
<h2>यो पृष्ठ भेटिएन</h2>
<p>तपाईंले खोज्नुभएको पृष्ठ हटाइएको, स्थान परिवर्तन गरिएको वा गलत ठेगाना हुन सक्छ।</p>
<a href="/">गृहपृष्ठमा फर्कनुहोस्</a>
</main>
</body>
</html>
