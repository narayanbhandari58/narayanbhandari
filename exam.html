<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>लोकसेवा परीक्षा — नारायण भण्डारी</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="exam.css"></head><body><main class="exam-shell"><a class="back" href="index.html">← मुख्य वेबसाइट</a><header class="exam-header"><div><div class="eyebrow">लोकसेवा तयारी</div><h1>अनलाइन परीक्षा</h1><p>खरिदार · नायब सुब्बा · शाखा अधिकृत</p></div><div id="timer" class="timer" hidden>60:00</div></header><section id="chooser" class="panel"><h2>परीक्षा रोज्नुहोस्</h2><div id="examList" class="exam-grid"></div></section><section id="candidate" class="panel" hidden><h2 id="candidateTitle">परीक्षा सुरु गर्नुहोस्</h2><div class="form-grid"><label>नाम<input id="candidateName" required></label><label>Gmail<input id="candidateEmail" type="email" placeholder="तपाईंको Gmail"></label><label>WhatsApp नम्बर<input id="candidateWhatsapp" inputmode="tel" placeholder="+977... (वैकल्पिक)"></label></div><div id="candidateInfo" class="info"></div><button id="startBtn" class="btn btn-primary">परीक्षा सुरु गर्नुहोस्</button></section><section id="exam" hidden><div class="exam-top"><div><strong id="examTitle"></strong><span id="progress"></span></div><button id="finishBtn" class="btn btn-primary">परीक्षा बुझाउनुहोस्</button></div><div id="questionNav" class="question-nav"></div><article id="questionCard" class="question-card"></article></section><section id="result" class="panel" hidden><div id="resultSummary"></div><div class="result-actions"><button id="pdfBtn" class="btn btn-primary">📄 Feedback PDF बनाउनुहोस्</button><button id="shareBtn" class="btn btn-outline">📤 PDF Share गर्नुहोस्</button><a id="gmailBtn" class="btn btn-outline" href="#" hidden>Gmail</a><a id="whatsappBtn" class="btn btn-outline" href="#" hidden>WhatsApp</a></div><div id="review"></div></section></main><script src="exam.js"></script></body></html>
