<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel - नारायण भण्डारी</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"><script src="https://cdn.tiny.cloud/1/no-api-key/tinymce/7/tinymce.min.js" referrerpolicy="origin"></script></head><body>
<div id="login" class="admin-wrap"><div class="admin-card"><h1>Admin Login</h1><form id="loginForm"><input id="username" placeholder="Username" required><input id="password" type="password" placeholder="Password" required><button class="btn btn-primary">Login</button></form><p id="loginMsg"></p><small>पासवर्ड GitHub code मा राखिएको छैन; Netlify Environment Variable बाट व्यवस्थापन हुन्छ।</small></div></div>
<div id="dashboard" class="admin-wrap" style="display:none"><header class="admin-head"><h1>नारायण भण्डारी — Admin</h1><div><button class="btn btn-outline" id="logout">Logout</button></div></header><main class="admin-main">
<section class="admin-card"><h2 id="formHeading">नयाँ पोस्ट</h2><form id="postForm"><input type="hidden" id="postId"><div class="form-group"><label>शीर्षक</label><input id="title" required></div><div class="form-group"><label>श्रेणी</label><select id="category"><option>विचार</option><option>साहित्य</option><option>लोकसेवा</option><option>शिक्षा</option></select></div><div class="form-group"><label>Tags</label><input id="tags" placeholder="comma separated"></div><div class="form-group"><label>Featured Image</label><input id="image" type="file" accept="image/*"><div id="imagePreview"></div></div><div class="form-group"><label>सामग्री</label><textarea id="content"></textarea></div><button class="btn btn-primary" id="publish">प्रकाशित गर्नुहोस्</button><button type="button" class="btn btn-outline" id="draft">ड्राफ्ट</button><button type="button" class="btn" id="cancel">रद्द</button></form></section>
<section class="admin-card"><div class="row"><h2>पोस्टहरू</h2><button class="btn btn-primary" id="newPost">+ नयाँ पोस्ट</button></div><div id="table"></div></section>
</main></div><div id="toast" class="toast"></div><script src="admin.js"></script></body></html>
