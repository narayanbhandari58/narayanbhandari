<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="नारायण भण्डारीको व्यक्तिगत वेबसाइट - लेख, साहित्य, लोकसेवा र पत्रपत्रिका">
  <meta name="theme-color" content="#8f0e04">
  <title>नारायण भण्डारी - मेरो वेबसाइट</title>
  <style>
    :root {
      --primary-color: #8f0e04;
      --secondary-color: #c62828;
      --dark-color: #5b0402;
      --light-color: #f9f9f9;
      --text-color: #222;
      --text-light: #666;
    }
    body {
      font-family: "Noto Sans Devanagari", sans-serif;
      margin: 0;
      background: var(--light-color);
      color: var(--text-color);
    }
    header {
      background: var(--primary-color);
      color: white;
      padding: 1.5rem;
      text-align: center;
      font-size: 1.8rem;
      font-weight: bold;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    nav {
      background: var(--secondary-color);
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 0.8rem 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    nav a {
      color: white;
      text-decoration: none;
      padding: 0.6rem 1.2rem;
      border-radius: 4px;
      font-weight: bold;
    }
    nav a:hover, nav a.active {
      background: var(--dark-color);
    }
    main {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }
    section {
      margin-bottom: 3rem;
    }
    section h2 {
      color: var(--primary-color);
      border-bottom: 3px solid var(--primary-color);
      padding-bottom: 0.5rem;
    }
    .posts-section {
      display: flex;
      flex-wrap: wrap;
      gap: 25px;
      justify-content: center;
    }
    .post-box {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
      padding: 20px;
      width: 90%;
      max-width: 700px;
      transition: all 0.3s ease;
    }
    .post-title {
      font-size: 1.3rem;
      color: var(--dark-color);
      margin-bottom: 0.5rem;
      font-weight: bold;
    }
    .post-content {
      font-size: 1.05rem;
    }
    iframe {
      width: 100%;
      height: 250px;
      border: none;
      margin-top: 1rem;
      border-radius: 8px;
    }
    .post-extra {
      font-size: 0.9rem;
      color: var(--text-light);
      margin-top: 0.8rem;
    }
    footer {
      text-align: center;
      padding: 1.5rem;
      background: var(--primary-color);
      color: white;
    }
  </style>
</head>
<body>
  <header>नारायण भण्डारी</header>
  <nav>
    <a href="#lekha">लेख/रचना</a>
    <a href="#sahitya">साहित्य</a>
    <a href="#loksewa">लोकसेवा</a>
    <a href="#patrapatrika">पत्रपत्रिका</a>
    <a href="#mero-barema">मेरो बारेमा</a>
  </nav>
  <main>
    <section id="lekha">
      <h2>लेख/रचना</h2>
      <div class="posts-section" id="posts-lekha"></div>
    </section>
    <section id="sahitya">
      <h2>साहित्य</h2>
      <div class="posts-section" id="posts-sahitya"></div>
    </section>
    <section id="loksewa">
      <h2>लोकसेवा</h2>
      <div class="posts-section" id="posts-loksewa"></div>
    </section>
    <section id="patrapatrika">
      <h2>पत्रपत्रिका</h2>
      <div class="posts-section" id="posts-patrapatrika"></div>
    </section>
    <section id="mero-barema">
      <h2>मेरो बारेमा</h2>
      <div class="posts-section" id="posts-mero-barema"></div>
    </section>
  </main>
  <footer>© २०८२ नारायण भण्डारी | Developed by Narayan Bhandari</footer>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAeMBVRnouOkMIInTYUjysb1f3lflhxxYM",
      authDomain: "narayan-cms.firebaseapp.com",
      projectId: "narayan-cms",
      storageBucket: "narayan-cms.appspot.com",
      messagingSenderId: "877625098183",
      appId: "1:877625098183:web:c13d46fbb662de2aa0e3e2",
      measurementId: "G-TDQ2PKZXWT"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadPosts() {
      const sections = ['lekha', 'sahitya', 'loksewa', 'patrapatrika', 'mero-barema'];
      const postsSnapshot = await getDocs(collection(db, "posts"));
      const posts = [];
      postsSnapshot.forEach(doc => posts.push(doc.data()));
      sections.forEach(section => {
        const container = document.getElementById('posts-' + section);
        const filtered = posts.filter(p => p.section === section);
        if (filtered.length === 0) {
          container.innerHTML = '<p>कुनै पोस्ट छैन।</p>';
        } else {
          container.innerHTML = filtered.map(post => `
            <div class="post-box">
              <h3 class="post-title">${post.title}</h3>
              <div class="post-content">${post.content}</div>
              ${post.youtube ? `<iframe src="${post.youtube}" allowfullscreen></iframe>` : ''}
            </div>
          `).join('');
        }
      });
    }

    window.addEventListener('DOMContentLoaded', loadPosts);
  </script>
</body>
</html>
