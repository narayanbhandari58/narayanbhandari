<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>नारायण भण्डारी - मुख्य पृष्ठ</title>
  <style>
    body {
      font-family: 'Noto Sans Devanagari', sans-serif;
      margin: 0; background: #fff;
      max-width: 900px; margin: 2rem auto;
      padding: 0 1rem;
      color: #222;
    }
    header {
      text-align: center;
      border-bottom: 3px solid #bb1919;
      padding-bottom: 1rem;
      margin-bottom: 2rem;
    }
    header h1 {
      margin: 0;
      color: #bb1919;
    }
    article {
      margin-bottom: 2rem;
      border-bottom: 1px solid #ddd;
      padding-bottom: 1rem;
    }
    article h2 {
      margin: 0 0 0.5rem 0;
      color: #8a1212;
    }
    article .section {
      font-style: italic;
      color: #666;
      margin-bottom: 0.8rem;
    }
    article iframe {
      width: 100%;
      height: 200px;
      border: none;
      margin-top: 0.5rem;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <header>
    <h1>नारायण भण्डारी</h1>
    <p>लेख/रचना, साहित्य, लोकसेवा तयारी सामग्री र पत्रपत्रिका</p>
  </header>

  <section id="posts">
    <p>पोस्टहरू लोड हुँदैछ...</p>
  </section>

  <script>
    const repo = 'narayanbhandari58/narayanbhandari';

    async function loadPosts() {
      const container = document.getElementById('posts');
      container.innerHTML = '<p>लोड हुँदैछ...</p>';

      try {
        const res = await fetch(`https://api.github.com/repos/${repo}/contents/posts`);
        if (!res.ok) throw new Error('पोस्टहरू GitHub बाट ल्याउन सकिएन');
        const files = await res.json();

        // सबै JSON फाइलहरू छान्ने र नयाँदेखि पुरानो क्रम मिलाउने
        const postFiles = files.filter(f => f.name.endsWith('.json')).sort((a,b) => b.name.localeCompare(a.name));

        if (postFiles.length === 0) {
          container.innerHTML = '<p>कुनै पोस्ट उपलब्ध छैन।</p>';
          return;
        }

        let html = '';
        for (const file of postFiles) {
          const fr = await fetch(file.download_url);
          const post = await fr.json();

          html += `
          <article>
            <h2>${post.title}</h2>
            <div class="section">[${post.section}]</div>
            <div>${post.content}</div>
            ${post.youtube ? `<iframe src="${post.youtube.replace('watch?v=', 'embed/')}" allowfullscreen></iframe>` : ''}
          </article>`;
        }

        container.innerHTML = html;
      } catch (e) {
        container.innerHTML = `<p style="color:red;">${e.message}</p>`;
      }
    }

    loadPosts();
  </script>
</body>
</html>
