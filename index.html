<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>नारायण भण्डारी - लेखक, साहित्यकार र लोकसेवा तयारी सामग्री</title>
    <meta name="description" content="नारायण भण्डारीको व्यक्तिगत वेवसाइट — लेखक, साहित्यकार र लोकसेवा तयारी सामग्रीको स्रोत।" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari&family=Poppins&display=swap" rel="stylesheet" />
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <style>
        /* Reset and base */
        *, *::before, *::after {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: 'Noto Sans Devanagari', 'Poppins', sans-serif;
            background-color: #f8f9fa;
            color: #1a1a1a;
            line-height: 1.6;
            font-size: 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        a {
            color: #bb1919;
            text-decoration: none;
            cursor: pointer;
        }
        a:hover, a:focus {
            text-decoration: underline;
        }
        h1, h2, h3, h4 {
            margin-top: 0;
            color: #bb1919;
            font-weight: 700;
        }
        h1 {
            font-size: 2.75rem;
            letter-spacing: 0.05em;
        }
        h2 {
            font-size: 1.8rem;
            margin-bottom: 0.75rem;
        }
        h3 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
        }
        p {
            margin-bottom: 1em;
            color: #444444;
        }

        /* Header */
        header {
            background-color: #bb1919;
            color: white;
            padding: 16px 24px;
            position: sticky;
            top: 0;
            z-index: 110;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            font-weight: 900;
            font-size: 1.75rem;
        }
        nav.desktop-nav {
            display: flex;
            gap: 16px;
            align-items: center;
        }
        nav.desktop-nav a {
            background: white;
            color: #bb1919;
            border-radius: 6px;
            padding: 8px 14px;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }
        nav.desktop-nav a[aria-current="page"],
        nav.desktop-nav a:hover,
        nav.desktop-nav a:focus {
            background-color: #e63946;
            color: white;
        }

        /* Main container */
        main {
            flex-grow: 1;
            max-width: 960px;
            margin: 24px auto 48px auto;
            padding: 0 16px;
            min-height: 60vh;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(187 25 25 / 0.15);
            outline: none;
        }

        /* Sections */
        section {
            margin-bottom: 48px;
        }

        /* Subscription Section */
        #subscriptionSection {
            margin-top: 48px;
            padding: 24px;
            background: #fef0f0;
            border: 1.5px solid #bb1919;
            border-radius: 12px;
            max-width: 960px;
            margin-left: auto;
            margin-right: auto;
        }
        #subscriptionSection h3 {
            margin-top: 0;
        }
        #subscriptionSection input[type="email"] {
            width: 100%;
            padding: 10px 12px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1.5px solid #bb1919;
        }
        #subscriptionSection button {
            margin-top: 12px;
            width: 100%;
            background-color: #bb1919;
            color: white;
            font-weight: 700;
            border-radius: 8px;
            padding: 12px;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        #subscriptionSection button:hover,
        #subscriptionSection button:focus {
            background-color: #8a1515;
        }
        #subscriptionMessage {
            margin-top: 12px;
            font-weight: 600;
        }
        #subscriptionMessage.success {
            color: green;
        }
        #subscriptionMessage.error {
            color: #b00020; /* dark red */
        }

        /* Footer */
        footer {
            background-color: #bb1919;
            color: white;
            text-align: center;
            padding: 12px 0;
            margin-top: auto;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header {
                flex-wrap: wrap;
                gap: 12px;
                justify-content: center;
                text-align: center;
            }
            nav.desktop-nav {
                justify-content: center;
                flex-wrap: wrap;
            }
            main {
                margin: 24px 12px 48px 12px;
                max-width: 100%;
            }
            #subscriptionSection {
                margin: 24px 12px 48px 12px;
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
<header role="banner">
    <h1 class="logo">नारायण भण्डारी</h1>
    <nav class="desktop-nav" role="navigation" aria-label="मुख्य मेनु">
        <a href="javascript:void(0);" data-section="lekha" aria-current="page">लेख/रचना</a>
        <a href="javascript:void(0);" data-section="sahitya">साहित्य</a>
        <a href="javascript:void(0);" data-section="loksewa">लोकसेवा</a>
        <a href="javascript:void(0);" data-section="patrapatrika">पत्रपत्रिका</a>
        <a href="javascript:void(0);" data-section="mero-barema">मेरो बारेमा</a>
    </nav>
</header>

<main tabindex="-1" role="main" aria-live="polite" aria-atomic="true">
    <div id="mainContent"></div> <!-- Dynamic content area -->
</main>

<!-- Subscription Section -->
<section id="subscriptionSection">
    <h3>समाचारपत्र सदस्यता लिनुहोस्</h3>
    <form id="subscriptionForm" aria-label="समाचारपत्र सदस्यता फारम">
        <input type="email" id="subscriptionEmail" name="subscriptionEmail" placeholder="इमेल ठेगाना" required aria-required="true" />
        <button type="submit">सब्स्क्राइब गर्नुहोस्</button>
    </form>
    <div id="subscriptionMessage" role="status" aria-live="polite"></div>
</section>

<!-- Footer -->
<footer>
    सर्वाधिकार © नारायण भण्डारी, <span id="footerYear">२०८२</span>
</footer>

<script>
(() => {
    const subscriptionForm = document.getElementById('subscriptionForm');
    const subscriptionEmailInput = document.getElementById('subscriptionEmail');
    const subscriptionMessage = document.getElementById('subscriptionMessage');
    const mainContentDiv = document.getElementById('mainContent');
    const navLinks = document.querySelectorAll('nav.desktop-nav a');

    // Load content from localStorage safely (assumes content is safe)
    function loadMainContent() {
        const mainContent = localStorage.getItem('mainSiteContent') || '<p>अहिले सम्म कुनै सामग्री उपलब्ध छैन।</p>';
        mainContentDiv.innerHTML = mainContent;
        mainContentDiv.focus();
    }

    // Email validation regex (simple)
    function isValidEmail(email) {
        const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return re.test(email);
    }

    // Subscription functionality
    subscriptionForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = subscriptionEmailInput.value.trim();
        subscriptionMessage.className = '';
        subscriptionMessage.textContent = '';

        if (!email) {
            subscriptionMessage.textContent = 'कृपया इमेल ठेगाना लेख्नुहोस्।';
            subscriptionMessage.classList.add('error');
            subscriptionEmailInput.focus();
            return;
        }

        if (!isValidEmail(email)) {
            subscriptionMessage.textContent = 'कृपया मान्य इमेल ठेगाना लेख्नुहोस्।';
            subscriptionMessage.classList.add('error');
            subscriptionEmailInput.focus();
            return;
        }

        const subs = JSON.parse(localStorage.getItem('nv_subscriptions')) || [];
        if (subs.includes(email.toLowerCase())) {
            subscriptionMessage.textContent = 'यो इमेल पहिले नै सदस्यता लिइसक्यो।';
            subscriptionMessage.classList.add('error');
            subscriptionEmailInput.value = '';
            subscriptionEmailInput.focus();
            return;
        }
        subs.push(email.toLowerCase());
        localStorage.setItem('nv_subscriptions', JSON.stringify(subs));
        subscriptionMessage.textContent = 'धन्यवाद! तपाईं सफलतापूर्वक सदस्यता लिनुभयो।';
        subscriptionMessage.classList.add('success');
        subscriptionEmailInput.value = '';
    });

    // Manage nav active state for accessibility
    navLinks.forEach(link => {
        link.addEventListener('click', e => {
            e.preventDefault();
            navLinks.forEach(l => {
                l.removeAttribute('aria-current');
            });
            e.currentTarget.setAttribute('aria-current', 'page');
            // Could add code here to load different sections dynamically
        });
    });

    // Set footer year dynamically (using Gregorian year for simplicity)
    // You can replace with Nepali calendar year if needed
    document.getElementById('footerYear').textContent = new Date().getFullYear();

    // Initial load
    loadMainContent();
})();
</script>
</body>
</html>
