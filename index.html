<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>नारायण भण्डारी - मेरो वेबसाइट</title>
  <style>
    /* तपाइँले दिएको CSS यस्तै छ, मैले कुनै परिवर्तन गरेको छैन */
    body {
      font-family: "Noto Sans Devanagari", sans-serif;
      margin: 0;
      background: #f9f9f9;
      color: #222;
    }
    header {
      background-color: #8f0e04;
      color: white;
      padding: 1rem 1.5rem;
      text-align: center;
      font-size: 1.8rem;
      font-weight: bold;
      letter-spacing: 1px;
    }
    nav {
      background: #c62828;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 0.5rem 0;
    }
    nav a {
      color: white;
      text-decoration: none;
      padding: 0.6rem 1rem;
      font-weight: 600;
      border-radius: 4px;
      transition: background-color 0.3s ease;
    }
    nav a:hover, nav a.active {
      background-color: #5b0402;
    }
    main {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    section {
      margin-bottom: 3rem;
    }
    section h2 {
      color: #8f0e04;
      border-bottom: 3px solid #8f0e04;
      padding-bottom: 0.3rem;
      margin-bottom: 1rem;
      font-weight: 700;
    }
    .posts-section {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }
    .post-box {
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      box-shadow: 0 2px 5px rgb(0 0 0 / 0.1);
      padding: 15px 20px;
      width: 90%;
      max-width: 700px;
      box-sizing: border-box;
      transition: box-shadow 0.3s ease;
      overflow-wrap: break-word;
    }
    @media (min-width: 600px) {
      .post-box {
        width: 48%;
      }
    }
    @media (min-width: 900px) {
      .post-box {
        width: 30%;
      }
    }
    .post-title {
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
      font-weight: 700;
      color: #5a0c02;
    }
    .post-content {
      font-size: 1rem;
      margin-bottom: 0.5rem;
      color: #333;
    }
    iframe {
      width: 100%;
      height: 200px;
      border: none;
      margin-top: 0.5rem;
      border-radius: 5px;
    }
    .post-extra {
      font-size: 0.9rem;
      color: #666;
      margin-top: 0.3rem;
    }
    footer {
      text-align: center;
      padding: 1rem;
      background: #8f0e04;
      color: white;
      font-size: 0.9rem;
      margin-top: 3rem;
    }
  </style>
</head>
<body>
  <header>
    नारायण भण्डारी
  </header>
  <nav>
    <a href="#lekha" class="active">लेख/रचना</a>
    <a href="#sahitya">साहित्य</a>
    <a href="#loksewa">लोकसेवा</a>
    <a href="#patrapatrika">पत्रपत्रिका</a>
    <a href="#mero-barema">मेरो बारेमा</a>
  </nav>
  <main>
    <section id="lekha">
      <h2>लेख/रचना</h2>
      <div class="posts-section" id="posts-lekha"></div>
    </section>
    <section id="sahitya">
      <h2>साहित्य</h2>
      <div class="posts-section" id="posts-sahitya"></div>
    </section>
    <section id="loksewa">
      <h2>लोकसेवा</h2>
      <div class="posts-section" id="posts-loksewa"></div>
    </section>
    <section id="patrapatrika">
      <h2>पत्रपत्रिका</h2>
      <div class="posts-section" id="posts-patrapatrika"></div>
    </section>
    <section id="mero-barema">
      <h2>मेरो बारेमा</h2>
      <div class="posts-section" id="posts-mero-barema"></div>
    </section>
  </main>
  <footer>
    © २०८२ नारायण भण्डारी | Developed by ChatGPT
  </footer>

  <script>
    const repo = 'narayanbhandari58/narayanbhandari';
    const branch = 'main';

    const sectionMap = {
      'lekha': 'posts-lekha',
      'sahitya': 'posts-sahitya',
      'loksewa': 'posts-loksewa',
      'patrapatrika': 'posts-patrapatrika',
      'mero-barema': 'posts-mero-barema'
    };

    async function loadPosts() {
      for (const containerId of Object.values(sectionMap)) {
        document.getElementById(containerId).innerHTML = '<p>लोड हुँदैछ...</p>';
      }
      try {
        const res = await fetch(`https://api.github.com/repos/${repo}/contents/posts?ref=${branch}`);
        if (!res.ok) throw new Error('GitHub बाट पोस्ट फोल्डर फेला परेन');
        const files = await res.json();

        const sections = {
          'lekha': [],
          'sahitya': [],
          'loksewa': [],
          'patrapatrika': [],
          'mero-barema': []
        };

        for (const file of files.reverse()) {
          if (file.name.endsWith('.json')) {
            const postRes = await fetch(file.download_url);
            if (!postRes.ok) continue;
            const post = await postRes.json();
            if (sections[post.section]) {
              sections[post.section].push(post);
            }
          }
        }

        for (const [section, posts] of Object.entries(sections)) {
          let html = '';
          for (const post of posts) {
            let youtubeEmbed = '';
            if (post.youtube) {
              const ytUrl = post.youtube.replace('watch?v=', 'embed/');
              youtubeEmbed = `<iframe src="${ytUrl}" allowfullscreen></iframe>`;
            }
            html += `
              <article class="post-box">
                <h3 class="post-title">${post.title}</h3>
                <div class="post-content">${post.content}</div>
                ${youtubeEmbed}
                ${post.image ? `<p class="post-extra"><strong>Image:</strong> ${post.image}</p>` : ''}
                ${post.pdf ? `<p class="post-extra"><strong>PDF:</strong> ${post.pdf}</p>` : ''}
              </article>
            `;
          }
          document.getElementById(sectionMap[section]).innerHTML = html || '<p>कुनै पोस्ट उपलब्ध छैन।</p>';
        }

      } catch (error) {
        for (const containerId of Object.values(sectionMap)) {
          document.getElementById(containerId).innerHTML = '<p>डेटा ल्याउन असफल भयो। कृपया पछि प्रयास गर्नुहोस्।</p>';
        }
        console.error(error);
      }
    }

    window.onload = loadPosts;

    const navLinks = document.querySelectorAll('nav a');
    navLinks.forEach(link => {
      link.addEventListener('click', function(e) {
        navLinks.forEach(l => l.classList.remove('active'));
        this.classList.add('active');
      });
    });
  </script>
</body>
</html>
