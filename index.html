<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>नारायण भण्डारी - व्यक्तिगत वेवसाइट</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari&family=Poppins&display=swap" rel="stylesheet" />
<!-- Material Icons -->
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
<style>
  /* Reset and base */
  *, *::before, *::after {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    font-family: 'Noto Sans Devanagari', 'Poppins', sans-serif;
    background-color: #f8f9fa;
    color: #1a1a1a;
    line-height: 1.6;
    font-size: 16px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  a {
    color: #bb1919;
    text-decoration: none;
  }
  a:hover, a:focus {
    text-decoration: underline;
  }
  h1, h2, h3, h4 {
    margin-top: 0;
    color: #bb1919;
    font-weight: 700;
  }
  h1 {
    font-size: 2.75rem;
    letter-spacing: 0.05em;
  }
  h2 {
    font-size: 1.8rem;
    margin-bottom: 0.75rem;
  }
  h3 {
    font-size: 1.25rem;
    margin-bottom: 0.5rem;
  }
  p {
    margin-bottom: 1em;
    color: #444444;
  }

  /* Header */
  header {
    background-color: #bb1919;
    color: white;
    padding: 16px 24px;
    position: sticky;
    top: 0;
    z-index: 110;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo {
    font-weight: 900;
    font-size: 1.75rem;
  }
  nav.desktop-nav {
    display: flex;
    gap: 16px;
    align-items: center;
  }
  nav.desktop-nav a {
    background: white;
    color: #bb1919;
    border-radius: 6px;
    padding: 8px 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }
  nav.desktop-nav a.active,
  nav.desktop-nav a:hover,
  nav.desktop-nav a:focus {
    background-color: #e63946;
    color: white;
  }

  /* Main container */
  main {
    flex-grow: 1;
    max-width: 960px;
    margin: 24px auto 48px auto;
    padding: 0 16px;
    min-height: 60vh;
    background: white;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(187 25 25 / 0.15);
  }

  /* Sections */
  section {
    margin-bottom: 48px;
  }

  /* Content accordion */
  .accordion-title {
    font-weight: 700;
    cursor: pointer;
    padding: 12px;
    background: #bb1919;
    color: white;
    border-radius: 8px;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .accordion-title:hover,
  .accordion-title:focus {
    background-color: #8a1515;
    outline: none;
  }
  .accordion-content {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease;
    border: 1px solid #bb1919;
    border-top: none;
    border-radius: 0 0 8px 8px;
    padding: 0 12px;
  }
  .accordion-content.expanded {
    padding: 16px 12px;
  }
  .icon-toggle {
    font-size: 24px;
  }

  /* YouTube & PDF Iframes */
  iframe.video-embed,
  iframe.pdf-embed {
    width: 100%;
    border: none;
    border-radius: 12px;
    box-shadow: 0 3px 10px rgb(187 25 25 / 0.2);
    margin-top: 12px;
  }
  iframe.video-embed {
    aspect-ratio: 16 / 9;
  }
  iframe.pdf-embed {
    height: 500px;
  }

  /* Comment Section */
  #commentsSection {
    margin-top: 32px;
  }
  #commentsSection h3 {
    margin-bottom: 16px;
  }
  #commentForm textarea {
    width: 100%;
    resize: vertical;
    min-height: 80px;
    font-family: inherit;
    font-size: 1rem;
    border-radius: 8px;
    border: 1.5px solid #bb1919;
    padding: 12px;
  }
  #commentForm input[type="text"], #commentForm input[type="email"] {
    width: calc(50% - 12px);
    margin-right: 12px;
    padding: 8px;
    font-family: inherit;
    font-size: 1rem;
    border-radius: 8px;
    border: 1.5px solid #bb1919;
    box-sizing: border-box;
  }
  #commentForm input[type="email"] {
    margin-right: 0;
  }
  #commentForm button {
    margin-top: 12px;
    background-color: #bb1919;
    color: white;
    font-weight: 700;
    border-radius: 8px;
    padding: 12px 24px;
    border: none;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }
  #commentForm button:hover,
  #commentForm button:focus {
    background-color: #8a1515;
  }
  #commentsList {
    margin-top: 24px;
    list-style: none;
    padding-left: 0;
  }
  #commentsList li {
    border-bottom: 1px solid #ddd;
    padding: 12px 0;
  }
  #commentsList li .comment-header {
    font-weight: 700;
    color: #bb1919;
    margin-bottom: 4px;
  }
  #commentsList li .comment-body {
    white-space: pre-wrap;
  }

  /* Emoji reactions */
  .emoji-reactions {
    margin-top: 16px;
    display: flex;
    gap: 24px;
  }
  .emoji-button {
    font-size: 28px;
    cursor: pointer;
    border: none;
    background: transparent;
    transition: transform 0.2s ease;
    user-select: none;
  }
  .emoji-button:hover,
  .emoji-button:focus {
    outline: none;
    transform: scale(1.2);
  }
  .emoji-count {
    margin-left: 6px;
    font-weight: 700;
    color: #bb1919;
  }

  /* Subscription Section */
  #subscriptionSection {
    margin-top: 48px;
    padding: 24px;
    background: #fef0f0;
    border: 1.5px solid #bb1919;
    border-radius: 12px;
    max-width: 960px;
    margin-left: auto;
    margin-right: auto;
  }
  #subscriptionSection h3 {
    margin-top: 0;
  }
  #subscriptionSection input[type="email"] {
    width: 100%;
    padding: 10px 12px;
    font-size: 1rem;
    border-radius: 8px;
    border: 1.5px solid #bb1919;
  }
  #subscriptionSection button {
    margin-top: 12px;
    width: 100%;
    background-color: #bb1919;
    color: white;
    font-weight: 700;
    border-radius: 8px;
    padding: 12px;
    border: none;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }
  #subscriptionSection button:hover,
  #subscriptionSection button:focus {
    background-color: #8a1515;
  }
  #subscriptionMessage {
    margin-top: 12px;
    color: green;
    font-weight: 600;
  }

  /* Footer */
  footer {
    background-color: #bb1919;
    color: white;
    text-align: center;
    padding: 12px 0;
    margin-top: auto;
  }

  /* Responsive */
  @media (max-width: 768px) {
    header {
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      text-align: center;
    }
    nav.desktop-nav {
      justify-content: center;
      flex-wrap: wrap;
    }
    main {
      margin: 24px 12px 48px 12px;
      max-width: 100%;
    }
    #subscriptionSection {
      margin: 24px 12px 48px 12px;
      max-width: 100%;
    }
  }
</style>
</head>
<body>
<header role="banner">
  <div class="logo">नारायण भण्डारी</div>
  <nav class="desktop-nav" role="navigation" aria-label="मुख्य मेनु">
    <a href="#" data-section="lekha" class="active">लेख/रचना</a>
    <a href="#" data-section="sahitya">साहित्य</a>
    <a href="#" data-section="loksewa">लोकसेवा</a>
    <a href="#" data-section="patrapatrika">पत्रपत्रिका</a>
    <a href="#" data-section="mero-barema">मेरो बारेमा</a>
  </nav>
</header>

<main tabindex="-1" role="main" aria-live="polite" aria-atomic="true">
  <!-- Dynamic content area -->
</main>

<!-- Subscription Section -->
<section id="subscriptionSection">
  <h3>सदस्यता लिनुहोस्</h3>
  <form id="subscriptionForm" aria-label="समाचारपत्र सदस्यता फारम">
    <input type="email" id="subscriptionEmail" name="subscriptionEmail" placeholder="इमेल ठेगाना" required aria-required="true" />
    <button type="submit">सब्स्क्राइब गर्नुहोस्</button>
  </form>
  <div id="subscriptionMessage" role="status" aria-live="polite"></div>
</section>

<!-- Footer -->
<footer>
  सर्वाधिकार © नारायण भण्डारी, २०८२
</footer>

<script>
(() => {
  const navLinks = document.querySelectorAll('nav.desktop-nav a');
  const main = document.querySelector('main');
  const subscriptionForm = document.getElementById('subscriptionForm');
  const subscriptionEmailInput = document.getElementById('subscriptionEmail');
  const subscriptionMessage = document.getElementById('subscriptionMessage');

  // Comments related elements will be created dynamically per post

  let currentSection = 'lekha';

  // Sample data structure with Facebook and YouTube links in mero-barema section
  const contents = {
    lekha: [
      {
        id: '1',
        title: 'पहिलो लेख',
        htmlContent: '<p>यो मेरो पहिलो लेख हो।</p>'
      }
    ],
    sahitya: [
      {
        id: '2',
        title: 'कविता संग्रह',
        htmlContent: '<p>मेरा मनपर्ने कविताहरू यहाँ समावेश छन्।</p>'
      }
    ],
    loksewa: [],
    patrapatrika: [],
    'mero-barema': [
      {
        id: '3',
        title: 'मेरो बारेमा',
        htmlContent: 
          `<p>नमस्ते! म नारायण भण्डारी, एक लेखक र ब्लगर।</p>
           <p>मेरो फेसबुक लिंक: <a href="https://www.facebook.com/narayanbhandari23/" target="_blank" rel="noopener noreferrer">Facebook</a></p>
           <p>मेरो यूट्यूब च्यानल: <a href="https://www.youtube.com/@ALLINONEFORNEPAL" target="_blank" rel="noopener noreferrer">YouTube</a></p>`
      }
    ]
  };

  // Store and retrieve comments and reactions from localStorage
  const COMMENTS_STORAGE_KEY = 'nv_comments';
  const REACTIONS_STORAGE_KEY = 'nv_reactions';
  const SUBSCRIPTIONS_STORAGE_KEY = 'nv_subscriptions';

  function getStoredComments() {
    const data = localStorage.getItem(COMMENTS_STORAGE_KEY);
    return data ? JSON.parse(data) : {};
  }
  function saveStoredComments(data) {
    localStorage.setItem(COMMENTS_STORAGE_KEY, JSON.stringify(data));
  }

  function getStoredReactions() {
    const data = localStorage.getItem(REACTIONS_STORAGE_KEY);
    return data ? JSON.parse(data) : {};
  }
  function saveStoredReactions(data) {
    localStorage.setItem(REACTIONS_STORAGE_KEY, JSON.stringify(data));
  }

  function getStoredSubscriptions() {
    const data = localStorage.getItem(SUBSCRIPTIONS_STORAGE_KEY);
    return data ? JSON.parse(data) : [];
  }
  function saveStoredSubscriptions(data) {
    localStorage.setItem(SUBSCRIPTIONS_STORAGE_KEY, JSON.stringify(data));
  }

  // --- Navigation ---
  navLinks.forEach(link => {
    link.addEventListener('click', e => {
      e.preventDefault();
      const section = e.target.dataset.section;
      if (section !== currentSection) {
        currentSection = section;
        updateActiveNav();
        renderSection();
      }
    });
  });

  function updateActiveNav() {
    navLinks.forEach(link => {
      if (link.dataset.section === currentSection) {
        link.classList.add('active');
        link.setAttribute('aria-current', 'page');
      } else {
        link.classList.remove('active');
        link.removeAttribute('aria-current');
      }
    });
  }

  // --- Render section content ---
  function renderSection() {
    if (!contents[currentSection] || contents[currentSection].length === 0) {
      main.innerHTML = `<section><h2>${getSectionTitle(currentSection)}</h2><p>यस खण्डमा कुनै सामग्री उपलब्ध छैन।</p></section>`;
      return;
    }

    let html = `<section><h2>${getSectionTitle(currentSection)}</h2>`;

    if (currentSection === 'mero-barema') {
      // Show single about item
      html += contents[currentSection][0].htmlContent;
    } else {
      // Show accordion for posts
      contents[currentSection].forEach(item => {
        html += renderAccordionItem(item);
      });
    }

    html += '</section>';

    main.innerHTML = html;

    // Attach accordion toggle events
    const titles = main.querySelectorAll('.accordion-title');
    titles.forEach(title => {
      title.addEventListener('click', () => {
        toggleAccordion(title);
      });
      title.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          toggleAccordion(title);
        }
      });
      title.setAttribute('aria-expanded', 'false');
    });

    // Render comments and reactions for each post
    contents[currentSection].forEach(item => {
      if(currentSection !== 'mero-barema'){
        renderComments(item.id);
        renderReactions(item.id);
      }
    });
  }

  function toggleAccordion(title) {
    const content = title.nextElementSibling;
    const expanded = title.getAttribute('aria-expanded') === 'true';
    if (expanded) {
      content.style.maxHeight = null;
      title.setAttribute('aria-expanded', 'false');
    } else {
      content.style.maxHeight = content.scrollHeight + 'px';
      title.setAttribute('aria-expanded', 'true');
    }
  }

  function renderAccordionItem(item) {
    let html =
      `<article tabindex="0" class="content-article" aria-label="सामग्री: ${escapeHtml(item.title)}">
        <h3 tabindex="0" role="button" class="accordion-title" aria-expanded="false" aria-controls="content-${item.id}">
          ${escapeHtml(item.title)}
          <span class="material-icons icon-toggle" aria-hidden="true">expand_more</span>
        </h3>
        <div class="accordion-content" id="content-${item.id}" aria-hidden="true" style="max-height: 0; overflow:hidden; transition:max-height 0.35s ease;">
          ${item.htmlContent}
          ${item.youtube ? renderYouTubeEmbed(item.youtube) : ''}
          ${item.pdfURL ? renderPdfEmbed(item.pdfURL) : ''}
          <div id="reaction-container-${item.id}" class="emoji-reactions" aria-label="यो पोष्टमा प्रतिक्रिया दिनुहोस्" role="region"></div>
          <section id="comments-${item.id}" class="comments-section" aria-label="कमेन्टहरू">
            <h3>कमेन्टहरू</h3>
            <form id="comment-form-${item.id}" class="comment-form" aria-label="कमेन्ट फारम">
              <input type="text" id="comment-name-${item.id}" name="commentName" placeholder="तपाईंको नाम" required aria-required="true" />
              <input type="email" id="comment-email-${item.id}" name="commentEmail" placeholder="इमेल (वैकल्पिक)" />
              <textarea id="comment-text-${item.id}" name="commentText" placeholder="यहाँ कमेन्ट लेख्नुहोस्..." required aria-required="true"></textarea>
              <button type="submit" aria-label="कमेन्ट पठाउनुहोस्">कमेन्ट पठाउनुहोस्</button>
            </form>
            <ul id="comments-list-${item.id}" class="comments-list" aria-live="polite" aria-relevant="additions"></ul>
          </section>
        </div>
      </article>`;
    return html;
  }

  function renderYouTubeEmbed(url) {
    const videoId = extractYouTubeID(url);
    if(!videoId) return '';
    return `<iframe class="video-embed" src="https://www.youtube.com/embed/${videoId}" title="YouTube भिडियो" allowfullscreen loading="lazy"></iframe>`;
  }
  function renderPdfEmbed(url) {
    return `<iframe class="pdf-embed" src="${url}" aria-label="PDF कागजात" loading="lazy"></iframe>`;
  }

  // Extract YouTube ID
  function extractYouTubeID(url) {
    try {
      const u = new URL(url);
      if (u.hostname.includes('youtu.be')) {
        return u.pathname.slice(1);
      }
      if (u.hostname.includes('youtube.com')) {
        return u.searchParams.get('v');
      }
    } catch(e) {}
    return null;
  }

  // Escape HTML for safety
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.innerText = text;
    return div.innerHTML;
  }

  // Get section title display string
  function getSectionTitle(key) {
    switch (key) {
      case 'lekha': return 'लेख/रचना';
      case 'sahitya': return 'साहित्य';
      case 'loksewa': return 'लोकसेवा';
      case 'patrapatrika': return 'पत्रपत्रिका';
      case 'mero-barema': return 'मेरो बारेमा';
      default: return '';
    }
  }

  // --- Comments and reactions ---

  function renderComments(postId) {
    const commentListId = `comments-list-${postId}`;
    const commentFormId = `comment-form-${postId}`;
    const nameInputId = `comment-name-${postId}`;
    const emailInputId = `comment-email-${postId}`;
    const textInputId = `comment-text-${postId}`;

    const commentsListEl = document.getElementById(commentListId);
    if (!commentsListEl) return;

    const comments = getStoredComments()[postId] || [];

    if (comments.length === 0) {
      commentsListEl.innerHTML = '<p>अहिले सम्म कुनै कमेन्ट छैन।</p>';
      return;
    }
    let html = '';
    comments.forEach(comment => {
      html += `
        <li tabindex="0">
          <div class="comment-header">${escapeHtml(comment.name)}${comment.email ? ' (' + escapeHtml(comment.email) + ')' : ''}</div>
          <div class="comment-body">${escapeHtml(comment.text)}</div>
        </li>`;
    });
    commentsListEl.innerHTML = html;

    // Add submit listener to form
    const commentForm = document.getElementById(commentFormId);
    if (commentForm && !commentForm.hasListener) {
      commentForm.addEventListener('submit', e => {
        e.preventDefault();
        const name = document.getElementById(nameInputId).value.trim();
        const email = document.getElementById(emailInputId).value.trim();
        const text = document.getElementById(textInputId).value.trim();
        if (!name || !text) {
          alert('कृपया आफ्नो नाम र कमेन्ट दुवै लेख्नुहोस्।');
          return;
        }
        addComment(postId, { name, email: email || null, text, timestamp: new Date().toISOString() });
        commentForm.reset();
      });
      commentForm.hasListener = true;
    }
  }

  function addComment(postId, comment) {
    const allComments = getStoredComments();
    if (!allComments[postId]) {
      allComments[postId] = [];
    }
    allComments[postId].push(comment);
    saveStoredComments(allComments);
    renderComments(postId);
  }

  // --- Emoji Reactions ---
  // Emoji set: 😊 (smile), ❤️ (love), 😞 (upset)
  const emojiSet = [
    { name: 'ramro', symbol: '😊' },
    { name: 'manparyo', symbol: '❤️' },
    { name: 'naramro', symbol: '😞' }
  ];

  function renderReactions(postId) {
    const containerId = `reaction-container-${postId}`;
    const container = document.getElementById(containerId);
    if (!container) return;

    const reactions = getStoredReactions();
    const postReactions = reactions[postId] || { ramro: 0, manparyo: 0, naramro: 0 };

    container.innerHTML = '';
    emojiSet.forEach(emoji => {
      const btn = document.createElement('button');
      btn.className = 'emoji-button';
      btn.setAttribute('aria-label', emoji.name);
      btn.title = emoji.name;
      btn.innerText = emoji.symbol;
      const countSpan = document.createElement('span');
      countSpan.className = 'emoji-count';
      countSpan.innerText = postReactions[emoji.name] || 0;
      btn.appendChild(countSpan);

      btn.addEventListener('click', () => {
        postReactions[emoji.name] = (postReactions[emoji.name] || 0) + 1;
        reactions[postId] = postReactions;
        saveStoredReactions(reactions);
        renderReactions(postId); // Refresh counts visually
      });

      container.appendChild(btn);
    });
  }

  // --- Subscription functionality ---
  subscriptionForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const email = subscriptionEmailInput.value.trim();
    if (!email) {
      alert('कृपया इमेल ठेगाना लेख्नुहोस्।');
      return;
    }
    const subs = getStoredSubscriptions();
    if (subs.includes(email.toLowerCase())) {
      subscriptionMessage.textContent = 'यो इमेल पहिले नै सदस्यता लिइसक्यो।';
      subscriptionEmailInput.value = '';
      return;
    }
    subs.push(email.toLowerCase());
    saveStoredSubscriptions(subs);
    subscriptionMessage.textContent = 'धन्यवाद! तपाईं सफलतापूर्वक सदस्यता लिनुभयो।';
    subscriptionEmailInput.value = '';
  });

  // Initialize page
  updateActiveNav();
  renderSection();

})();
</script>
</body>
</html>
