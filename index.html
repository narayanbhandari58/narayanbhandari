<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>नारायण भण्डारी - व्यक्तिगत वेवसाइट</title>
    <meta name="description" content="नारायण भण्डारीको व्यक्तिगत वेवसाइट" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari&family=Poppins&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <style>
        /* Base & Reset */
        *, *::before, *::after {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: 'Noto Sans Devanagari', 'Poppins', sans-serif;
            background-color: #f8f9fa;
            color: #1a1a1a;
            line-height: 1.6;
            font-size: 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        a {
            color: #bb1919;
            text-decoration: none;
            cursor: pointer;
        }
        a:hover, a:focus {
            text-decoration: underline;
        }
        h1, h2, h3, h4 {
            margin-top: 0;
            color: #bb1919;
            font-weight: 700;
        }
        h1 {
            font-size: 2.75rem;
            letter-spacing: 0.05em;
        }
        h2 {
            font-size: 1.8rem;
            margin-bottom: 0.75rem;
        }
        h3 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
        }
        p {
            margin-bottom: 1em;
            color: #444444;
        }

        /* Header */
        header {
            background-color: #bb1919;
            color: white;
            padding: 16px 24px;
            position: sticky;
            top: 0;
            z-index: 110;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            font-weight: 900;
            font-size: 1.75rem;
            color: white;
            cursor: pointer;
            user-select: none;
        }
        nav.desktop-nav {
            display: flex;
            gap: 16px;
            align-items: center;
        }
        nav.desktop-nav a {
            background: white;
            color: #bb1919;
            border-radius: 6px;
            padding: 8px 14px;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }
        nav.desktop-nav a[aria-current="page"],
        nav.desktop-nav a:hover,
        nav.desktop-nav a:focus {
            background-color: #e63946;
            color: white;
        }

        /* Main */
        main {
            flex-grow: 1;
            max-width: 960px;
            margin: 24px auto 48px auto;
            padding: 0 16px;
            min-height: 60vh;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(187 25 25 / 0.15);
            outline: none;
        }

        /* Section container */
        .section-posts {
            margin-bottom: 48px;
        }
        .section-posts h2 {
            border-bottom: 3px solid #bb1919;
            padding-bottom: 6px;
            margin-bottom: 16px;
        }

        /* Post item */
        .post-item {
            border: 1px solid #bb1919;
            border-radius: 10px;
            padding: 12px 18px;
            margin-bottom: 12px;
            background-color: #fff4f4;
            position: relative;
        }
        .post-item p {
            margin: 0 0 8px 0;
            white-space: pre-wrap;
        }
        .post-delete-btn {
            position: absolute;
            top: 12px;
            right: 18px;
            background: transparent;
            border: none;
            color: #bb1919;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }
        .post-delete-btn:hover,
        .post-delete-btn:focus {
            color: #8a1515;
            outline: none;
        }

        /* Subscription Section */
        #subscriptionSection {
            margin-top: 48px;
            padding: 24px;
            background: #fef0f0;
            border: 1.5px solid #bb1919;
            border-radius: 12px;
            max-width: 960px;
            margin-left: auto;
            margin-right: auto;
        }
        #subscriptionSection h3 {
            margin-top: 0;
        }
        #subscriptionSection input[type="email"] {
            width: 100%;
            padding: 10px 12px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1.5px solid #bb1919;
        }
        #subscriptionSection button {
            margin-top: 12px;
            width: 100%;
            background-color: #bb1919;
            color: white;
            font-weight: 700;
            border-radius: 8px;
            padding: 12px;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        #subscriptionSection button:hover,
        #subscriptionSection button:focus {
            background-color: #8a1515;
        }
        #subscriptionMessage {
            margin-top: 12px;
            font-weight: 600;
        }
        #subscriptionMessage.success {
            color: green;
        }
        #subscriptionMessage.error {
            color: #b00020;
        }

        /* Footer */
        footer {
            background-color: #bb1919;
            color: white;
            text-align: center;
            padding: 12px 0;
            margin-top: auto;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header {
                flex-wrap: wrap;
                gap: 12px;
                justify-content: center;
                text-align: center;
            }
            nav.desktop-nav {
                justify-content: center;
                flex-wrap: wrap;
            }
            main {
                margin: 24px 12px 48px 12px;
                max-width: 100%;
            }
            #subscriptionSection {
                margin: 24px 12px 48px 12px;
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
<header role="banner">
    <h1 class="logo" tabindex="0" role="link" aria-label="होम पेजमा जानुहोस्" title="होम पेजमा जानुहोस्">नारायण भण्डारी</h1>
    <nav class="desktop-nav" role="navigation" aria-label="मुख्य मेनु">
        <a href="javascript:void(0);" data-section="lekha" aria-current="false">लेख/रचना</a>
        <a href="javascript:void(0);" data-section="sahitya" aria-current="false">साहित्य</a>
        <a href="javascript:void(0);" data-section="loksewa" aria-current="false">लोकसेवा</a>
        <a href="javascript:void(0);" data-section="patrapatrika" aria-current="false">पत्रपत्रिका</a>
        <a href="javascript:void(0);" data-section="mero-barema">मेरो बारेमा</a>
    </nav>
</header>

<main tabindex="-1" role="main" aria-live="polite" aria-atomic="true">
    <div id="mainContent" aria-live="polite" aria-atomic="true"></div>
</main>

<!-- Subscription Section -->
<section id="subscriptionSection">
    <h3>समाचारपत्र सदस्यता लिनुहोस्</h3>
    <form id="subscriptionForm" aria-label="समाचारपत्र सदस्यता फारम">
        <input type="email" id="subscriptionEmail" name="subscriptionEmail" placeholder="इमेल ठेगाना" required aria-required="true" />
        <button type="submit">सब्स्क्राइब गर्नुहोस्</button>
    </form>
    <div id="subscriptionMessage" role="status" aria-live="polite"></div>
</section>

<footer>
    सर्वाधिकार © नारायण भण्डारी, <span id="footerYear"></span>
</footer>

<script>
(() => {
    const subscriptionForm = document.getElementById('subscriptionForm');
    const subscriptionEmailInput = document.getElementById('subscriptionEmail');
    const subscriptionMessage = document.getElementById('subscriptionMessage');
    const mainContentDiv = document.getElementById('mainContent');
    const navLinks = document.querySelectorAll('nav.desktop-nav a');
    const logo = document.querySelector('.logo');

    // Define all valid sections and their Nepali names for header display
    const sectionTitles = {
        lekha: 'लेख/रचना',
        sahitya: 'साहित्य',
        loksewa: 'लोकसेवा',
        patrapatrika: 'पत्रपत्रिका'
    };

    // Escape HTML utility
    function escapeHtml(text) {
        return text.replace(/[&<>"']/g, function(m) {
            switch (m) {
                case '&': return '&amp;';
                case '<': return '&lt;';
                case '>': return '&gt;';
                case '"': return '&quot;';
                case "'": return '&#39;';
                default: return m;
            }
        });
    }

    // Render posts grouped by section (home page)
    function renderHomePage() {
        let posts = JSON.parse(localStorage.getItem('nv_posts')) || [];

        if(posts.length === 0) {
            mainContentDiv.innerHTML = '<p>अहिले सम्म कुनै सामग्री उपलब्ध छैन।</p>';
            return;
        }

        // Group posts by section
        const grouped = {};
        posts.forEach(post => {
            if(!grouped[post.section]) grouped[post.section] = [];
            grouped[post.section].push(post.content);
        });

        let html = '';
        // Render each section in order of sectionTitles keys
        for(const secKey of Object.keys(sectionTitles)) {
            if(grouped[secKey] && grouped[secKey].length > 0) {
                html += `<section class="section-posts" aria-label="${sectionTitles[secKey]}">
                    <h2>${sectionTitles[secKey]}</h2>`;
                grouped[secKey].forEach((content, idx) => {
                    html += `<article class="post-item" role="article" aria-label="${sectionTitles[secKey]} - पोस्ट ${idx + 1}">
                        <p>${escapeHtml(content)}</p>
                        <button class="post-delete-btn" aria-label="पोस्ट हटाउनुहोस्" data-section="${secKey}" data-index="${idx}">हटाउनुहोस्</button>
                    </article>`;
                });
                html += '</section>';
            }
        }

        mainContentDiv.innerHTML = html;
    }

    // Render single section with posts (like clicking लेख/रचना only posts)
    function renderSectionPage(sectionKey) {
        let posts = JSON.parse(localStorage.getItem('nv_posts')) || [];
        posts = posts.filter(post => post.section === sectionKey);

        if(posts.length === 0) {
            mainContentDiv.innerHTML = `<p>${sectionTitles[sectionKey]} खण्डमा कुनै पोस्ट छैन।</p>`;
            return;
        }

        let html = `<section class="section-posts" aria-label="${sectionTitles[sectionKey]}">`;
        posts.forEach((post, idx) => {
            html += `<article class="post-item" role="article" aria-label="${sectionTitles[sectionKey]} - पोस्ट ${idx + 1}">
                <p>${escapeHtml(post.content)}</p>
                <button class="post-delete-btn" aria-label="पोस्ट हटाउनुहोस्" data-section="${sectionKey}" data-index="${idx}">हटाउनुहोस्</button>
            </article>`;
        });
        html += '</section>';

        mainContentDiv.innerHTML = html;
    }

    // Delete post handler (works for home page and section pages)
    mainContentDiv.addEventListener('click', e => {
        if(e.target.classList.contains('post-delete-btn')) {
            const section = e.target.getAttribute('data-section');
            const idx = parseInt(e.target.getAttribute('data-index'), 10);
            let posts = JSON.parse(localStorage.getItem('nv_posts')) || [];

            // Filter posts of that section
            const postsInSection = posts.filter(p => p.section === section);
            if(idx >= 0 && idx < postsInSection.length) {
                // Find global index of the post to delete
                let globalIndex = -1, count = 0;
                for(let i=0; i<posts.length; i++) {
                    if(posts[i].section === section) {
                        if(count === idx) {
                            globalIndex = i;
                            break;
                        }
                        count++;
                    }
                }
                if(globalIndex !== -1) {
                    posts.splice(globalIndex,1);
                    localStorage.setItem('nv_posts', JSON.stringify(posts));
                    if(currentSection === 'home') {
                        renderHomePage();
                    } else {
                        renderSectionPage(currentSection);
                    }
                }
            }
        }
    });

    // Email validation
    function isValidEmail(email) {
        const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return re.test(email);
    }

    // Subscription form submit
    subscriptionForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = subscriptionEmailInput.value.trim();
        subscriptionMessage.className = '';
        subscriptionMessage.textContent = '';

        if (!email) {
            subscriptionMessage.textContent = 'कृपया इमेल ठेगाना लेख्नुहोस्।';
            subscriptionMessage.classList.add('error');
            subscriptionEmailInput.focus();
            return;
        }

        if (!isValidEmail(email)) {
            subscriptionMessage.textContent = 'कृपया मान्य इमेल ठेगाना लेख्नुहोस्।';
            subscriptionMessage.classList.add('error');
            subscriptionEmailInput.focus();
            return;
        }

        const subs = JSON.parse(localStorage.getItem('nv_subscriptions')) || [];
        if (subs.includes(email.toLowerCase())) {
            subscriptionMessage.textContent = 'यो इमेल पहिले नै सदस्यता लिइसक्यो।';
            subscriptionMessage.classList.add('error');
            subscriptionEmailInput.value = '';
            subscriptionEmailInput.focus();
            return;
        }
        subs.push(email.toLowerCase());
        localStorage.setItem('nv_subscriptions', JSON.stringify(subs));
        subscriptionMessage.textContent = 'धन्यवाद! तपाईं सफलतापूर्वक सदस्यता लिनुभयो।';
        subscriptionMessage.classList.add('success');
        subscriptionEmailInput.value = '';
    });

    // Navigation and current section state
    let currentSection = 'home'; // 'home' means full home page grouped by section

    function setActiveNav(section) {
        navLinks.forEach(l => {
            if(l.dataset.section === section) {
                l.setAttribute('aria-current', 'page');
            } else {
                l.removeAttribute('aria-current');
            }
        });
    }

    // On clicking nav links
    navLinks.forEach(link => {
        link.addEventListener('click', e => {
            e.preventDefault();
            const section = e.currentTarget.dataset.section;
            if(!section) {
                // For मेरो बारेमा or unknown sections
                mainContentDiv.innerHTML = '<p>यो खण्ड विकासाधीन छ।</p>';
                setActiveNav(null);
                currentSection = null;
                mainContentDiv.focus();
                return;
            }
            currentSection = section;
            setActiveNav(section);
            renderSectionPage(section);
            mainContentDiv.focus();
        });
    });

    // Logo click => go to Home page (all posts grouped by section)
    logo.addEventListener('click', () => {
        currentSection = 'home';
        setActiveNav(null); // no nav active in home page
        renderHomePage();
        mainContentDiv.focus();
    });
    logo.addEventListener('keydown', (e) => {
        if(e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            currentSection = 'home';
            setActiveNav(null);
            renderHomePage();
            mainContentDiv.focus();
        }
    });

    // Footer year
    document.getElementById('footerYear').textContent = new Date().getFullYear();

    // Initial load => home page
    currentSection = 'home';
    setActiveNav(null);
    renderHomePage();

})();
</script>
</body>
</html>
