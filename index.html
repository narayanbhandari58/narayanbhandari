<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>नारायण भण्डारी - व्यक्तिगत वेवसाइट</title>
  <meta name="description" content="नारायण भण्डारीको व्यक्तिगत वेवसाइट" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari&family=Poppins&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <style>
    /* ... [Your existing CSS remains unchanged] ... */
  </style>
</head>
<body>
<header role="banner">
  <h1 class="logo" tabindex="0" role="link" aria-label="होम पेजमा जानुहोस्" title="होम पेजमा जानुहोस्">नारायण भण्डारी</h1>
  <nav class="desktop-nav" role="navigation" aria-label="मुख्य मेनु">
    <a href="javascript:void(0);" data-section="lekha">लेख/रचना</a>
    <a href="javascript:void(0);" data-section="sahitya">साहित्य</a>
    <a href="javascript:void(0);" data-section="loksewa">लोकसेवा</a>
    <a href="javascript:void(0);" data-section="patrapatrika">पत्रपत्रिका</a>
    <a href="javascript:void(0);" data-section="mero-barema">मेरो बारेमा</a>
  </nav>
</header>

<main tabindex="-1" role="main" aria-live="polite" aria-atomic="true">
  <div id="mainContent" aria-live="polite" aria-atomic="true">
    <p>सामग्री लोड हुँदैछ...</p>
  </div>
</main>

<section id="subscriptionSection">
  <h3>समाचारपत्र सदस्यता लिनुहोस्</h3>
  <form id="subscriptionForm" aria-label="समाचारपत्र सदस्यता फारम">
    <input type="email" id="subscriptionEmail" name="subscriptionEmail" placeholder="इमेल ठेगाना" required />
    <button type="submit">सब्स्क्राइब गर्नुहोस्</button>
  </form>
  <div id="subscriptionMessage" role="status" aria-live="polite"></div>
</section>

<footer>
  सर्वाधिकार © नारायण भण्डारी, <span id="footerYear"></span>
</footer>

<script>
(() => {
  const GITHUB_REPO_API = "https://api.github.com/repos/narayanbhandari58/narayanbhandari/contents/posts";
  const mainContentDiv = document.getElementById("mainContent");

  const sectionTitles = {
    lekha: "लेख/रचना",
    sahitya: "साहित्य",
    loksewa: "लोकसेवा",
    patrapatrika: "पत्रपत्रिका",
    "mero-barema": "मेरो बारेमा"
  };

  async function loadPosts() {
    try {
      const res = await fetch(GITHUB_REPO_API);
      if (!res.ok) throw new Error("GitHub बाट पोस्टहरू ल्याउन सकेन");
      const files = await res.json();
      const posts = [];

      for (const file of files) {
        if (file.name.endsWith(".json")) {
          const contentRes = await fetch(file.download_url);
          const post = await contentRes.json();
          posts.push(post);
        }
      }

      return posts;
    } catch (err) {
      console.error("पोस्ट लोड त्रुटि:", err);
      mainContentDiv.innerHTML = "<p>पोस्ट लोड गर्न सकिएन। कृपया पछि प्रयास गर्नुहोस्।</p>";
      return [];
    }
  }

  function escapeHtml(text) {
    if (!text) return "";
    return text.replace(/[&<>"']/g, m => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[m]);
  }

  function groupBySection(posts) {
    const grouped = {};
    posts.forEach(post => {
      const section = post.section || "others";
      if (!grouped[section]) grouped[section] = [];
      grouped[section].push(post);
    });
    return grouped;
  }

  function renderPosts(posts) {
    if (posts.length === 0) {
      mainContentDiv.innerHTML = "<p>अहिले सम्म कुनै सामग्री उपलब्ध छैन।</p>";
      return;
    }

    const grouped = groupBySection(posts);
    let html = "";

    Object.keys(sectionTitles).forEach(key => {
      if (grouped[key] && grouped[key].length > 0) {
        html += `<section class="section-posts" aria-label="${sectionTitles[key]}">
          <h2>${sectionTitles[key]}</h2>`;

        grouped[key].forEach((post, idx) => {
          html += `<article class="post-item" role="article" aria-label="${sectionTitles[key]} - पोस्ट ${idx + 1}">
            <h3>${escapeHtml(post.title)}</h3>
            <div>${post.content}</div>`;
          
          if (post.youtube) {
            html += `<div style="margin-top:10px;">
              <iframe width="100%" height="315" src="${post.youtube.replace("watch?v=", "embed/")}" frameborder="0" allowfullscreen></iframe>
            </div>`;
          }

          html += `</article>`;
        });

        html += `</section>`;
      }
    });

    mainContentDiv.innerHTML = html;
  }

  // Navigation
  const navLinks = document.querySelectorAll("nav.desktop-nav a");
  navLinks.forEach(link => {
    link.addEventListener("click", async e => {
      e.preventDefault();
      const section = e.currentTarget.dataset.section;
      const allPosts = await loadPosts();
      const filtered = allPosts.filter(post => post.section === section);
      renderPosts(filtered);
    });
  });

  document.querySelector(".logo").addEventListener("click", async () => {
    const posts = await loadPosts();
    renderPosts(posts);
  });

  // Subscription Form
  const subscriptionForm = document.getElementById("subscriptionForm");
  const subscriptionEmailInput = document.getElementById("subscriptionEmail");
  const subscriptionMessage = document.getElementById("subscriptionMessage");

  subscriptionForm.addEventListener("submit", e => {
    e.preventDefault();
    const email = subscriptionEmailInput.value.trim();
    subscriptionMessage.className = "";
    subscriptionMessage.textContent = "";

    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      subscriptionMessage.textContent = "मान्य इमेल ठेगाना लेख्नुहोस्।";
      subscriptionMessage.classList.add("error");
      return;
    }

    const subs = JSON.parse(localStorage.getItem("nv_subscriptions") || "[]");
    if (subs.includes(email.toLowerCase())) {
      subscriptionMessage.textContent = "यो इमेल पहिले नै सदस्यता लिइसक्नु भयो।";
      subscriptionMessage.classList.add("error");
    } else {
      subs.push(email.toLowerCase());
      localStorage.setItem("nv_subscriptions", JSON.stringify(subs));
      subscriptionMessage.textContent = "सफलतापूर्वक सदस्यता लिइयो!";
      subscriptionMessage.classList.add("success");
      subscriptionEmailInput.value = "";
    }
  });

  // Load on startup
  document.getElementById("footerYear").textContent = new Date().getFullYear();
  loadPosts().then(renderPosts);
})();
</script>
</body>
</html>
