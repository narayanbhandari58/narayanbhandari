[build]
  publish = "."
  functions = "netlify/functions"

# Global production security headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Route the public/admin API through the hardened wrapper first.
[[redirects]]
  from = "/.netlify/functions/api"
  to = "/.netlify/functions/api-secure"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api-secure"
  status = 200

# Generate the sitemap from the current published post index.
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

# Indexable, server-rendered canonical page for each published post.
[[redirects]]
  from = "/post/:id"
  to = "/.netlify/functions/post?id=:id"
  status = 200
  force = true

# Social preview route. Keep it separate from the canonical post URL.
[[redirects]]
  from = "/share/*"
  to = "/.netlify/functions/share?post=:splat"
  status = 200

[[edge_functions]]
  path = "/share/*"
  function = "share-preview"

# Existing admin.html is the single CMS entry point.
# admin.js switches the authenticated page between management workspaces.
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin/posts"
  to = "/admin.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin/analytics"
  to = "/admin.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin/exams"
  to = "/admin.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin/history"
  to = "/admin.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin/users"
  to = "/admin.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin/account"
  to = "/admin.html"
  status = 200
  force = true
