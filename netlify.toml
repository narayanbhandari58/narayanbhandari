[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/share/*"
  to = "/.netlify/functions/share?post=:splat"
  status = 200

[[edge_functions]]
  path = "/share/*"
  function = "share-preview"
