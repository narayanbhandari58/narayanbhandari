[build]
  publish = "."
  functions = "netlify/functions"

# Route the public/admin API through the security wrapper first.
[[redirects]]
  from = "/.netlify/functions/api"
  to = "/.netlify/functions/api-secure"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api-secure"
  status = 200

# Generate the sitemap from the current published post index.
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

[[redirects]]
  from = "/share/*"
  to = "/.netlify/functions/share?post=:splat"
  status = 200

[[edge_functions]]
  path = "/share/*"
  function = "share-preview"

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
  force = true
