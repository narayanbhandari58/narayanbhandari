[build]
  publish = "."
  functions = "netlify/functions"

# Route the public/admin API through the security wrapper first.
[[redirects]]
  from = "/.netlify/functions/api"
  to = "/.netlify/functions/api-secure"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api-secure"
  status = 200

# Generate the sitemap from the current published post index.
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

# Indexable, server-rendered canonical page for each published post.
[[redirects]]
  from = "/post/:id"
  to = "/.netlify/functions/post?id=:id"
  status = 200
  force = true

# Social preview route. Keep it separate from the canonical post URL.
[[redirects]]
  from = "/share/*"
  to = "/.netlify/functions/share?post=:splat"
  status = 200

[[edge_functions]]
  path = "/share/*"
  function = "share-preview"

# Clean CMS workspaces. The existing admin-v4 UI owns the navbar and section routing.
[[redirects]]
  from = "/admin"
  to = "/admin-v4.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin/posts"
  to = "/admin-v4.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin/analytics"
  to = "/admin-v4.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin/exams"
  to = "/admin-v4.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin/history"
  to = "/admin-v4.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin/users"
  to = "/admin-v4.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin/account"
  to = "/admin-v4.html"
  status = 200
  force = true
