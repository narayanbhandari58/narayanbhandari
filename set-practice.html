/* Set Practice — 2026 mobile exam UI polish */
.set-shell{max-width:1040px;padding:28px 18px 60px}
.set-head h1{color:#650a03;line-height:1.3}
.set-head p{line-height:1.6}
.set-card-grid{gap:18px}
.set-card{position:relative;min-height:170px;padding:22px;border-radius:20px;border-color:#eadfdb;background:linear-gradient(180deg,#fff,#fffaf8);box-shadow:0 8px 24px rgba(15,23,42,.07)}
.set-card:before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:#8f0e04;border-radius:20px 20px 0 0}
.set-card:hover{transform:translateY(-3px);border-color:#d8b8b1;box-shadow:0 14px 30px rgba(101,10,3,.12)}
.set-card h2{font-size:1.2rem}
.set-number-grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.set-number{min-height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:16px;background:linear-gradient(180deg,#fff,#fffaf8)}
.set-number:hover{border-color:#cfa79e}
.set-panel,.set-result{border-radius:20px;box-shadow:0 8px 24px rgba(15,23,42,.06)}
.set-exam-top{position:sticky;top:0;z-index:20;margin:0 auto;padding:12px 2px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid #eadfdb}
#exam{max-width:820px;margin:0 auto}
.set-exam-top>div:first-child{min-width:0}
.set-exam-top strong{display:block;color:#650a03;font-size:.96rem;line-height:1.4}
.set-progress{display:inline-block;margin-top:3px;padding:3px 9px;border-radius:999px;background:#fff3ef;border:1px solid #f1d1c9;color:#8f0e04;font-size:.78rem;font-weight:800}
#timer{display:inline-flex;align-items:center;justify-content:center;min-width:70px;padding:7px 11px;border-radius:10px;background:#111;color:#fff;font-variant-numeric:tabular-nums}
.set-exam-top .btn{min-height:40px;padding:8px 14px}
.set-question{margin:12px auto 0;padding:22px;border-radius:18px;border-color:#e5e7eb;box-shadow:0 8px 26px rgba(15,23,42,.07);background:#fff}
.set-question h3{margin:0 0 18px;font-size:1.1rem;line-height:1.65;color:#20242b}
.set-question>img{max-height:380px;object-fit:contain}
.set-option{display:flex!important;align-items:center;gap:12px;width:100%;min-height:54px;margin:9px 0;padding:11px 14px;border:1px solid #e1e5ea;border-radius:13px;background:#fafbfc;color:#252a31;font-size:.96rem;line-height:1.5;cursor:pointer;transition:border-color .15s,background .15s,box-shadow .15s,transform .15s}
.set-option:hover{border-color:#c9a39b;background:#fff8f6;transform:translateY(-1px)}
.set-option:has(input:checked){border-color:#8f0e04;background:#fff3ef;box-shadow:0 0 0 2px rgba(143,14,4,.08)}
.set-option input{width:20px!important;height:20px!important;min-width:20px!important;flex:0 0 20px;margin:0!important;padding:0!important;accent-color:#8f0e04}
.set-actions{margin-top:16px}
.set-question .set-actions{display:flex;justify-content:space-between;gap:10px;padding-top:12px;border-top:1px solid #eef0f3}
.set-question .set-actions .btn{min-width:120px}
@media(max-width:760px){
 .set-shell{padding:18px 10px 42px}
 .set-head{margin-bottom:14px}
 .set-head h1{font-size:1.45rem}
 .set-head p{font-size:.88rem}
 .set-card-grid{gap:11px}
 .set-card{min-height:0;padding:17px;border-radius:16px}
 .set-number-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .set-number{min-height:68px;padding:12px 8px}
 .set-exam-top{gap:8px;padding:9px 0}
 .set-exam-top>div:last-child{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px}
 #exam{max-width:100%}
 .set-question{margin-top:9px;padding:14px;border-radius:14px}
 .set-question h3{font-size:.98rem;line-height:1.58;margin-bottom:13px}
 .set-option{min-height:52px;margin:7px 0;padding:10px 11px;border-radius:11px;font-size:.9rem;gap:10px}
 .set-option input{width:20px!important;height:20px!important;min-width:20px!important;flex-basis:20px}
 .set-question .set-actions{margin-top:12px;padding-top:10px}
 .set-question .set-actions .btn{flex:1;min-width:0;min-height:44px}
}
@media(max-width:380px){
 .set-exam-top strong{font-size:.88rem}
 .set-option{font-size:.86rem;padding:9px 10px}
