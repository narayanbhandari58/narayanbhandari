<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>नेपाल लोकसेवा Quiz</title><link rel="stylesheet" href="style.css"></head><body><main class="container" style="max-width:760px;padding-top:35px"><a href="index.html">← मुख्य वेबसाइट</a><h1 style="color:var(--primary)">नेपाल लोकसेवा Quiz</h1><div id="progress-text"></div><div id="quiz-wrapper"><div id="quiz-container" class="slide"></div></div><div id="button-container" style="display:flex;justify-content:space-between;margin-top:20px"><button class="btn btn-outline" id="prev-btn">⬅ Previous</button><button class="btn btn-primary" id="next-btn">Next ➡</button><button class="btn btn-primary" id="finish-btn" style="display:none">परिणाम हेर्नुहोस्</button></div></main><div id="popup-overlay" style="display:none;position:fixed;inset:0;background:#0009;align-items:center;justify-content:center;padding:20px"><div style="background:#fff;border-radius:14px;padding:25px;max-width:600px;width:100%"><h2 id="popup-title"></h2><div id="popup-detail"></div><button class="btn btn-primary" onclick="closePopup()">बन्द गर्नुहोस्</button></div></div><script src="script.js"></script><style>#quiz-wrapper{overflow:hidden}.slide{display:flex;transition:transform .35s}.question-card{min-width:100%;padding:22px;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}.options button{display:block;width:100%;margin:8px 0;padding:11px;border:1px solid var(--border);border-radius:9px;background:#fff;cursor:pointer}.options button.correct{background:#3cb371;color:#fff}.options button.wrong{background:#ff6961;color:#fff}</style></body></html>
