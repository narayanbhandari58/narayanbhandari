<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CMS - Narayan Bhandari</title>
<style>
  body { font-family: Arial, sans-serif; background: #f0f0f0; margin: 0; padding: 20px;}
  .hidden { display: none; }
  .login-container, .admin-container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; }
  h2 { text-align: center; }
  label { display: block; margin-top: 10px; }
  input[type=text], input[type=password], textarea, select {
    width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box;
  }
  button {
    margin-top: 15px; padding: 10px 15px; background: #8f0e04; border: none; color: white; cursor: pointer; border-radius: 4px;
  }
  button:hover { background: #a00f05; }
  table { width: 100%; border-collapse: collapse; margin-top: 20px;}
  th, td { border: 1px solid #ccc; padding: 8px; text-align: left;}
  th { background: #8f0e04; color: white; }
  .action-btn { margin-right: 5px; padding: 5px 10px; cursor: pointer; border: none; border-radius: 3px;}
  .edit-btn { background-color: #4CAF50; color: white; }
  .delete-btn { background-color: #f44336; color: white; }
  textarea { height: 100px; }
</style>
</head>
<body>

<div class="login-container" id="login-container">
  <h2>लगइन गर्नुहोस्</h2>
  <form id="login-form">
    <label>प्रयोगकर्ता नाम:
      <input type="text" id="username" required />
    </label>
    <label>पासवर्ड:
      <input type="password" id="password" required />
    </label>
    <button type="submit">लगइन</button>
  </form>
  <p id="login-error" style="color:red;"></p>
</div>

<div class="admin-container hidden" id="admin-container">
  <h2>CMS - सामग्री व्यवस्थापन</h2>
  <button id="add-new-post">नयाँ लेख थप्नुहोस्</button>
  <table id="posts-table">
    <thead>
      <tr>
        <th>शीर्षक</th>
        <th>सेक्सन</th>
        <th>सम्पादन</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div id="post-form-container" class="hidden">
    <h3 id="form-title">नयाँ लेख</h3>
    <form id="post-form">
      <label>शीर्षक:
        <input type="text" id="post-title" required />
      </label>
      <label>सेक्सन:
        <select id="post-section" required>
          <option value="">-- छान्नुहोस् --</option>
          <option value="लेख/रचना">लेख/रचना</option>
          <option value="साहित्य">साहित्य</option>
          <option value="लोकसेवा तयारी">लोकसेवा तयारी</option>
          <option value="पत्रपत्रिका">पत्रपत्रिका</option>
          <option value="मेरो बारेमा">मेरो बारेमा</option>
        </select>
      </label>
      <label>सामग्री:
        <textarea id="post-content" required></textarea>
      </label>
      <label>YouTube लिंक (वैकल्पिक):
        <input type="text" id="post-youtube" />
      </label>
      <button type="submit">सेभ गर्नुहोस्</button>
      <button type="button" id="cancel-post">रद्द गर्नुहोस्</button>
    </form>
  </div>
</div>

<script>
(() => {
  const USERNAME = "Narayan";
  const PASSWORD = "9846";
  
  // तिमीले दिएको GitHub Token यहाँ राख्नुस्:
  const GITHUB_TOKEN = "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";
  
  // GitHub info
  const REPO_OWNER = "narayanbhandari58";
  const REPO_NAME = "narayanbhandari";
  const FILE_PATH = "posts/post.json";
  const BRANCH = "main";

  const loginContainer = document.getElementById("login-container");
  const adminContainer = document.getElementById("admin-container");
  const loginForm = document.getElementById("login-form");
  const loginError = document.getElementById("login-error");

  const addNewPostBtn = document.getElementById("add-new-post");
  const postsTableBody = document.querySelector("#posts-table tbody");

  const postFormContainer = document.getElementById("post-form-container");
  const postForm = document.getElementById("post-form");
  const formTitle = document.getElementById("form-title");

  const postTitle = document.getElementById("post-title");
  const postSection = document.getElementById("post-section");
  const postContent = document.getElementById("post-content");
  const postYoutube = document.getElementById("post-youtube");
  const cancelPostBtn = document.getElementById("cancel-post");

  let posts = [];
  let editingIndex = null;
  let sha = null; // To store file sha for GitHub update

  function showError(msg){
    loginError.textContent = msg;
  }

  function showAdmin(){
    loginContainer.classList.add("hidden");
    adminContainer.classList.remove("hidden");
  }

  function base64ToUtf8(str) {
    return decodeURIComponent(escape(atob(str)));
  }

  function utf8ToBase64(str) {
    return btoa(unescape(encodeURIComponent(str)));
  }

  async function fetchPosts(){
    const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}?ref=${BRANCH}`;
    try {
      const res = await fetch(url, {
        headers: { Authorization: "token " + GITHUB_TOKEN }
      });
      if(!res.ok) throw new Error("GitHub बाट डेटा ल्याउन असफल");
      const data = await res.json();
      sha = data.sha;
      const content = base64ToUtf8(data.content);
      posts = JSON.parse(content);
      renderPosts();
    } catch(e){
      alert("डेटा ल्याउन असफल भयो: " + e.message);
    }
  }

  function renderPosts(){
    postsTableBody.innerHTML = "";
    posts.forEach((p, idx) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${p.title}</td>
        <td>${p.section}</td>
        <td>
          <button class="action-btn edit-btn" data-index="${idx}">सम्पादन</button>
          <button class="action-btn delete-btn" data-index="${idx}">मेटाउनुहोस्</button>
        </td>
      `;
      postsTableBody.appendChild(tr);
    });
  }

  function resetForm(){
    postTitle.value = "";
    postSection.value = "";
    postContent.value = "";
    postYoutube.value = "";
    editingIndex = null;
    formTitle.textContent = "नयाँ लेख";
  }

  function showPostForm(editing){
    postFormContainer.classList.remove("hidden");
    if(editing){
      formTitle.textContent = "लेख सम्पादन गर्नुहोस्";
    } else {
      formTitle.textContent = "नयाँ लेख";
      resetForm();
    }
  }

  function hidePostForm(){
    postFormContainer.classList.add("hidden");
    resetForm();
  }

  async function updatePostsFile(){
    const content = utf8ToBase64(JSON.stringify(posts, null, 2));
    const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;
    const body = {
      message: editingIndex === null ? "Add new post" : "Update post",
      content: content,
      sha: sha,
      branch: BRANCH
    };
    const res = await fetch(url, {
      method: "PUT",
      headers: {
        "Authorization": "token " + GITHUB_TOKEN,
        "Content-Type": "application/json"
      },
      body: JSON.stringify(body)
    });
    if(!res.ok){
      const err = await res.json();
      throw new Error(err.message || "GitHub update असफल");
    }
    const data = await res.json();
    sha = data.content.sha;
  }

  loginForm.addEventListener("submit", e => {
    e.preventDefault();
    const user = document.getElementById("username").value.trim();
    const pass = document.getElementById("password").value.trim();
    if(user === USERNAME && pass === PASSWORD){
      showAdmin();
      fetchPosts();
    } else {
      showError("प्रयोगकर्ता नाम वा पासवर्ड गलत छ।");
    }
  });

  addNewPostBtn.addEventListener("click", () => {
    showPostForm(false);
  });

  cancelPostBtn.addEventListener("click", () => {
    hidePostForm();
  });

  postForm.addEventListener("submit", async e => {
    e.preventDefault();
    const title = postTitle.value.trim();
    const section = postSection.value;
    const content = postContent.value.trim();
    const youtube = postYoutube.value.trim();

    if(!title || !section || !content){
      alert("शीर्षक, सेक्सन, र सामग्री आवश्यक छ।");
      return;
    }

    const newPost = { title, section, content, youtube };

    if(editingIndex === null){
      posts.push(newPost);
    } else {
      posts[editingIndex] = newPost;
    }

    try {
      await updatePostsFile();
      alert("पोष्ट सफलतापूर्वक सेभ भयो।");
      renderPosts();
      hidePostForm();
    } catch(err){
      alert("पोष्ट सेभ गर्न सकिएन: " + err.message);
    }
  });

  postsTableBody.addEventListener("click", e => {
    if(e.target.tagName === "BUTTON"){
      const idx = e.target.getAttribute("data-index");
      if(e.target.classList.contains("edit-btn")){
        editingIndex = Number(idx);
        const p = posts[editingIndex];
        postTitle.value = p.title;
        postSection.value = p.section;
        postContent.value = p.content;
        postYoutube.value = p.youtube || "";
        showPostForm(true);
      } else if(e.target.classList.contains("delete-btn")){
        if(confirm("पोष्ट मेटाउन निश्चित हुनुहुन्छ?")){
          posts.splice(idx, 1);
          updatePostsFile().then(() => {
            alert("पोष्ट मेटाइयो।");
            renderPosts();
            hidePostForm();
          }).catch(err => {
            alert("पोष्ट मेटाउन सकिएन: " + err.message);
          });
        }
      }
    }
  });
})();
</script>

</body>
</html>
