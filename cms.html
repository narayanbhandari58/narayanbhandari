<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CMS प्यानल - नारायण भण्डारी</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari&family=Poppins&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/tinymce@6.8.3/tinymce.min.js" referrerpolicy="origin"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Noto Sans Devanagari', 'Poppins', sans-serif;
      background-color: #f8f9fa;
      display: flex;
      min-height: 100vh;
    }
    #menuToggle {
      position: fixed;
      top: 16px;
      left: 280px; /* initially next to sidebar */
      background: none;
      border: none;
      font-size: 28px;
      cursor: pointer;
      z-index: 160;
      transition: left 0.3s ease;
      color: #bb1919;
      user-select: none;
      display: none; /* Hidden by default, show only after login */
    }
    #menuToggle.hide {
      left: 16px; /* when sidebar hidden, button at left edge */
    }
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: 280px;
      background-color: #fff;
      box-shadow: 2px 0 6px rgba(0,0,0,0.15);
      padding: 24px 20px;
      box-sizing: border-box;
      overflow-y: auto;
      transform: translateX(0);
      transition: transform 0.3s ease;
      z-index: 150;
      display: flex;
      flex-direction: column;
      display: none; /* Initially hidden */
    }
    .sidebar.show {
      display: flex;
    }
    .sidebar.hide {
      transform: translateX(-320px);
    }
    .sidebar h2 {
      font-size: 1.75rem;
      margin-top: 0;
      margin-bottom: 24px;
      color: #bb1919;
      user-select: none;
    }
    .sidebar a#logoutButton {
      color: #bb1919;
      font-weight: 700;
      margin-bottom: 24px;
      text-decoration: none;
      cursor: pointer;
    }
    .sidebar a#logoutButton:hover,
    .sidebar a#logoutButton:focus {
      text-decoration: underline;
      outline: none;
    }
    .recent-posts {
      flex-grow: 1;
      overflow-y: auto;
    }
    .recent-posts h3 {
      margin-top: 0;
      margin-bottom: 12px;
      color: #bb1919;
    }
    .recent-posts ul {
      list-style: none;
      padding-left: 0;
      margin: 0;
    }
    .recent-posts li {
      margin-bottom: 8px;
    }
    .recent-posts li a {
      color: #444;
      text-decoration: none;
      cursor: pointer;
    }
    .recent-posts li a:hover,
    .recent-posts li a:focus {
      text-decoration: underline;
      outline: none;
    }
    .content {
      margin-left: 280px;
      padding: 36px 40px;
      flex-grow: 1;
      background: #ffffff;
      box-shadow: inset 0px 0px 12px rgba(0,0,0,0.05);
      min-height: 100vh;
      transition: margin-left 0.3s ease;
    }
    .content.fullwidth {
      margin-left: 0;
    }
    h1 {
      margin-top: 0;
      color: #bb1919;
      font-size: 2.5rem;
    }
    form {
      margin-bottom: 32px;
      max-width: 820px;
    }
    form input[type="email"],
    form input[type="password"],
    form input[type="text"],
    form input[type="url"],
    form select,
    form textarea {
      width: 100%;
      padding: 12px 16px;
      margin-top: 12px;
      margin-bottom: 20px;
      font-size: 1rem;
      border-radius: 8px;
      border: 1.5px solid #bb1919;
      resize: vertical;
      font-family: inherit;
      box-sizing: border-box;
    }
    form textarea {
      height: 140px;
    }
    form input[type="file"] {
      margin-top: 12px;
      margin-bottom: 24px;
    }
    button {
      background-color: #bb1919;
      color: white;
      font-weight: 700;
      padding: 14px 26px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1.1rem;
      transition: background-color 0.3s ease;
      user-select: none;
    }
    button:hover,
    button:focus {
      background-color: #8a1515;
      outline: none;
    }
    #postsList {
      max-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .post-item {
      background: #fff4f4;
      border: 1.5px solid #bb1919;
      border-radius: 14px;
      padding: 18px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      color: #bb1919;
    }
    .post-item span {
      user-select: none;
    }
    .post-item button {
      background: transparent;
      color: #bb1919;
      font-weight: 700;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      padding: 6px 12px;
      border-radius: 6px;
      transition: background-color 0.3s ease;
    }
    .post-item button:hover,
    .post-item button:focus {
      background-color: #bb1919;
      color: #fff;
      outline: none;
    }
    .pagination {
      margin-top: 24px;
      display: flex;
      gap: 12px;
    }
    .pagination button {
      padding: 10px 16px;
      border-radius: 8px;
      border: 1.5px solid #bb1919;
      background: white;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.3s ease;
    }
    .pagination button:hover,
    .pagination button:focus {
      background-color: #bb1919;
      color: white;
      outline: none;
    }
    .pagination button.active {
      background-color: #8a1515;
      color: white;
      cursor: default;
    }

    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-320px);
      }
      .sidebar.show {
        transform: translateX(0);
      }
      .content {
        margin-left: 0;
        padding: 20px 16px;
      }
      #menuToggle {
        left: 16px !important;
      }
    }
  </style>
</head>
<body>
  <button id="menuToggle" title="Toggle Sidebar" aria-label="साइडबार देखाउने/लुकाउने">&#8942;</button>
  <div class="sidebar" id="sidebar" aria-label="नावीगेसन प्यानल" tabindex="0">
    <h2>CMS प्यानल</h2>
    <a href="#" id="logoutButton" tabindex="0">लगआउट गर्नुहोस्</a>
    <div class="recent-posts">
      <h3>Recent Posts</h3>
      <ul id="recentPostsList" tabindex="0" aria-label="हालैका पोस्टहरूको सूची"></ul>
    </div>
  </div>
  <div class="content fullwidth" id="mainContent" role="main" tabindex="-1" aria-live="polite" aria-atomic="true">
    <h1>CMS प्यानल</h1>
    <form id="loginForm" aria-label="लगइन फारम">
      <input type="email" id="username" placeholder="इमेल" required aria-required="true" aria-label="इमेल ठेगाना" />
      <input type="password" id="password" placeholder="पासवर्ड" required aria-required="true" aria-label="पासवर्ड" />
      <button type="submit">लगइन गर्नुहोस्</button>
    </form>
    <form id="postForm" style="display:none" aria-label="पोष्ट थप्ने फारम">
      <select id="postSection" required aria-required="true" aria-label="सेक्सन छान्नुहोस्">
        <option value="" disabled selected>सेक्सन छान्नुहोस्</option>
        <option value="lekha">लेख/रचना</option>
        <option value="sahitya">साहित्य</option>
        <option value="loksewa">लोकसेवा</option>
        <option value="patrapatrika">पत्रपत्रिका</option>
        <option value="mero-barema">मेरो बारेमा</option>
      </select>
      <input type="text" id="postTitle" placeholder="पोष्टको शीर्षक" required aria-required="true" aria-label="पोष्टको शीर्षक" />
      <textarea id="postContent" aria-label="पोष्ट सामग्री"></textarea>
      <input type="url" id="youtubeLink" placeholder="YouTube भिडियो लिंक (यदि छ भने)" aria-label="YouTube भिडियो लिंक (यदि छ भने)" />
      <input type="text" id="postTags" placeholder="ट्यागहरू (#tag1, #tag2)" aria-label="पोष्टका ट्यागहरू" />
      <label for="postImage" style="font-weight: 600; color: #bb1919;">पोष्टका लागि फोटो अपलोड (वैकल्पिक):</label>
      <input type="file" id="postImage" accept="image/*" aria-label="पोष्ट फोटो अपलोड गर्नुहोस्" />
      <button type="submit">पोष्ट थप्नुहोस्</button>
    </form>
    <div id="postsList" aria-live="polite" aria-atomic="true"></div>
    <div class="pagination" id="pagination" aria-label="पोष्टहरूको पृष्ठक्रम"></div>
  </div>

<script>
  tinymce.init({
    selector: '#postContent',
    height: 300,
    menubar: false,
    plugins: 'link image code lists',
    toolbar: 'undo redo | formatselect | bold italic | alignleft aligncenter alignright | bullist numlist | link image | code'
  });

  const ADMIN_EMAIL = "bhandarinarayan300@gmail.com";
  const ADMIN_PASSWORD = "9846874405n@";
  const SESSION_TIMEOUT = 10 * 60 * 1000;

  const GITHUB_USERNAME = "narayanbhandari58";
  const GITHUB_REPO = "narayanbhandari";
  const GITHUB_TOKEN = "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";

  const API_BASE = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/posts`;

  let sessionTimeout;
  let shaCache = {};
  const loginForm = document.getElementById("loginForm");
  const postForm = document.getElementById("postForm");
  const sidebar = document.getElementById("sidebar");
  const postsList = document.getElementById("postsList");
  const recentPostsList = document.getElementById("recentPostsList");
  const pagination = document.getElementById("pagination");
  const menuToggleBtn = document.getElementById("menuToggle");
  const contentDiv = document.querySelector(".content");
  const postImageInput = document.getElementById("postImage");

  let currentPage = 1;
  const postsPerPage = 10;
  let allPosts = [];

  // Sidebar toggle handler
  function toggleSidebar() {
    if (sidebar.classList.contains("hide")) {
      sidebar.classList.remove("hide");
      menuToggleBtn.style.left = "280px";
      contentDiv.classList.remove("fullwidth");
    } else {
      sidebar.classList.add("hide");
      menuToggleBtn.style.left = "16px";
      contentDiv.classList.add("fullwidth");
    }
  }
  menuToggleBtn.addEventListener("click", () => {
    toggleSidebar();
  });

  // Start session timeout
  function startSessionTimeout() {
    clearTimeout(sessionTimeout);
    sessionTimeout = setTimeout(() => {
      alert("सेसन समाप्त भयो");
      logout();
    }, SESSION_TIMEOUT);
  }

  // Logout process
  function logout() {
    loginForm.style.display = "block";
    postForm.style.display = "none";
    sidebar.classList.add("hide");
    menuToggleBtn.style.display = "none";
    contentDiv.classList.add("fullwidth");
    postsList.innerHTML = "";
    recentPostsList.innerHTML = "";
    localStorage.removeItem("isLoggedIn");
    clearTimeout(sessionTimeout);
  }

  loginForm.addEventListener("submit", async e => {
    e.preventDefault();
    const email = document.getElementById("username").value.trim();
    const pass = document.getElementById("password").value.trim();

    if (email === ADMIN_EMAIL && pass === ADMIN_PASSWORD) {
      loginForm.style.display = "none";
      postForm.style.display = "block";
      sidebar.classList.remove("hide");
      menuToggleBtn.style.display = "block";
      menuToggleBtn.style.left = "280px";
      contentDiv.classList.remove("fullwidth");
      localStorage.setItem("isLoggedIn", "true");
      startSessionTimeout();
      await loadPostsFromGitHub();
    } else {
      alert("गलत लगइन विवरण");
    }
  });

  document.getElementById("logoutButton").addEventListener("click", e => {
    e.preventDefault();
    logout();
  });

  function paginatePosts(posts) {
    const start = (currentPage - 1) * postsPerPage;
    const end = start + postsPerPage;
    return posts.slice(start, end);
  }
  function renderPagination(totalPosts) {
    pagination.innerHTML = '';
    const totalPages = Math.ceil(totalPosts / postsPerPage);
    for (let i = 1; i <= totalPages; i++) {
      const btn = document.createElement("button");
      btn.textContent = i;
      if (i === currentPage) {
        btn.classList.add('active');
        btn.disabled = true;
      }
      btn.onclick = () => {
        currentPage = i;
        renderPosts();
      };
      pagination.appendChild(btn);
    }
  }

  function renderPosts() {
    postsList.innerHTML = "";
    recentPostsList.innerHTML = "";
    const paginated = paginatePosts(allPosts);
    paginated.forEach((post, i) => {
      const index = (currentPage - 1) * postsPerPage + i;
      const div = document.createElement("div");
      div.className = "post-item";
      let imageHTML = '';
      if (post.image) {
        imageHTML = `<img src="${post.image}" alt="Post image" style="max-height:40px; max-width:40px; margin-right:8px; object-fit:cover; border-radius:4px;">`;
      }
      div.innerHTML = `<span>${imageHTML}<strong>${post.title}</strong></span>
        <span>
          <button onclick="editPost(${index})" aria-label="पोष्ट सम्पादन गर्नुहोस्">Edit</button>
          <button onclick="deletePost(${index})" aria-label="पोष्ट मेटाउनुहोस्">Delete</button>
        </span>`;
      postsList.appendChild(div);
    });
    allPosts.slice(0, 10).forEach((post, i) => {
      const li = document.createElement("li");
      li.innerHTML = `<a href="#" onclick="editPost(${i})" tabindex="0">${post.title}</a>`;
      recentPostsList.appendChild(li);
    });
    renderPagination(allPosts.length);
  }

  async function loadPostsFromGitHub() {
    try {
      const res = await fetch(API_BASE, {
        headers: {
          Authorization: `token ${GITHUB_TOKEN}`
        }
      });
      if (!res.ok) {
        throw new Error(`GitHub API error: ${res.status} ${res.statusText}`);
      }
      const files = await res.json();
      allPosts = [];
      for (const file of files) {
        const fileRes = await fetch(file.download_url);
        const fileContent = await fileRes.json();
        allPosts.push(fileContent);
        shaCache[file.name] = file.sha;
      }
      renderPosts();
    } catch (err) {
      alert("GitHub बाट पोस्ट लोड गर्न सकिएन: " + err.message);
    }
  }

  async function addPostToGitHub(post) {
    try {
      const filename = `${post.title.replace(/\s+/g, '_')}_${Date.now()}.json`;
      const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(post))));
      const res = await fetch(`${API_BASE}/${filename}`, {
        method: 'PUT',
        headers: {
          Authorization: `token ${GITHUB_TOKEN}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: `Add post: ${post.title}`,
          content: contentEncoded,
          branch: "main"
        })
      });
      if (!res.ok) {
        throw new Error(`GitHub API error: ${res.status} ${res.statusText}`);
      }
      const data = await res.json();
      shaCache[filename] = data.content.sha;
      return true;
    } catch (err) {
      alert("पोष्ट GitHub मा थप्न सकिएन: " + err.message);
      return false;
    }
  }

  async function deletePostFromGitHub(filename) {
    try {
      const sha = shaCache[filename];
      if (!sha) throw new Error("SHA not found for file.");
      const res = await fetch(`${API_BASE}/${filename}`, {
        method: 'DELETE',
        headers: {
          Authorization: `token ${GITHUB_TOKEN}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: `Delete post: ${filename}`,
          sha: sha,
          branch: "main"
        })
      });
      if (!res.ok) {
        throw new Error(`GitHub API error: ${res.status} ${res.statusText}`);
      }
      delete shaCache[filename];
      return true;
    } catch (err) {
      alert("पोष्ट मेट्न सकिएन: " + err.message);
      return false;
    }
  }

  function getImageBase64(file) {
    return new Promise((resolve, reject) => {
      if (!file) resolve(null);
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error("तस्बिर लोड गर्न सकिएन"));
      reader.readAsDataURL(file);
    });
  }

  document.getElementById("postForm").addEventListener("submit", async e => {
    e.preventDefault();
    const imageFile = postImageInput.files[0];
    let imageBase64 = null;
    if(imageFile) {
      try {
        imageBase64 = await getImageBase64(imageFile);
      } catch(error) {
        alert(error.message);
        return;
      }
    }
    const post = {
      title: document.getElementById("postTitle").value.trim(),
      content: tinymce.get("postContent").getContent(),
      section: document.getElementById("postSection").value,
      youtube: document.getElementById("youtubeLink").value.trim(),
      tags: document.getElementById("postTags").value.split(',').map(t => t.trim()),
      image: imageBase64
    };
    const success = await addPostToGitHub(post);
    if (success) {
      postForm.reset();
      tinymce.get("postContent").setContent('');
      await loadPostsFromGitHub();
    }
  });

  window.editPost = function(index) {
    const post = allPosts[index];
    if (!post) return alert("पोष्ट भेटिएन");
    document.getElementById("postTitle").value = post.title;
    tinymce.get("postContent").setContent(post.content || '');
    document.getElementById("postSection").value = post.section;
    document.getElementById("youtubeLink").value = post.youtube || '';
    document.getElementById("postTags").value = (post.tags || []).join(', ');
    if(post.image) {
      alert("पुरानो फोटो पुनः अपलोड गर्न आवश्यक छ यदि सम्पादन गर्दै हुनुहुन्छ भने।");
    } else {
      postImageInput.value = "";
    }
    const filename = Object.keys(shaCache).find(fn => fn.includes(post.title.replace(/\s+/g, '_')));
    if (filename) {
      deletePostFromGitHub(filename).then(() => loadPostsFromGitHub());
    }
  };

  window.deletePost = async function(index) {
    const post = allPosts[index];
    if (!post) return alert("पोष्ट भेटिएन");
    if (!confirm(`"${post.title}" पोष्ट पक्कै हटाउने?`)) return;
    const filename = Object.keys(shaCache).find(fn => fn.includes(post.title.replace(/\s+/g, '_')));
    if (filename) {
      const success = await deletePostFromGitHub(filename);
      if (success) loadPostsFromGitHub();
    }
  };

  window.addEventListener('load', () => {
    if (localStorage.getItem("isLoggedIn") === "true") {
      loginForm.style.display = "none";
      postForm.style.display = "block";
      sidebar.classList.remove("hide");
      sidebar.style.display = "flex";
      menuToggleBtn.style.display = "block";
      menuToggleBtn.style.left = "280px";
      contentDiv.classList.remove("fullwidth");
      startSessionTimeout();
      loadPostsFromGitHub();
    } else {
      sidebar.classList.add("hide");
      sidebar.style.display = "none";
      menuToggleBtn.style.display = "none";
      contentDiv.classList.add("fullwidth");
    }
  });
</script>
</body>
</html>
