<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CMS प्यानल - नारायण भण्डारी</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari&family=Poppins&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/tinymce@6.8.3/tinymce.min.js" referrerpolicy="origin"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Noto Sans Devanagari', 'Poppins', sans-serif;
      background: #f8f9fa;
      color: #1a1a1a;
      margin: 0;
      display: flex;
      height: 100vh;
    }
    #menuToggle {
      position: fixed;
      top: 15px;
      left: 250px; /* sidebar width */
      z-index: 9999;
      background: transparent;
      border: none;
      font-size: 26px;
      cursor: pointer;
      color: #8f0e04;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 0 5px 5px 0;
      box-shadow: 1px 0 4px rgba(0,0,0,0.1);
      transition: left 0.3s ease;
    }
    .sidebar {
      width: 250px;
      background: #8f0e04;
      color: white;
      padding: 20px;
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      transition: transform 0.3s ease;
      transform: translateX(0);
      z-index: 999;
      box-shadow: 2px 0 5px rgba(0,0,0,0.1);
    }
    .sidebar.hide {
      transform: translateX(-250px);
    }
    .sidebar h2 {
      font-size: 1.5rem;
      margin-bottom: 20px;
    }
    .sidebar a {
      color: white;
      text-decoration: none;
      margin: 10px 0;
      display: block;
      padding: 10px;
      border-radius: 4px;
      transition: background 0.3s;
    }
    .sidebar a:hover {
      background: #660c02;
    }
    .recent-posts ul {
      list-style: none;
      padding: 0;
      max-height: 300px;
      overflow-y: auto;
    }
    .recent-posts li a {
      color: white;
      text-decoration: underline;
      cursor: pointer;
    }
    .content {
      flex-grow: 1;
      padding: 20px;
      margin-left: 250px;
      overflow-y: auto;
      transition: margin-left 0.3s ease;
      height: 100vh;
    }
    .content.fullwidth {
      margin-left: 0;
    }
    h1, h2 {
      color: #8f0e04;
      text-align: center;
    }
    form {
      background: white;
      padding: 20px;
      margin: 0 auto 20px;
      border-radius: 8px;
      max-width: 600px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    textarea {
      display: none;
    }
    button {
      margin-top: 10px;
      width: 100%;
      background: #8f0e04;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
    }
    .post-item {
      background: white;
      margin: 10px auto;
      max-width: 600px;
      padding: 10px;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .post-item button {
      margin-left: 5px;
    }
    .pagination {
      text-align: center;
      margin-top: 20px;
    }
    .pagination button {
      margin: 0 5px;
      padding: 5px 10px;
      background: #8f0e04;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        z-index: 100;
        height: 100vh;
      }
      #menuToggle {
        left: 0;
      }
      .content {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <button id="menuToggle" title="Toggle Sidebar">&#8942;</button>

  <div class="sidebar" id="sidebar">
    <h2>CMS प्यानल</h2>
    <a href="#" id="logoutButton">लगआउट गर्नुहोस्</a>
    <div class="recent-posts">
      <h3>Recent Posts</h3>
      <ul id="recentPostsList"></ul>
    </div>
  </div>

  <div class="content" id="content">
    <h1>CMS प्यानल</h1>

    <form id="loginForm">
      <input type="email" id="username" placeholder="इमेल" required />
      <input type="password" id="password" placeholder="पासवर्ड" required />
      <button type="submit">लगइन गर्नुहोस्</button>
    </form>

    <form id="postForm" style="display:none">
      <select id="postSection" required>
        <option value="" disabled selected>सेक्सन छान्नुहोस्</option>
        <option value="lekha">लेख/रचना</option>
        <option value="sahitya">साहित्य</option>
        <option value="loksewa">लोकसेवा</option>
        <option value="patrapatrika">पत्रपत्रिका</option>
        <option value="mero-barema">मेरो बारेमा</option>
      </select>
      <input type="text" id="postTitle" placeholder="पोष्टको शीर्षक" required />
      <textarea id="postContent"></textarea>
      <input type="url" id="youtubeLink" placeholder="YouTube भिडियो लिंक (यदि छ भने)" />
      <input type="file" id="pdfFile" accept="application/pdf" />
      <input type="text" id="postTags" placeholder="ट्यागहरू (#tag1, #tag2)" />
      <button type="submit">पोष्ट थप्नुहोस्</button>
    </form>

    <div id="postsList"></div>
    <div class="pagination" id="pagination"></div>
  </div>

<script>
  tinymce.init({
    selector: '#postContent',
    height: 300,
    menubar: false,
    plugins: 'link image code lists',
    toolbar: 'undo redo | formatselect | bold italic | alignleft aligncenter alignright | bullist numlist | link image | code'
  });

  const ADMIN_EMAIL = "bhandarinarayan300@gmail.com";
  const ADMIN_PASSWORD = "9846874405n@";
  const SESSION_TIMEOUT = 10 * 60 * 1000;
  const GITHUB_USERNAME = "narayanbhandari58";
  const GITHUB_REPO = "narayanbhandari";
  const GITHUB_BRANCH = "main";  // adjust if needed
  const GITHUB_TOKEN = "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";

  let sessionTimeout;
  let currentPage = 1;
  const postsPerPage = 10;
  const loginForm = document.getElementById("loginForm");
  const postForm = document.getElementById("postForm");
  const sidebar = document.getElementById("sidebar");
  const postsList = document.getElementById("postsList");
  const recentPostsList = document.getElementById("recentPostsList");
  const pagination = document.getElementById("pagination");
  const menuToggle = document.getElementById("menuToggle");
  const contentDiv = document.getElementById("content");

  // Sidebar toggle with 3 dots button
  menuToggle.addEventListener("click", () => {
    sidebar.classList.toggle("hide");
    if(sidebar.classList.contains("hide")){
      menuToggle.style.left = "0";
      contentDiv.classList.add("fullwidth");
    } else {
      menuToggle.style.left = "250px";
      contentDiv.classList.remove("fullwidth");
    }
  });

  // Pagination rendering
  function renderPagination(totalPosts) {
    pagination.innerHTML = '';
    const totalPages = Math.ceil(totalPosts / postsPerPage);
    for (let i = 1; i <= totalPages; i++) {
      const btn = document.createElement("button");
      btn.textContent = i;
      btn.onclick = () => {
        currentPage = i;
        loadPosts();
      };
      pagination.appendChild(btn);
    }
  }

  // Load posts from GitHub repo
  async function loadPosts() {
    postsList.innerHTML = "";
    recentPostsList.innerHTML = "";

    try {
      const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/posts?ref=${GITHUB_BRANCH}`, {
        headers: {
          Authorization: `token ${GITHUB_TOKEN}`
        }
      });
      if (!response.ok) throw new Error("GitHub repo बाट पोस्ट लोड गर्न सकिएन");
      const files = await response.json();

      // Filter only .md files and sort by name (you can add better sorting logic if you want)
      const mdFiles = files.filter(f => f.name.endsWith(".md")).sort((a,b) => a.name.localeCompare(b.name));

      // Fetch content of each md file
      const posts = [];
      for(let i=0; i < mdFiles.length; i++){
        const file = mdFiles[i];
        const contentResponse = await fetch(file.download_url);
        const contentText = await contentResponse.text();

        // Simple parse title and body from markdown (first line as title, rest as content)
        const lines = contentText.split("\n");
        const titleLine = lines.find(line => line.trim().length > 0);
        const title = titleLine ? titleLine.replace(/^#\s*/, '').trim() : file.name.replace(".md", "");
        const body = contentText;

        posts.push({
          title,
          content: body,
          filename: file.name
        });
      }

      // Paginate posts for display
      const totalPosts = posts.length;
      const start = (currentPage - 1) * postsPerPage;
      const end = start + postsPerPage;
      const paginated = posts.slice(start, end);

      paginated.forEach((post, i) => {
        const div = document.createElement("div");
        div.className = "post-item";
        div.innerHTML = `<span><strong>${post.title}</strong></span>
          <span>
            <button onclick="editPost('${post.filename}')">Edit</button>
            <button onclick="deletePost('${post.filename}')">Delete</button>
          </span>`;
        postsList.appendChild(div);
      });

      // Recent posts (first 10)
      posts.slice(0, 10).forEach(post => {
        const li = document.createElement("li");
        li.innerHTML = `<a href="#" onclick="editPost('${post.filename}')">${post.title}</a>`;
        recentPostsList.appendChild(li);
      });

      renderPagination(totalPosts);
    } catch (error) {
      alert(error.message);
    }
  }

  // Create or update a file in GitHub repo
  async function createOrUpdateFile(filename, content, message) {
    try {
      // First, get SHA if file exists (required for update)
      let sha = null;
      const getResponse = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/posts/${filename}`, {
        headers: { Authorization: `token ${GITHUB_TOKEN}` }
      });
      if (getResponse.ok) {
        const fileData = await getResponse.json();
        sha = fileData.sha;
      }

      const putResponse = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/posts/${filename}`, {
        method: "PUT",
        headers: {
          Authorization: `token ${GITHUB_TOKEN}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: message,
          content: btoa(unescape(encodeURIComponent(content))),
          sha: sha,
          branch: GITHUB_BRANCH
        })
      });

      if (!putResponse.ok) {
        const errData = await putResponse.json();
        throw new Error(errData.message || "GitHub मा फाइल अपलोड गर्दा समस्या");
      }

      return await putResponse.json();

    } catch (err) {
      alert("GitHub अपडेटमा त्रुटि: " + err.message);
      throw err;
    }
  }

  // Delete file from GitHub repo
  async function deleteFile(filename) {
    try {
      // Get file SHA
      const getResponse = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/posts/${filename}`, {
        headers: { Authorization: `token ${GITHUB_TOKEN}` }
      });
      if (!getResponse.ok) throw new Error("फाइल फेला परेन");

      const fileData = await getResponse.json();
      const sha = fileData.sha;

      const deleteResponse = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/posts/${filename}`, {
        method: "DELETE",
        headers: {
          Authorization: `token ${GITHUB_TOKEN}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: `Delete post ${filename}`,
          sha: sha,
          branch: GITHUB_BRANCH
        })
      });

      if (!deleteResponse.ok) {
        const errData = await deleteResponse.json();
        throw new Error(errData.message || "GitHub मा फाइल मेट्दा समस्या");
      }

      return await deleteResponse.json();

    } catch (err) {
      alert("GitHub मेट्दा त्रुटि: " + err.message);
      throw err;
    }
  }

  // Edit post (load content from GitHub file)
  async function editPost(filename) {
    try {
      const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/posts/${filename}`, {
        headers: { Authorization: `token ${GITHUB_TOKEN}` }
      });
      if (!response.ok) throw new Error("फाइल लोड गर्न सकिएन");

      const fileData = await response.json();
      const content = atob(fileData.content);

      // Parse markdown content to fill form
      // Simple parse: first line title, rest content
      const lines = content.split("\n");
      const titleLine = lines.find(line => line.trim().length > 0);
      const title = titleLine ? titleLine.replace(/^#\s*/, '') : filename.replace(".md", "");
      const body = content;

      document.getElementById("postTitle").value = title;
      tinymce.get("postContent").setContent(body);
      document.getElementById("postSection").value = "";  // Could add frontmatter for section if needed
      document.getElementById("youtubeLink").value = "";
      document.getElementById("postTags").value = "";

      // Remove previous edit post filename in local storage and save current
      localStorage.setItem("editingFilename", filename);

      // Show post form and hide login form
      loginForm.style.display = "none";
      postForm.style.display = "block";
      sidebar.classList.remove("hide");
      contentDiv.classList.remove("fullwidth");

      clearTimeout(sessionTimeout);
      startSessionTimeout();

    } catch (err) {
      alert("पोष्ट सम्पादन गर्न समस्या: " + err.message);
    }
  }

  // Delete post handler
  async function deletePost(filename) {
    if (!confirm("पक्का हटाउने?")) return;
    try {
      await deleteFile(filename);
      alert("पोष्ट हटाइयो");
      loadPosts();
    } catch {
      // error handled in deleteFile
    }
  }

  // Logout function
  function logout() {
    loginForm.style.display = "block";
    postForm.style.display = "none";
    sidebar.classList.remove("hide");
    contentDiv.classList.add("fullwidth");
    clearTimeout(sessionTimeout);
    localStorage.removeItem("isLoggedIn");
    localStorage.removeItem("editingFilename");
  }

  // Start session timeout
  function startSessionTimeout() {
    clearTimeout(sessionTimeout);
    sessionTimeout = setTimeout(() => {
      alert("सेसन समाप्त भयो");
      logout();
    }, SESSION_TIMEOUT);
  }

  // Login form submit
  loginForm.addEventListener("submit", e => {
    e.preventDefault();
    const email = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    if (email === ADMIN_EMAIL && password === ADMIN_PASSWORD) {
      alert("लगइन सफल");
      loginForm.style.display = "none";
      postForm.style.display = "block";
      localStorage.setItem("isLoggedIn", "true");
      sidebar.classList.remove("hide");
      contentDiv.classList.remove("fullwidth");
      loadPosts();
      startSessionTimeout();
    } else {
      alert("गलत इमेल वा पासवर्ड");
    }
  });

  // Logout button click
  document.getElementById("logoutButton").addEventListener("click", e => {
    e.preventDefault();
    logout();
  });

  // Post form submit (create or update post)
  postForm.addEventListener("submit", async e => {
    e.preventDefault();

    const section = document.getElementById("postSection").value;
    const title = document.getElementById("postTitle").value.trim();
    const content = tinymce.get("postContent").getContent();
    const youtubeLink = document.getElementById("youtubeLink").value.trim();
    const tags = document.getElementById("postTags").value.trim();
    const editingFilename = localStorage.getItem("editingFilename");

    if (!section) {
      alert("कृपया सेक्सन छान्नुहोस्");
      return;
    }
    if (!title) {
      alert("शीर्षक अनिवार्य छ");
      return;
    }

    // Markdown content building
    let mdContent = `# ${title}\n\n`;

    if (youtubeLink) {
      mdContent += `YouTube भिडियो लिंक: ${youtubeLink}\n\n`;
    }
    if (tags) {
      mdContent += `ट्यागहरू: ${tags}\n\n`;
    }

    // Tinymce HTML to markdown-like (simple strip html tags for now)
    // For better, install proper md converter if needed.
    const tempDiv = document.createElement("div");
    tempDiv.innerHTML = content;
    const textContent = tempDiv.textContent || tempDiv.innerText || "";
    mdContent += textContent;

    // Filename generate from title slug (replace spaces etc)
    let filenameBase = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
    if (!filenameBase) filenameBase = "post";

    const filename = editingFilename || `${filenameBase}.md`;

    try {
      await createOrUpdateFile(filename, mdContent, editingFilename ? `Update post ${filename}` : `Add new post ${filename}`);
      alert("पोष्ट सफलतापूर्वक सुरक्षित भयो");
      localStorage.removeItem("editingFilename");
      postForm.reset();
      tinymce.get("postContent").setContent("");
      loadPosts();
    } catch (error) {
      // error handled in createOrUpdateFile
    }
  });

  // On page load
  window.onload = () => {
    if(localStorage.getItem("isLoggedIn") === "true") {
      loginForm.style.display = "none";
      postForm.style.display = "block";
      loadPosts();
      startSessionTimeout();
    } else {
      loginForm.style.display = "block";
      postForm.style.display = "none";
      sidebar.classList.remove("hide");
      contentDiv.classList.add("fullwidth");
    }
  };
</script>

</body>
</html>
