<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CMS प्यानल - नारायण भण्डारी</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari&family=Poppins&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/tinymce@6.8.3/tinymce.min.js" referrerpolicy="origin"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Noto Sans Devanagari', 'Poppins', sans-serif;
      background: #f8f9fa;
      color: #1a1a1a;
      margin: 0;
      display: flex;
      height: 100vh;
    }
    .sidebar {
      width: 250px;
      background: #8f0e04;
      color: white;
      padding: 20px;
      display: none;
      flex-direction: column;
      position: relative;
    }
    .sidebar.show {
      display: flex !important;
    }
    .sidebar h2 {
      font-size: 1.5rem;
      margin-bottom: 20px;
    }
    .sidebar a {
      color: white;
      text-decoration: none;
      margin: 10px 0;
      display: block;
      padding: 10px;
      border-radius: 4px;
      transition: background 0.3s;
    }
    .sidebar a:hover {
      background: #660c02;
    }
    .recent-posts ul {
      list-style: none;
      padding: 0;
    }
    .recent-posts li a {
      color: white;
      text-decoration: underline;
    }
    .toggle-sidebar {
      position: absolute;
      top: 10px;
      right: -35px;
      width: 30px;
      height: 30px;
      border-radius: 4px;
      border: none;
      background: #8f0e04;
      color: white;
      font-size: 22px;
      cursor: pointer;
      z-index: 1000;
    }
    .content {
      flex-grow: 1;
      padding: 20px;
      overflow-y: auto;
    }
    h1, h2 {
      color: #8f0e04;
      text-align: center;
    }
    form {
      background: white;
      padding: 20px;
      margin: 0 auto 20px;
      border-radius: 8px;
      max-width: 600px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    textarea {
      display: none;
    }
    button {
      margin-top: 10px;
      width: 100%;
      background: #8f0e04;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
    }
    .post-item {
      background: white;
      margin: 10px auto;
      max-width: 600px;
      padding: 10px;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .post-item button {
      margin-left: 5px;
    }
    .pagination {
      text-align: center;
      margin-top: 20px;
    }
    .pagination button {
      margin: 0 5px;
      padding: 5px 10px;
      background: #8f0e04;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="sidebar" id="sidebar">
    <button class="toggle-sidebar" id="toggleSidebar">☰</button>
    <h2>CMS प्यानल</h2>
    <a href="#" id="logoutButton">लगआउट गर्नुहोस्</a>
    <div class="recent-posts">
      <h3>Recent Posts</h3>
      <ul id="recentPostsList"></ul>
    </div>
  </div>
  <div class="content">
    <h1>CMS प्यानल</h1>
    <form id="loginForm">
      <input type="email" id="username" placeholder="इमेल" required />
      <input type="password" id="password" placeholder="पासवर्ड" required />
      <button type="submit">लगइन गर्नुहोस्</button>
    </form>
    <script>

  const GITHUB_USERNAME = "narayanbhandari58";
  const GITHUB_REPO = "narayanbhandari";

  document.getElementById("toggleSidebar").addEventListener("click", () => {
    document.getElementById("sidebar").classList.toggle("show");
  });

    const username = document.getElementById("bhandarinarayan300@gmail.com").value;

    <form id="postForm" style="display:none">
      <select id="postSection" required>
        <option value="" disabled selected>सेक्सन छान्नुहोस्</option>
        <option value="lekha">लेख/रचना</option>
        <option value="sahitya">साहित्य</option>
        <option value="loksewa">लोकसेवा</option>
        <option value="patrapatrika">पत्रपत्रिका</option>
        <option value="mero-barema">मेरो बारेमा</option>
      </select>
      <input type="text" id="postTitle" placeholder="पोष्टको शीर्षक" required />
      <textarea id="postContent"></textarea>
      <input type="url" id="youtubeLink" placeholder="YouTube भिडियो लिंक (यदि छ भने)" />
      <input type="file" id="pdfFile" accept="application/pdf" />
      <input type="text" id="postTags" placeholder="ट्यागहरू (#tag1, #tag2)" />
      <button type="submit">पोष्ट थप्नुहोस्</button>
    </form>
    <div id="postsList"></div>
    <div class="pagination" id="pagination"></div>
  </div>
  <script>
    const GITHUB_TOKEN = "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";
    const GITHUB_USERNAME = "narayanbhandari58";
    const GITHUB_REPO = "narayanbhandari";

    document.getElementById("toggleSidebar").addEventListener("click", () => {
      document.getElementById("sidebar").classList.toggle("show");
    });

    // ... rest of existing script (post saving, editing, deleting, login) remains unchanged
  </script>
</body>
</html>
