<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CMS प्यानल - नारायण भण्डारी</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari&family=Poppins&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/tinymce@6.8.3/tinymce.min.js" referrerpolicy="origin"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Noto Sans Devanagari', 'Poppins', sans-serif;
      background: #f8f9fa;
      color: #1a1a1a;
      margin: 0;
      display: flex;
      height: 100vh;
    }
    .sidebar {
      width: 250px;
      background: #8f0e04;
      color: white;
      padding: 20px;
      display: none;
      flex-direction: column;
      position: relative;
    }
    .sidebar.show {
      display: flex !important;
    }
    .sidebar h2 {
      font-size: 1.5rem;
      margin-bottom: 20px;
    }
    .sidebar a {
      color: white;
      text-decoration: none;
      margin: 10px 0;
      display: block;
      padding: 10px;
      border-radius: 4px;
      transition: background 0.3s;
    }
    .sidebar a:hover {
      background: #660c02;
    }
    .recent-posts {
      margin-top: 20px;
    }
    .recent-posts ul {
      list-style: none;
      padding: 0;
    }
    .recent-posts li {
      background: white;
      margin: 5px 0;
      padding: 10px;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .recent-posts li span {
      color: #1a1a1a;
    }
    .recent-posts li button {
      margin-left: 5px;
      background: #8f0e04;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
    }
    .recent-posts li button:hover {
      background: #660c02;
    }
    .toggle-sidebar {
      position: absolute;
      top: 10px;
      right: -35px;
      width: 30px;
      height: 30px;
      border-radius: 4px;
      border: none;
      background: #8f0e04;
      color: white;
      font-size: 22px;
      cursor: pointer;
      z-index: 1000;
    }
    .content {
      flex-grow: 1;
      padding: 20px;
      overflow-y: auto;
    }
    h1, h2 {
      color: #8f0e04;
      text-align: center;
    }
    form {
      background: white;
      padding: 20px;
      margin: 0 auto 20px;
      border-radius: 8px;
      max-width: 600px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      margin-top: 10px;
      width: 100%;
      background: #8f0e04;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
    }
    .pagination {
      text-align: center;
      margin-top: 20px;
    }
    .pagination button {
      margin: 0 5px;
      padding: 5px 10px;
      background: #8f0e04;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="sidebar" id="sidebar">
    <button class="toggle-sidebar" id="toggleSidebar">☰</button>
    <h2>CMS प्यानल</h2>
    <a href="#" id="logoutButton">लगआउट गर्नुहोस्</a>
    <div class="recent-posts">
      <h3>Recent Posts</h3>
      <ul id="recentPostsList"></ul>
    </div>
  </div>
  <div class="content">
    <h1>CMS प्यानल</h1>
    <form id="loginForm">
      <input type="email" id="username" placeholder="इमेल" required />
      <input type="password" id="password" placeholder="पासवर्ड" required />
      <button type="submit">लगइन गर्नुहोस्</button>
    </form>
    <form id="postForm" style="display:none">
      <select id="postSection" required>
        <option value="" disabled selected>सेक्सन छान्नुहोस्</option>
        <option value="lekha">लेख/रचना</option>
        <option value="sahitya">साहित्य</option>
        <option value="loksewa">लोकसेवा</option>
        <option value="patrapatrika">पत्रपत्रिका</option>
        <option value="mero-barema">मेरो बारेमा</option>
      </select>
      <input type="text" id="postTitle" placeholder="पोष्टको शीर्षक" required />
      <textarea id="postContent" placeholder="यहाँ सामग्री लेख्नुहोस्..." required></textarea>
      <input type="url" id="youtubeLink" placeholder="YouTube भिडियो लिंक (यदि छ भने)" />
      <input type="file" id="pdfFile" accept="application/pdf" />
      <input type="text" id="postTags" placeholder="ट्यागहरू (#tag1, #tag2)" />
      <button type="submit">पोष्ट थप्नुहोस्</button>
    </form>
    <div id="postsList"></div>
    <div class="pagination" id="pagination"></div>
  </div>
  <script>
    const GITHUB_TOKEN = "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";
    const GITHUB_USERNAME = "narayanbhandari58";
    const GITHUB_REPO = "narayanbhandari";

    let posts = []; // Array to store posts

    // Initialize TinyMCE
    tinymce.init({
      selector: '#postContent',
      plugins: 'lists link image charmap print preview anchor',
      toolbar: 'undo redo | styleselect | bold italic underline | alignleft aligncenter alignright alignjustify | outdent indent | link image',
      menubar: false,
      height: 300,
      setup: function (editor) {
        editor.on('change', function () {
          editor.save();
        });
      }
    });

    // Check if user is already logged in
    if (localStorage.getItem("loggedIn") === "true") {
      document.getElementById("loginForm").style.display = "none";
      document.getElementById("postForm").style.display = "block";
      displayRecentPosts();
    }

    document.getElementById("toggleSidebar").addEventListener("click", () => {
      document.getElementById("sidebar").classList.toggle("show");
    });

    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault(); // Prevent the form from submitting

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      // Validate with provided credentials
      if (username === "bhandarinarayan300@gmail.com" && password === "9846874405n@") {
        // Set session in localStorage
        localStorage.setItem("loggedIn", "true");
        // Hide login form and show post form
        document.getElementById("loginForm").style.display = "none";
        document.getElementById("postForm").style.display = "block";
        displayRecentPosts();
      } else {
        alert("इमेल वा पासवर्ड गलत छ।");
      }
    });

    document.getElementById("logoutButton").addEventListener("click", function() {
      // Clear session
      localStorage.removeItem("loggedIn");
      document.getElementById("loginForm").style.display = "block";
      document.getElementById("postForm").style.display = "none";
    });

    document.getElementById("postForm").addEventListener("submit", function(event) {
      event.preventDefault(); // Prevent the form from submitting

      const section = document.getElementById("postSection").value;
      const title = document.getElementById("postTitle").value;
      const content = tinymce.get("postContent").getContent(); // Get content from TinyMCE
      const youtubeLink = document.getElementById("youtubeLink").value;
      const pdfFile = document.getElementById("pdfFile").files[0];
      const tags = document.getElementById("postTags").value;

      // Create a new post object
      const newPost = {
        id: Date.now(), // Unique ID based on timestamp
        section,
        title,
        content,
        youtubeLink,
        pdfFile,
        tags
      };

      // Add the new post to the posts array
      posts.push(newPost);
      displayRecentPosts();

      // Send the post to the main website (narayan-bhandari.com.np)
      sendPostToMainWebsite(newPost);

      // Clear the form after submission
      document.getElementById("postForm").reset();
      tinymce.get("postContent").setContent(''); // Clear TinyMCE content
    });

    function sendPostToMainWebsite(post) {
      // Example API call to send the post to the main website
      fetch(`https://narayan-bhandari.com.np/api/posts`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${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}` // Use your actual token or authentication method
        },
        body: JSON.stringify(post)
      })
      .then(response => {
        if (!response.ok) {
          throw new Error('Network response was not ok');
        }
        return response.json();
      })
      .then(data => {
        console.log('Post successfully sent to main website:', data);
      })
      .catch(error => {
        console.error('There was a problem with the fetch operation:', error);
      });
    }

    function displayRecentPosts() {
      const recentPostsList = document.getElementById("recentPostsList");
      recentPostsList.innerHTML = ''; // Clear existing posts

      posts.forEach(post => {
        const listItem = document.createElement("li");
        listItem.innerHTML = `
          <span>${post.title}</span>
          <div>
            <button onclick="editPost(${post.id})">Edit</button>
            <button onclick="deletePost(${post.id})">Delete</button>
          </div>
        `;
        recentPostsList.appendChild(listItem);
      });
    }

    function editPost(postId) {
      const post = posts.find(p => p.id === postId);
      if (post) {
        document.getElementById("postSection").value = post.section;
        document.getElementById("postTitle").value = post.title;
        tinymce.get("postContent").setContent(post.content);
        document.getElementById("youtubeLink").value = post.youtubeLink;
        document.getElementById("postTags").value = post.tags;

        // Remove the post from the array for editing
        posts = posts.filter(p => p.id !== postId);
        displayRecentPosts();
      }
    }

    function deletePost(postId) {
      posts = posts.filter(p => p.id !== postId);
      displayRecentPosts();
    }
  </script>
</body>
</html>
