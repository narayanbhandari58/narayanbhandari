<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CMS प्यानल - नारायण भण्डारी</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari&family=Poppins&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/tinymce@6.8.3/tinymce.min.js" referrerpolicy="origin"></script>
  <style>
    /* CSS unchanged from your previous version with sidebar toggle 3dots */
    /* ... Your existing CSS with sidebar and 3 dots toggle ... */
  </style>
</head>
<body>
  <button id="menuToggle" title="Toggle Sidebar">&#8942;</button>
  <div class="sidebar" id="sidebar">
    <h2>CMS प्यानल</h2>
    <a href="#" id="logoutButton">लगआउट गर्नुहोस्</a>
    <div class="recent-posts">
      <h3>Recent Posts</h3>
      <ul id="recentPostsList"></ul>
    </div>
  </div>
  <div class="content">
    <h1>CMS प्यानल</h1>
    <form id="loginForm">
      <input type="email" id="username" placeholder="इमेल" required />
      <input type="password" id="password" placeholder="पासवर्ड" required />
      <button type="submit">लगइन गर्नुहोस्</button>
    </form>
    <form id="postForm" style="display:none">
      <select id="postSection" required>
        <option value="" disabled selected>सेक्सन छान्नुहोस्</option>
        <option value="lekha">लेख/रचना</option>
        <option value="sahitya">साहित्य</option>
        <option value="loksewa">लोकसेवा</option>
        <option value="patrapatrika">पत्रपत्रिका</option>
        <option value="mero-barema">मेरो बारेमा</option>
      </select>
      <input type="text" id="postTitle" placeholder="पोष्टको शीर्षक" required />
      <textarea id="postContent"></textarea>
      <input type="url" id="youtubeLink" placeholder="YouTube भिडियो लिंक (यदि छ भने)" />
      <input type="text" id="postTags" placeholder="ट्यागहरू (#tag1, #tag2)" />
      <button type="submit">पोष्ट थप्नुहोस्</button>
    </form>
    <div id="postsList"></div>
    <div class="pagination" id="pagination"></div>
  </div>

  <script>
    tinymce.init({
      selector: '#postContent',
      height: 300,
      menubar: false,
      plugins: 'link image code lists',
      toolbar: 'undo redo | formatselect | bold italic | alignleft aligncenter alignright | bullist numlist | link image | code'
    });

    const ADMIN_EMAIL = "bhandarinarayan300@gmail.com";
    const ADMIN_PASSWORD = "9846874405n@";
    const SESSION_TIMEOUT = 10 * 60 * 1000;

    // GitHub repo config
    const GITHUB_USERNAME = "narayanbhandari58";
    const GITHUB_REPO = "narayanbhandari";
    const GITHUB_TOKEN = "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";  // तपाईंको टोकन यहाँ राख्नुहोस्

    const API_BASE = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/posts`;

    let sessionTimeout;
    let shaCache = {};  // फाइलका SHA हरू ट्रयाक गर्न (edit/delete को लागि)

    const loginForm = document.getElementById("loginForm");
    const postForm = document.getElementById("postForm");
    const sidebar = document.getElementById("sidebar");
    const postsList = document.getElementById("postsList");
    const recentPostsList = document.getElementById("recentPostsList");
    const pagination = document.getElementById("pagination");

    let currentPage = 1;
    const postsPerPage = 10;
    let allPosts = [];

    document.getElementById("menuToggle").addEventListener("click", () => {
      sidebar.classList.toggle("show");
    });

    function startSessionTimeout() {
      clearTimeout(sessionTimeout);
      sessionTimeout = setTimeout(() => {
        alert("सेसन समाप्त भयो");
        logout();
      }, SESSION_TIMEOUT);
    }

    function logout() {
      loginForm.style.display = "block";
      postForm.style.display = "none";
      sidebar.classList.remove("show");
      postsList.innerHTML = "";
      recentPostsList.innerHTML = "";
      localStorage.removeItem("isLoggedIn");
      clearTimeout(sessionTimeout);
    }

    loginForm.addEventListener("submit", async e => {
      e.preventDefault();
      const email = document.getElementById("username").value.trim();
      const pass = document.getElementById("password").value.trim();

      if (email === ADMIN_EMAIL && pass === ADMIN_PASSWORD) {
        loginForm.style.display = "none";
        postForm.style.display = "block";
        sidebar.classList.add("show");
        localStorage.setItem("isLoggedIn", "true");
        startSessionTimeout();
        await loadPostsFromGitHub();
      } else {
        alert("गलत लगइन विवरण");
      }
    });

    document.getElementById("logoutButton").addEventListener("click", e => {
      e.preventDefault();
      logout();
    });

    function paginatePosts(posts) {
      const start = (currentPage - 1) * postsPerPage;
      const end = start + postsPerPage;
      return posts.slice(start, end);
    }

    function renderPagination(totalPosts) {
      pagination.innerHTML = '';
      const totalPages = Math.ceil(totalPosts / postsPerPage);
      for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement("button");
        btn.textContent = i;
        btn.onclick = () => {
          currentPage = i;
          renderPosts();
        };
        pagination.appendChild(btn);
      }
    }

    function renderPosts() {
      postsList.innerHTML = "";
      recentPostsList.innerHTML = "";
      const paginated = paginatePosts(allPosts);

      paginated.forEach((post, i) => {
        const index = (currentPage - 1) * postsPerPage + i;
        const div = document.createElement("div");
        div.className = "post-item";
        div.innerHTML = `<span><strong>${post.title}</strong></span>
          <span>
            <button onclick="editPost(${index})">Edit</button>
            <button onclick="deletePost(${index})">Delete</button>
          </span>`;
        postsList.appendChild(div);
      });

      allPosts.slice(0, 10).forEach((post, i) => {
        const li = document.createElement("li");
        li.innerHTML = `<a href="#" onclick="editPost(${i})">${post.title}</a>`;
        recentPostsList.appendChild(li);
      });

      renderPagination(allPosts.length);
    }

    async function loadPostsFromGitHub() {
      try {
        const res = await fetch(API_BASE, {
          headers: {
            Authorization: `token ${GITHUB_TOKEN}`
          }
        });
        if (!res.ok) {
          throw new Error(\`GitHub API error: \${res.status} \${res.statusText}\`);
        }
        const files = await res.json();
        allPosts = [];

        // प्रत्येक फाइल JSON पढेर पोस्टमा बदल्ने
        for (const file of files) {
          const fileRes = await fetch(file.download_url);
          const fileContent = await fileRes.json();
          allPosts.push(fileContent);
          shaCache[file.name] = file.sha;
        }

        renderPosts();
      } catch (err) {
        alert("GitHub बाट पोस्ट लोड गर्न सकिएन: " + err.message);
      }
    }

    // GitHub मा नयाँ पोस्ट थप्ने function
    async function addPostToGitHub(post) {
      try {
        const filename = \`\${post.title.replace(/\s+/g, '_')}_\${Date.now()}.json\`;
        const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(post))));

        const res = await fetch(\`\${API_BASE}/\${filename}\`, {
          method: 'PUT',
          headers: {
            Authorization: \`token \${GITHUB_TOKEN}\`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: \`Add post: \${post.title}\`,
            content: contentEncoded,
            branch: "main"
          })
        });

        if (!res.ok) {
          throw new Error(\`GitHub API error: \${res.status} \${res.statusText}\`);
        }
        const data = await res.json();
        shaCache[filename] = data.content.sha;
        return true;
      } catch (err) {
        alert("पोष्ट GitHub मा थप्न सकिएन: " + err.message);
        return false;
      }
    }

    // GitHub मा पोस्ट मेट्ने function
    async function deletePostFromGitHub(filename) {
      try {
        const sha = shaCache[filename];
        if (!sha) throw new Error("SHA not found for file.");

        const res = await fetch(\`\${API_BASE}/\${filename}\`, {
          method: 'DELETE',
          headers: {
            Authorization: \`token \${GITHUB_TOKEN}\`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: \`Delete post: \${filename}\`,
            sha: sha,
            branch: "main"
          })
        });

        if (!res.ok) {
          throw new Error(\`GitHub API error: \${res.status} \${res.statusText}\`);
        }
        delete shaCache[filename];
        return true;
      } catch (err) {
        alert("पोष्ट मेट्न सकिएन: " + err.message);
        return false;
      }
    }

    document.getElementById("postForm").addEventListener("submit", async e => {
      e.preventDefault();
      const post = {
        title: document.getElementById("postTitle").value.trim(),
        content: tinymce.get("postContent").getContent(),
        section: document.getElementById("postSection").value,
        youtube: document.getElementById("youtubeLink").value.trim(),
        tags: document.getElementById("postTags").value.split(',').map(t => t.trim())
      };
      const success = await addPostToGitHub(post);
      if (success) {
        postForm.reset();
        tinymce.get("postContent").setContent('');
        await loadPostsFromGitHub();
      }
    });

    window.editPost = function(index) {
      const post = allPosts[index];
      if (!post) return alert("पोष्ट भेटिएन");
      document.getElementById("postTitle").value = post.title;
      tinymce.get("postContent").setContent(post.content || '');
      document.getElementById("postSection").value = post.section;
      document.getElementById("youtubeLink").value = post.youtube || '';
      document.getElementById("postTags").value = (post.tags || []).join(', ');

      // Delete original file before editing (to replace on next save)
      const filename = Object.keys(shaCache).find(fn => fn.includes(post.title.replace(/\s+/g, '_')));
      if (filename) {
        deletePostFromGitHub(filename).then(() => loadPostsFromGitHub());
      }
    };

    window.deletePost = async function(index) {
      const post = allPosts[index];
      if (!post) return alert("पोष्ट भेटिएन");
      if (!confirm(\`"\${post.title}" पोष्ट पक्कै हटाउने?\`)) return;

      const filename = Object.keys(shaCache).find(fn => fn.includes(post.title.replace(/\s+/g, '_')));
      if (filename) {
        const success = await deletePostFromGitHub(filename);
        if (success) loadPostsFromGitHub();
      }
    };

    // Check if user already logged in
    if (localStorage.getItem("isLoggedIn") === "true") {
      loginForm.style.display = "none";
      postForm.style.display = "block";
      sidebar.classList.add("show");
      startSessionTimeout();
      loadPostsFromGitHub();
    }
  </script>
</body>
</html>
