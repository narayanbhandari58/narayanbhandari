<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CMS प्यानल - नारायण भण्डारी</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari&family=Poppins&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/tinymce@6.8.3/tinymce.min.js" referrerpolicy="origin"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Noto Sans Devanagari', 'Poppins', sans-serif;
      background: #f8f9fa;
      color: #1a1a1a;
      margin: 0;
      display: flex;
      height: 100vh;
    }
    .sidebar {
      width: 250px;
      background: #8f0e04;
      color: white;
      padding: 20px;
      display: none;
      flex-direction: column;
      position: relative;
    }
    .sidebar.show {
      display: flex !important;
    }
    .sidebar h2 {
      font-size: 1.5rem;
      margin-bottom: 20px;
    }
    .sidebar a {
      color: white;
      text-decoration: none;
      margin: 10px 0;
      display: block;
      padding: 10px;
      border-radius: 4px;
      transition: background 0.3s;
    }
    .sidebar a:hover {
      background: #660c02;
    }
    .recent-posts {
      margin-top: 20px;
    }
    .recent-posts ul {
      list-style: none;
      padding: 0;
    }
    .recent-posts li {
      background: white;
      margin: 5px 0;
      padding: 10px;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .recent-posts li span {
      color: #1a1a1a;
    }
    .recent-posts li button {
      margin-left: 5px;
      background: #8f0e04;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
    }
    .recent-posts li button:hover {
      background: #660c02;
    }
    .toggle-sidebar {
      position: absolute;
      top: 10px;
      right: -35px;
      width: 30px;
      height: 30px;
      border-radius: 4px;
      border: none;
      background: #8f0e04;
      color: white;
      font-size: 22px;
      cursor: pointer;
      z-index: 1000;
    }
    .content {
      flex-grow: 1;
      padding: 20px;
      overflow-y: auto;
    }
    h1, h2 {
      color: #8f0e04;
      text-align: center;
    }
    form {
      background: white;
      padding: 20px;
      margin: 0 auto 20px;
      border-radius: 8px;
      max-width: 600px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      margin-top: 10px;
      width: 100%;
      background: #8f0e04;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="sidebar" id="sidebar">
    <button class="toggle-sidebar" id="toggleSidebar" aria-label="Toggle Sidebar">☰</button>
    <h2>CMS प्यानल</h2>
    <a href="#" id="logoutButton">लगआउट गर्नुहोस्</a>
    <div class="recent-posts">
      <h3>Recent Posts</h3>
      <ul id="recentPostsList" aria-live="polite" aria-atomic="true"></ul>
    </div>
  </div>
  <div class="content">
    <h1>CMS प्यानल</h1>
    <form id="loginForm">
      <input type="email" id="username" placeholder="इमेल" required aria-required="true" />
      <input type="password" id="password" placeholder="पासवर्ड" required aria-required="true" />
      <button type="submit">लगइन गर्नुहोस्</button>
    </form>
    <form id="postForm" style="display:none" novalidate>
      <label for="postSection">सेक्सन छान्नुहोस्</label>
      <select id="postSection" required aria-required="true">
        <option value="" disabled selected>सेक्सन छान्नुहोस्</option>
        <option value="lekha">लेख/रचना</option>
        <option value="sahitya">साहित्य</option>
        <option value="loksewa">लोकसेवा</option>
        <option value="patrapatrika">पत्रपत्रिका</option>
        <option value="mero-barema">मेरो बारेमा</option>
      </select>
      <input type="text" id="postTitle" placeholder="पोष्टको शीर्षक" required aria-required="true" />
      <textarea id="postContent" placeholder="यहाँ सामग्री लेख्नुहोस्..." required aria-required="true"></textarea>
      <input type="url" id="youtubeLink" placeholder="YouTube भिडियो लिंक (यदि छ भने)" />
      <input type="file" id="pdfFile" accept="application/pdf" />
      <input type="text" id="postTags" placeholder="ट्यागहरू (#tag1, #tag2)" />
      <button type="submit" id="submitPostButton">पोष्ट थप्नुहोस्</button>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/tinymce@6.8.3/tinymce.min.js" referrerpolicy="origin"></script>
  <script>
    // Read and write posts to localStorage key
    const STORAGE_KEY = 'nv_posts';

    let posts = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

    // Initialize TinyMCE
    tinymce.init({
      selector: '#postContent',
      plugins: 'lists link image charmap preview anchor',
      toolbar: 'undo redo | styleselect | bold italic underline | alignleft aligncenter alignright alignjustify | outdent indent | link image',
      menubar: false,
      height: 300,
      setup: editor => {
        editor.on('change', () => editor.save());
      }
    });

    // Elements references
    const loginForm = document.getElementById('loginForm');
    const postForm = document.getElementById('postForm');
    const toggleSidebarBtn = document.getElementById('toggleSidebar');
    const sidebar = document.getElementById('sidebar');
    const logoutButton = document.getElementById('logoutButton');
    const recentPostsList = document.getElementById('recentPostsList');

    // Session management (simple, localStorage based)
    function isLoggedIn() {
      return localStorage.getItem('loggedIn') === 'true';
    }
    function setLoggedIn(value) {
      localStorage.setItem('loggedIn', value ? 'true' : 'false');
    }

    function renderRecentPosts() {
      recentPostsList.innerHTML = '';
      if(posts.length === 0) {
        recentPostsList.innerHTML = '<li style="color:#fff;">पछिल्ला पोस्टहरू उपलब्ध छैनन्।</li>';
        return;
      }
      posts.forEach(post => {
        const li = document.createElement('li');
        li.style.backgroundColor = '#fff';
        li.style.color = '#1a1a1a';
        li.style.marginBottom = '8px';
        li.style.padding = '6px 10px';
        li.style.borderRadius = '6px';
        li.style.display = 'flex';
        li.style.justifyContent = 'space-between';
        li.style.alignItems = 'center';

        const titleSpan = document.createElement('span');
        titleSpan.textContent = post.title;
        titleSpan.setAttribute('tabindex', '0');
        titleSpan.style.cursor = 'pointer';
        titleSpan.title = 'यो पोस्ट सम्पादन गर्न क्लिक गर्नुहोस्';

        // On click populate form for editing
        titleSpan.addEventListener('click', () => {
          postForm.style.display = 'block';
          loginForm.style.display = 'none';
          document.getElementById('postSection').value = post.section;
          document.getElementById('postTitle').value = post.title;
          tinymce.get('postContent').setContent(post.content);
          document.getElementById('youtubeLink').value = post.youtubeLink || '';
          document.getElementById('postTags').value = post.tags || '';
          editingPostId = post.id;
        });

        // Buttons container
        const btnDiv = document.createElement('div');

        // Edit button (alternative to title click)
        const editBtn = document.createElement('button');
        editBtn.textContent = 'Edit';
        editBtn.style.marginRight = '5px';
        editBtn.addEventListener('click', () => {
          titleSpan.click();
        });

        // Delete button
        const deleteBtn = document.createElement('button');
        deleteBtn.textContent = 'Delete';
        deleteBtn.addEventListener('click', () => {
          if(confirm('के तपाईं यो पोस्ट मेटाउन निश्चित हुनुहुन्छ?')) {
            posts = posts.filter(p => p.id !== post.id);
            savePosts();
            renderRecentPosts();
            // Clear form if editing same post
            if(editingPostId === post.id) {
              clearPostForm();
            }
          }
        });

        btnDiv.appendChild(editBtn);
        btnDiv.appendChild(deleteBtn);

        li.appendChild(titleSpan);
        li.appendChild(btnDiv);
        recentPostsList.appendChild(li);
      });
    }

    function savePosts() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
    }

    function clearPostForm() {
      document.getElementById('postSection').value = '';
      document.getElementById('postTitle').value = '';
      document.getElementById('youtubeLink').value = '';
      document.getElementById('postTags').value = '';
      tinymce.get('postContent').setContent('');
      editingPostId = null;
    }

    // Variable to hold ID of post being edited; null if creating new
    let editingPostId = null;

    document.addEventListener('DOMContentLoaded', () => {
      if(isLoggedIn()) {
        loginForm.style.display = 'none';
        postForm.style.display = 'block';
        renderRecentPosts();
      }
    });

    loginForm.addEventListener('submit', e => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if(username === 'bhandarinarayan300@gmail.com' && password === '9846874405n@') {
        setLoggedIn(true);
        loginForm.style.display = 'none';
        postForm.style.display = 'block';
        renderRecentPosts();
      } else {
        alert('इमेल वा पासवर्ड गलत छ।');
      }
    });

    logoutButton.addEventListener('click', e => {
      e.preventDefault();
      setLoggedIn(false);
      loginForm.style.display = 'block';
      postForm.style.display = 'none';
      clearPostForm();
    });

    toggleSidebarBtn.addEventListener('click', () => {
      sidebar.classList.toggle('show');
    });

    postForm.addEventListener('submit', e => {
      e.preventDefault();

      const section = document.getElementById('postSection').value;
      const title = document.getElementById('postTitle').value.trim();
      const content = tinymce.get('postContent').getContent().trim();

      if(!section || !title || !content) {
        alert('कृपया सबै आवश्यक क्षेत्रहरू भर्नुहोस्।');
        return;
      }

      const youtubeLink = document.getElementById('youtubeLink').value.trim();
      const tags = document.getElementById('postTags').value.trim();

      if(editingPostId) {
        // Update existing post
        const i = posts.findIndex(p => p.id === editingPostId);
        if(i !== -1) {
          posts[i].section = section;
          posts[i].title = title;
          posts[i].content = content;
          posts[i].youtubeLink = youtubeLink;
          posts[i].tags = tags;
        }
      } else {
        // Add new post
        posts.push({
          id: Date.now(),
          section,
          title,
          content,
          youtubeLink,
          tags
        });
      }

      savePosts();
      renderRecentPosts();
      clearPostForm();
      editingPostId = null;
      alert('पोष्ट सफलतापूर्वक थपियो।');
    });
  </script>
</body>
</html>
