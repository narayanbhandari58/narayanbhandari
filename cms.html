<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CMS प्यानल - नारायण भण्डारी</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari&family=Poppins&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/tinymce@6.8.3/tinymce.min.js" referrerpolicy="origin"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Noto Sans Devanagari', 'Poppins', sans-serif;
      background: #f8f9fa;
      color: #1a1a1a;
      margin: 0;
      display: flex;
      height: 100vh;
    }
    #menuToggle {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 999;
      background: transparent;
      border: none;
      font-size: 26px;
      cursor: pointer;
      color: #8f0e04;
    }
    .sidebar {
      width: 250px;
      background: #8f0e04;
      color: white;
      padding: 20px;
      display: none;
      flex-direction: column;
    }
    .sidebar.show {
      display: flex !important;
    }
    .sidebar h2 {
      font-size: 1.5rem;
      margin-bottom: 20px;
    }
    .sidebar a {
      color: white;
      text-decoration: none;
      margin: 10px 0;
      display: block;
      padding: 10px;
      border-radius: 4px;
      transition: background 0.3s;
    }
    .sidebar a:hover {
      background: #660c02;
    }
    .recent-posts ul {
      list-style: none;
      padding: 0;
    }
    .recent-posts li a {
      color: white;
      text-decoration: underline;
    }
    .content {
      flex-grow: 1;
      padding: 20px;
      overflow-y: auto;
    }
    h1, h2 {
      color: #8f0e04;
      text-align: center;
    }
    form {
      background: white;
      padding: 20px;
      margin: 0 auto 20px;
      border-radius: 8px;
      max-width: 600px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    textarea {
      display: none;
    }
    button {
      margin-top: 10px;
      width: 100%;
      background: #8f0e04;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
    }
    .post-item {
      background: white;
      margin: 10px auto;
      max-width: 600px;
      padding: 10px;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .post-item button {
      margin-left: 5px;
    }
    .pagination {
      text-align: center;
      margin-top: 20px;
    }
    .pagination button {
      margin: 0 5px;
      padding: 5px 10px;
      background: #8f0e04;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    @media (max-width: 768px) {
      .sidebar {
        position: absolute;
        z-index: 100;
        height: 100vh;
      }
    }
  </style>
</head>
<body>
  <button id="menuToggle">&#9776;</button>
  <div class="sidebar" id="sidebar">
    <h2>CMS प्यानल</h2>
    <a href="#" id="logoutButton">लगआउट गर्नुहोस्</a>
    <div class="recent-posts">
      <h3>Recent Posts</h3>
      <ul id="recentPostsList"></ul>
    </div>
  </div>
  <div class="content">
    <h1>CMS प्यानल</h1>
    <form id="loginForm">
      <input type="email" id="username" placeholder="इमेल" required />
      <input type="password" id="password" placeholder="पासवर्ड" required />
      <button type="submit">लगइन गर्नुहोस्</button>
    </form>
    <form id="postForm" style="display:none">
      <select id="postSection" required>
        <option value="" disabled selected>सेक्सन छान्नुहोस्</option>
        <option value="lekha">लेख/रचना</option>
        <option value="sahitya">साहित्य</option>
        <option value="loksewa">लोकसेवा</option>
        <option value="patrapatrika">पत्रपत्रिका</option>
        <option value="mero-barema">मेरो बारेमा</option>
      </select>
      <input type="text" id="postTitle" placeholder="पोष्टको शीर्षक" required />
      <textarea id="postContent"></textarea>
      <input type="url" id="youtubeLink" placeholder="YouTube भिडियो लिंक (यदि छ भने)" />
      <input type="file" id="pdfFile" accept="application/pdf" />
      <input type="text" id="postTags" placeholder="ट्यागहरू (#tag1, #tag2)" />
      <button type="submit">पोष्ट थप्नुहोस्</button>
    </form>
    <div id="postsList"></div>
    <div class="pagination" id="pagination"></div>
  </div>

  <script>
    tinymce.init({
      selector: '#postContent',
      height: 300,
      menubar: false,
      plugins: 'link image code lists',
      toolbar: 'undo redo | formatselect | bold italic | alignleft aligncenter alignright | bullist numlist | link image | code'
    });

    const ADMIN_EMAIL = "bhandarinarayan300@gmail.com";
    const ADMIN_PASSWORD = "9846874405n@";
    const SESSION_TIMEOUT = 10 * 60 * 1000;
    let sessionTimeout;
    const loginForm = document.getElementById("loginForm");
    const postForm = document.getElementById("postForm");
    const sidebar = document.getElementById("sidebar");
    const postsList = document.getElementById("postsList");
    const recentPostsList = document.getElementById("recentPostsList");
    const pagination = document.getElementById("pagination");

    document.getElementById("menuToggle").addEventListener("click", () => {
      sidebar.classList.toggle("show");
    });

    let currentPage = 1;
    const postsPerPage = 10;

    function paginatePosts(posts) {
      const start = (currentPage - 1) * postsPerPage;
      const end = start + postsPerPage;
      return posts.slice(start, end);
    }

    function renderPagination(totalPosts) {
      pagination.innerHTML = '';
      const totalPages = Math.ceil(totalPosts / postsPerPage);
      for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement("button");
        btn.textContent = i;
        btn.onclick = () => {
          currentPage = i;
          loadPosts();
        };
        pagination.appendChild(btn);
      }
    }

    function loadPosts() {
      const posts = JSON.parse(localStorage.getItem("posts")) || [];
      postsList.innerHTML = "";
      recentPostsList.innerHTML = "";
      const paginated = paginatePosts(posts);

      paginated.forEach((post, i) => {
        const div = document.createElement("div");
        div.className = "post-item";
        div.innerHTML = `<span><strong>${post.title}</strong></span>
        <span>
          <button onclick="editPost(${(currentPage - 1) * postsPerPage + i})">Edit</button>
          <button onclick="deletePost(${(currentPage - 1) * postsPerPage + i})">Delete</button>
        </span>`;
        postsList.appendChild(div);
      });

      posts.slice(0, 10).forEach((post, i) => {
        const li = document.createElement("li");
        li.innerHTML = `<a href="#" onclick="editPost(${i})">${post.title}</a>`;
        recentPostsList.appendChild(li);
      });

      renderPagination(posts.length);
    }

    loginForm.addEventListener("submit", e => {
      e.preventDefault();
      const email = document.getElementById("username").value;
      const pass = document.getElementById("password").value;
      if (email === ADMIN_EMAIL && pass === ADMIN_PASSWORD) {
        loginForm.style.display = "none";
        postForm.style.display = "block";
        sidebar.classList.add("show");
        loadPosts();
        startSessionTimeout();
        localStorage.setItem("isLoggedIn", "true");
      } else {
        alert("गलत लगइन विवरण");
      }
    });

    document.getElementById("logoutButton").addEventListener("click", e => {
      e.preventDefault();
      logout();
    });

    function logout() {
      loginForm.style.display = "block";
      postForm.style.display = "none";
      sidebar.classList.remove("show");
      postsList.innerHTML = "";
      clearTimeout(sessionTimeout);
      localStorage.removeItem("isLoggedIn");
    }

    function startSessionTimeout() {
      clearTimeout(sessionTimeout);
      sessionTimeout = setTimeout(() => {
        alert("सेसन समाप्त भयो");
        logout();
      }, SESSION_TIMEOUT);
    }

    document.getElementById("postForm").addEventListener("submit", e => {
      e.preventDefault();
      const posts = JSON.parse(localStorage.getItem("posts")) || [];
      const newPost = {
        title: document.getElementById("postTitle").value,
        content: tinymce.get("postContent").getContent(),
        section: document.getElementById("postSection").value,
        youtube: document.getElementById("youtubeLink").value,
        tags: document.getElementById("postTags").value.split(',').map(t => t.trim())
      };
      posts.push(newPost);
      localStorage.setItem("posts", JSON.stringify(posts));
      document.getElementById("postForm").reset();
      tinymce.get("postContent").setContent('');
      loadPosts();
    });

    function editPost(index) {
      const posts = JSON.parse(localStorage.getItem("posts")) || [];
      const post = posts[index];
      document.getElementById("postTitle").value = post.title;
      tinymce.get("postContent").setContent(post.content || '');
      document.getElementById("postSection").value = post.section;
      document.getElementById("youtubeLink").value = post.youtube || '';
      document.getElementById("postTags").value = (post.tags || []).join(', ');
      posts.splice(index, 1);
      localStorage.setItem("posts", JSON.stringify(posts));
      loadPosts();
    }

    function deletePost(index) {
      const posts = JSON.parse(localStorage.getItem("posts")) || [];
      if (confirm("पक्का हटाउने?")) {
        posts.splice(index, 1);
        localStorage.setItem("posts", JSON.stringify(posts));
        loadPosts();
      }
    }

    if (localStorage.getItem("isLoggedIn") === "true") {
      loginForm.style.display = "none";
      postForm.style.display = "block";
      sidebar.classList.add("show");
      loadPosts();
      startSessionTimeout();
    }
  </script>
</body>
</html>
