<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CMS - नारायण भण्डारी</title>
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet" />
  <style>
    /* Basic styling */
    body { font-family: "Noto Sans Devanagari", sans-serif; background: #f9f9f9; color: #222; padding: 1rem; max-width: 700px; margin: auto; }
    header { background: #8f0e04; color: white; padding: 1rem; text-align: center; font-weight: bold; margin-bottom: 1rem; }
    label { display: block; margin: 0.5rem 0 0.2rem; font-weight: 600; }
    input, select { width: 100%; padding: 0.5rem; margin-bottom: 1rem; border-radius: 5px; border: 1px solid #ccc; font-size: 1rem; }
    #editor { height: 250px; background: white; margin-bottom: 1rem; }
    button { background: #bb1919; color: white; padding: 0.7rem 1.2rem; border: none; border-radius: 5px; font-size: 1rem; cursor: pointer; }
    button:hover { background: #8f0e04; }
    #loginSection, #cmsSection { max-width: 700px; margin: auto; }
    #loginSection { margin-top: 4rem; }
    #loginError { color: red; margin-bottom: 1rem; }
  </style>
</head>
<body>

<header>CMS - नारायण भण्डारी</header>

<div id="loginSection">
  <h2>लगिन गर्नुहोस्</h2>
  <label for="username">प्रयोगकर्ता नाम</label>
  <input type="text" id="username" placeholder="Narayan" />
  <label for="password">पासवर्ड</label>
  <input type="password" id="password" placeholder="9846" />
  <div id="loginError"></div>
  <button onclick="login()">लगिन</button>
</div>

<div id="cmsSection" style="display:none;">
  <h2>पोस्ट थप्नुहोस्</h2>
  <label for="title">शीर्षक</label>
  <input type="text" id="title" placeholder="शीर्षक लेख्नुहोस्" />
  <label for="section">श्रेणी</label>
  <select id="section">
    <option value="lekha">लेख/रचना</option>
    <option value="sahitya">साहित्य</option>
    <option value="loksewa">लोकसेवा</option>
    <option value="patrapatrika">पत्रपत्रिका</option>
    <option value="mero-barema">मेरो बारेमा</option>
  </select>
  <label>सामग्री</label>
  <div id="editor"></div>
  <label for="youtube">YouTube Embed Link (optional)</label>
  <input type="url" id="youtube" placeholder="https://www.youtube.com/embed/..." />
  <button onclick="submitPost()">पोस्ट सेभ गर्नुहोस्</button>
  <button onclick="logout()" style="margin-top:1rem; background:#444;">लगआउट</button>
  <div id="statusMessage" style="margin-top:1rem; color: green;"></div>
</div>

<script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

  // Firebase Config (तिम्रो Firebase Project को config राख्नु)
  const firebaseConfig = {
    apiKey: "AIzaSyAeMBVRnouOkMIInTYUjysb1f3lflhxxYM",
    authDomain: "narayan-cms.firebaseapp.com",
    projectId: "narayan-cms",
    storageBucket: "narayan-cms.firebasestorage.app",
    messagingSenderId: "877625098183",
    appId: "1:877625098183:web:c13d46fbb662de2aa0e3e2",
    measurementId: "G-TDQ2PKZXWT"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const quill = new Quill('#editor', {
    theme: 'snow',
    placeholder: 'सामग्री यहाँ लेख्नुहोस्...'
  });

  const loginData = { username: "Narayan", password: "9846" };

  function login() {
    const u = document.getElementById("username").value.trim();
    const p = document.getElementById("password").value.trim();
    if (u === loginData.username && p === loginData.password) {
      localStorage.setItem("cms_logged_in", "yes");
      showCMS();
    } else {
      document.getElementById("loginError").innerText = "गलत प्रयोगकर्ता नाम वा पासवर्ड";
    }
  }

  function logout() {
    localStorage.removeItem("cms_logged_in");
    location.reload();
  }

  function showCMS() {
    document.getElementById("loginSection").style.display = "none";
    document.getElementById("cmsSection").style.display = "block";
    document.getElementById("loginError").innerText = "";
    document.getElementById("statusMessage").innerText = "";
    clearForm();
  }

  async function submitPost() {
    const title = document.getElementById("title").value.trim();
    const section = document.getElementById("section").value;
    const content = quill.root.innerHTML.trim();
    const youtube = document.getElementById("youtube").value.trim();

    if (!title || !content) {
      alert("शीर्षक र सामग्री अनिवार्य छन्।");
      return;
    }

    try {
      await addDoc(collection(db, "posts"), {
        title,
        section,
        content,
        youtube,
        createdAt: new Date()
      });
      document.getElementById("statusMessage").innerText = "पोस्ट सफलतापूर्वक सुरक्षित भयो।";
      clearForm();
    } catch (e) {
      alert("पोस्ट सेभ गर्न समस्या भयो: " + e.message);
    }
  }

  function clearForm() {
    document.getElementById("title").value = "";
    document.getElementById("youtube").value = "";
    quill.setContents([]);
  }

  // Load CMS if already logged in
  if (localStorage.getItem("cms_logged_in") === "yes") {
    showCMS();
  }
</script>

</body>
</html>
