<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CMS प्यानल - नारायण भण्डारी</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari&family=Poppins&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/tinymce@6.8.3/tinymce.min.js" referrerpolicy="origin"></script>
  <style>
    /* Existing CSS remains unchanged */
    /* ... [omitted here for brevity] ... */
  </style>
</head>
<body>
  <div class="sidebar" id="sidebar">
    <button class="toggle-sidebar" id="toggleSidebar">☰</button>
    <h2>CMS प्यानल</h2>
    <a href="#" id="logoutButton">लगआउट गर्नुहोस्</a>
    <div class="recent-posts">
      <h3>Recent Posts</h3>
      <ul id="recentPostsList"></ul>
    </div>
  </div>
  <div class="content">
    <h1>CMS प्यानल</h1>
    <form id="loginForm">
      <input type="email" id="username" placeholder="इमेल" required />
      <input type="password" id="password" placeholder="पासवर्ड" required />
      <button type="submit">लगइन गर्नुहोस्</button>
    </form>
    <form id="postForm" style="display:none">
      <select id="postSection" required>
        <option value="" disabled selected>सेक्सन छान्नुहोस्</option>
        <option value="lekha">लेख/रचना</option>
        <option value="sahitya">साहित्य</option>
        <option value="loksewa">लोकसेवा</option>
        <option value="patrapatrika">पत्रपत्रिका</option>
        <option value="mero-barema">मेरो बारेमा</option>
      </select>
      <input type="text" id="postTitle" placeholder="पोष्टको शीर्षक" required />
      <textarea id="postContent" placeholder="यहाँ सामग्री लेख्नुहोस्..." required></textarea>
      <input type="url" id="youtubeLink" placeholder="YouTube भिडियो लिंक (यदि छ भने)" />
      <input type="text" id="postTags" placeholder="ट्यागहरू (#tag1, #tag2)" />
      <button type="submit" id="submitPostButton">पोष्ट थप्नुहोस्</button>
    </form>
  </div>
  <script>
    const ADMIN_EMAIL = "bhandarinarayan300@gmail.com";
    const ADMIN_PASSWORD = "9846874405n@";

    const GITHUB_TOKEN = "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";
    const GITHUB_USERNAME = "narayanbhandari58";
    const GITHUB_REPO = "narayanbhandari";

    const toggleBtn = document.getElementById("toggleSidebar");
    const sidebar = document.getElementById("sidebar");
    toggleBtn.addEventListener("click", () => {
      sidebar.classList.toggle("show");
    });

    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;
      if (user === ADMIN_EMAIL && pass === ADMIN_PASSWORD) {
        this.style.display = "none";
        document.getElementById("postForm").style.display = "block";
        sidebar.classList.add("show");
      } else {
        alert("गलत इमेल वा पासवर्ड।");
      }
    });

    document.getElementById("logoutButton").addEventListener("click", () => {
      document.getElementById("loginForm").style.display = "block";
      document.getElementById("postForm").style.display = "none";
      sidebar.classList.remove("show");
    });

    // Save post to GitHub
    document.getElementById("postForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const title = document.getElementById("postTitle").value.trim();
      const section = document.getElementById("postSection").value;
      const content = tinymce.get("postContent").getContent();
      const youtube = document.getElementById("youtubeLink").value.trim();
      const tags = document.getElementById("postTags").value.trim().split(",").map(t => t.trim());
      if (!title || !section || !content) return alert("सबै आवश्यक क्षेत्रहरू भर्नुहोस्");

      const filename = `posts/${Date.now()}-${encodeURIComponent(title)}.json`;
      const payload = {
        title,
        section,
        content,
        youtube,
        tags
      };
      const commitMsg = `पोस्ट थपियो: ${title}`;
      try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${filename}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${GITHUB_TOKEN}`
          },
          body: JSON.stringify({
            message: commitMsg,
            content: btoa(unescape(encodeURIComponent(JSON.stringify(payload))))
          })
        });
        if (res.ok) {
          alert("पोष्ट GitHub मा सफलतापूर्वक सेभ गरियो");
          this.reset();
          tinymce.get("postContent").setContent("");
        } else {
          alert("GitHub मा पोस्ट सेभ गर्न सकेन");
        }
      } catch (err) {
        console.error("Error:", err);
        alert("GitHub अपडेटमा त्रुटि");
      }
    });

    tinymce.init({
      selector: '#postContent',
      height: 300,
      menubar: false,
      plugins: 'link image code lists',
      toolbar: 'undo redo | formatselect | bold italic | alignleft aligncenter alignright | bullist numlist | link image | code'
    });
  </script>
</body>
</html>
