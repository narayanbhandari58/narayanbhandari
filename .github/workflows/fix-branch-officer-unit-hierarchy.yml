name: Fix Branch Officer unit hierarchy

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch runtime and validation for nested units
        shell: python
        run: |
          from pathlib import Path
          import sys

          api=Path('netlify/functions/exam-api.js')
          s=api.read_text(encoding='utf-8')
          old="function levelOf(q){const v=String(q.level??'').toLowerCase();if(v==='level1'||v==='l1'||v==='i'||v==='1')return 'level1';if(v==='level2'||v==='l2'||v==='ii'||v==='2')return 'level2';return v}\nfunction unitPlan(exam){"
          new="function levelOf(q){const v=String(q.level??'').toLowerCase();if(v==='level1'||v==='l1'||v==='i'||v==='1')return 'level1';if(v==='level2'||v==='l2'||v==='ii'||v==='2')return 'level2';return v}\nfunction unitMatches(q,u){const a=String(q.unit??'');const b=String(u??'');return a===b||a.startsWith(b+'.')}\nfunction unitPlan(exam){"
          if old in s:
              s=s.replace(old,new,1)
          old2="q.section===u.sectionId&&q.unit===u.id"
          new2="q.section===u.sectionId&&unitMatches(q,u.id)"
          if old2 not in s: raise SystemExit('API blueprintReady pattern not found')
          s=s.replace(old2,new2,1)
          old3="sectionBank.filter(q=>q.unit===u.id)"
          new3="sectionBank.filter(q=>unitMatches(q,u.id))"
          if old3 not in s: raise SystemExit('API selectPaper pattern not found')
          s=s.replace(old3,new3,1)
          api.write_text(s,encoding='utf-8')

          wf=Path('.github/workflows/test-branch-officer-blueprint.yml')
          t=wf.read_text(encoding='utf-8')
          marker="          def pick(pool, n):\n"
          helper="          def unit_matches(q, unit):\n              a=str(q.get('unit',''))\n              b=str(unit)\n              return a==b or a.startswith(b+'.')\n\n"
          if helper not in t:
              if marker not in t: raise SystemExit('test helper insertion point not found')
              t=t.replace(marker,helper+marker,1)
          t=t.replace("q.get('section') == s['id'] and q.get('unit') == u['id']","q.get('section') == s['id'] and unit_matches(q,u['id'])")
          t=t.replace("q.get('section') == s['id'] and q.get('unit') == u['id']","q.get('section') == s['id'] and unit_matches(q,u['id'])")
          t=t.replace("q.get('section') == s['id'] and q.get('unit') == u['id']","q.get('section') == s['id'] and unit_matches(q,u['id'])")
          wf.write_text(t,encoding='utf-8')
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add netlify/functions/exam-api.js .github/workflows/test-branch-officer-blueprint.yml
          if git diff --cached --quiet; then echo "No changes needed"; exit 0; fi
          git commit -m "Fix Branch Officer nested unit selection"
          git push
