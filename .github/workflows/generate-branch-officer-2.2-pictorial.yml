name: Generate Branch Officer 2.2 pictorial bank
on:
  push:
    paths: ['.github/workflows/generate-branch-officer-2.2-pictorial.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PNG converter
        run: python -m pip install --quiet cairosvg
      - name: Generate 30 diagram-based PNG questions
        shell: python
        run: |
          import json,math
          from pathlib import Path
          import cairosvg
          def svg(kind,n):
            s='<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420"><rect width="900" height="420" rx="24" fill="#ffffff"/><rect x="20" y="20" width="860" height="300" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3"/><g stroke="#172033" stroke-width="6" fill="none">'
            if kind==0:
              for j,x in enumerate((140,300,460,620,780)): s+=f'<circle cx="{x}" cy="170" r="48" fill="'+('#8f0e04' if (j+n)%2 else '#ffffff')+'"/>'
            elif kind==1:
              for j,x in enumerate((140,300,460,620,780)): s+=f'<rect x="{x-48}" y="122" width="96" height="96" rx="12" fill="'+('#f4c400' if (j+n)%2 else '#ffffff')+'"/>'
            elif kind==2:
              a=(n%4)*90
              for j,x in enumerate((150,350,550,750)): s+=f'<g transform="translate({x} 170) rotate({a+j*90})"><path d="M0 -58 L58 0 L0 58" fill="#3b82f6"/><circle cx="0" cy="0" r="9" fill="#8f0e04"/></g>'
            elif kind==3:
              for j,x in enumerate((140,300,460,620,780)):
                pts=[]; sides=3+((j+n)%4)
                for k in range(sides):
                  ang=2*math.pi*k/sides-math.pi/2; pts.append(f'{x+50*math.cos(ang):.1f},{170+50*math.sin(ang):.1f}')
                s+=f'<polygon points="{" ".join(pts)}" fill="'+(['#10b981','#3b82f6','#f59e0b','#8b5cf6','#ef4444'][(j+n)%5])+'"/>'
            elif kind==4:
              s+='<line x1="450" y1="55" x2="450" y2="285" stroke="#94a3b8" stroke-dasharray="12 10"/><path d="M150 220 L230 100 L310 220 Z" fill="#ef4444"/><circle cx="230" cy="175" r="12" fill="#f4c400"/><path d="M750 220 L670 100 L590 220 Z" fill="#3b82f6"/>'
            else:
              for j,x in enumerate((150,350,550,750)):
                y=170+(-55 if (j+n)%2==0 else 55); s+=f'<line x1="{x-55}" y1="170" x2="{x+55}" y2="{y}" stroke="'+(['#8f0e04','#3b82f6','#10b981','#f59e0b'][j%4])+'"/>'
            return s+'</g><text x="450" y="365" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#334155">Pictorial Reasoning</text></svg>'
          banks=[
            ('आकृति क्रम','चित्रको भरिएको/खाली क्रम हेरेर अर्को आकृति छान्नुहोस्',['भरिएको वृत्त','खाली वृत्त','वर्ग','त्रिभुज'],[0,1,0,1,0]),
            ('भराइ क्रम','चित्रको भराइको ढाँचा हेरेर अर्को आकृति छान्नुहोस्',['खाली वर्ग','भरिएको वर्ग','वृत्त','त्रिभुज'],[1,0,1,0,1]),
            ('घुमाइ','चित्रमा तीर प्रत्येक चरणमा घुमेको छ। अर्को दिशा छान्नुहोस्',['माथि','दायाँ','तल','बायाँ'],[3,0,1,2,3]),
            ('भुजा क्रम','चित्रमा भुजाको संख्या बदलिएको छ। अर्को आकृति छान्नुहोस्',['त्रिभुज','वर्ग','पञ्चभुज','षट्भुज'],[1,2,3,0,1]),
            ('दर्पण प्रतिबिम्ब','ठाडो दर्पणको प्रतिबिम्बमा बिन्दुको स्थान छान्नुहोस्',['माथिल्लो बायाँ','माथिल्लो दायाँ','तल्लो बायाँ','तल्लो दायाँ'],[1,1,3,3,1]),
            ('रेखा क्रम','चित्रको रेखा दिशा क्रम हेरेर अर्को दिशा छान्नुहोस्',['माथि','तल','दायाँ','बायाँ'],[2,3,2,3,2])]
          out=Path('image/exam/branch-officer-2.2'); out.mkdir(parents=True,exist_ok=True)
          qs=[]
          for i in range(30):
            kind=i%6; name,q,opts,ans=banks[kind]; correct=ans[(i//6)%5]; ident=f'bo-2.2-{i+1:03d}'
            svg_text=svg(kind,i); png=out/f'{ident}.png'; cairosvg.svg2png(bytestring=svg_text.encode('utf-8'),write_to=str(png),output_width=900,output_height=420)
            qs.append({'id':ident,'examIds':['sakha-adhikrit'],'section':'B','unit':'2.2','subject':'Non-verbal Reasoning','topic':name,'level':'L1' if i<15 else 'L2','type':'pictorial','q':q,'question':q,'options':opts,'correct':correct,'solution':f'चित्रको ढाँचा {name} अनुसार पढ्दा सही विकल्प {"ABCD"[correct]} हुन्छ।','image':f'/image/exam/branch-officer-2.2/{ident}.png','imageAlt':name})
          assert len(qs)==30
          seed=Path('exam-question-seed/branch-officer-2.2-nonverbal-pictorial.json'); seed.write_text(json.dumps(qs,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          p=Path('exam-data.json'); d=json.loads(p.read_text(encoding='utf-8')); bank=d.setdefault('questions',[]); by={q.get('id'):i for i,q in enumerate(bank)}
          for q in qs:
            if q['id'] in by: bank[by[q['id']]]=q
            else: by[q['id']]=len(bank); bank.append(q)
          d['questionBankUpdatedAt']=__import__('datetime').datetime.utcnow().isoformat()+'Z'; p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
      - name: Commit PNG assets, seed and exam data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add image/exam/branch-officer-2.2 exam-question-seed/branch-officer-2.2-nonverbal-pictorial.json exam-data.json
          git diff --cached --quiet || git commit -m 'Convert Branch Officer pictorial questions to responsive PNG assets'
          git push
