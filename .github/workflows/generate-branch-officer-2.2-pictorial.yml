name: Generate Branch Officer 2.2 pictorial bank
on:
  push:
    paths: ['.github/workflows/generate-branch-officer-2.2-pictorial.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet cairosvg
      - name: Generate 30 audited PNG questions
        shell: python
        run: |
          import json,math,hashlib
          from pathlib import Path
          import cairosvg
          OUT=Path('image/exam/branch-officer-2.2'); OUT.mkdir(parents=True,exist_ok=True)
          A='ABCD'; SH={'circle':'वृत्त','square':'वर्ग','triangle':'त्रिभुज','diamond':'हीरा'}
          DIR=['माथि','दायाँ','तल','बायाँ']; LINE=['बायाँ-माथि ↘ दायाँ-तल','बायाँ-तल ↗ दायाँ-माथि','तेर्सो','ठाडो']
          Q=[]
          def add(k,t,seq,opts,c,q,s):
            assert len(opts)==4 and opts[c] is not None
            Q.append((k,t,seq,opts,c,q,s))
          shapes=[
            (['circle','square','circle','square'],['circle','square','triangle','diamond'],0,'A-B-A-B क्रम; अर्को वृत्त हो।'),
            (['triangle','triangle','circle','circle'],['circle','triangle','square','diamond'],1,'दुई-दुईको समूहमा क्रम दोहोरिन्छ; अर्को त्रिभुज हो।'),
            (['square','diamond','square','diamond'],['diamond','triangle','square','circle'],2,'वर्ग र हीरा पालैपालो आउँछन्; अर्को वर्ग हो।'),
            (['circle','triangle','triangle','circle'],['square','circle','diamond','triangle'],1,'A-B-B-A क्रम दोहोरिन्छ; अर्को वृत्त हो।'),
            (['diamond','circle','square','triangle'],['diamond','circle','square','triangle'],0,'चार आकृतिको चक्र पूरा भएपछि पहिलो अर्थात् हीरा दोहोरिन्छ।'),
            (['triangle','square','diamond','circle'],['square','triangle','diamond','circle'],1,'चार आकृतिको चक्रपछि फेरि त्रिभुज आउँछ।'),
            (['circle','diamond','diamond','circle'],['circle','triangle','diamond','square'],0,'A-B-B-A क्रम; अर्को वृत्त हो।'),
            (['square','triangle','square','triangle'],['square','triangle','diamond','circle'],0,'वर्ग र त्रिभुज पालैपालो छन्; अर्को वर्ग हो।'),
            (['diamond','diamond','square','square'],['diamond','square','circle','triangle'],0,'दुई हीरा र दुई वर्गको समूह; अर्को हीरा हो।'),
            (['circle','square','triangle','diamond'],['triangle','circle','square','diamond'],1,'चार आकृतिको चक्रपछि फेरि वृत्त आउँछ।')]
          for seq,o,c,s in shapes:add('shape','आकृति क्रम',seq,o,c,'आकृतिहरूको क्रम हेरी प्रश्नचिह्न (?) को स्थानमा आउने सही आकृति छान्नुहोस्।',s)
          rotations=[([0,1,2,3],0,'हरेक चरणमा ९०° दायाँ घुमेको छ; अर्को माथि हुन्छ।'),([1,2,3,0],1,'हरेक चरणमा ९०° दायाँ घुमेको छ; अर्को दायाँ हुन्छ।'),([2,0,2,0],2,'तल र माथि पालैपालो छन्; अर्को तल हुन्छ।'),([3,2,1,0],3,'हरेक चरणमा ९०° बायाँ घुमेको छ; अर्को बायाँ हुन्छ।'),([0,2,0,2],0,'माथि र तल पालैपालो छन्; अर्को माथि हुन्छ।')]
          for seq,c,s in rotations:add('rotation','घुमाइ',seq,[0,1,2,3],c,'तीरको घुमाइको नियम पहिचान गरी प्रश्नचिह्न (?) को स्थानमा आउने दिशा छान्नुहोस्।',s)
          sides=[([3,4,5,6],[7,5,6,8],0,'हरेक चरणमा १ थपिन्छ; ६ पछि ७।'),([4,5,6,7],[6,8,5,9],1,'हरेक चरणमा १ थपिन्छ; ७ पछि ८।'),([5,6,7,8],[9,6,7,10],0,'हरेक चरणमा १ थपिन्छ; ८ पछि ९।'),([6,8,10,12],[10,12,13,14],3,'हरेक चरणमा २ थपिन्छ; १२ पछि १४।'),([3,5,7,9],[11,9,10,13],0,'हरेक चरणमा २ थपिन्छ; ९ पछि ११।')]
          for seq,o,c,s in sides:add('sides','भुजा क्रम',seq,o,c,'आकृतिको भुजाको संख्या हेरी प्रश्नचिह्न (?) को स्थानमा आउने सही विकल्प छान्नुहोस्।',s)
          mm={0:1,1:0,2:3,3:2}
          for i,p in enumerate([0,1,2,3,0],21):add('mirror','दर्पण प्रतिबिम्ब'+(' २' if i==25 else ''),p,[0,1,2,3],mm[p],'ठाडो दर्पण रेखापछाडिको सही प्रतिबिम्ब छान्नुहोस्।',f'ठाडो दर्पणमा बायाँ-दायाँ स्थान उल्टिन्छ; सही प्रतिबिम्ब {A[mm[p]]} विकल्प हो।')
          lines=[([0,1,0,1],0,'दुई रेखा पालैपालो दोहोरिन्छन्; अर्को पहिलो विकर्ण हो।'),([1,2,3,0],1,'दिशा क्रम ९०° घुम्छ; अर्को दोस्रो विकर्ण हो।'),([2,3,0,1],2,'दिशाको चार-चरणीय चक्र दोहोरिन्छ; अर्को तेर्सो हो।'),([3,0,1,2],3,'दिशाको चार-चरणीय चक्र दोहोरिन्छ; अर्को ठाडो हो।'),([0,2,0,2],0,'० र २ पालैपालो छन्; अर्को पहिलो विकर्ण हो।')]
          for seq,c,s in lines:add('line','रेखा क्रम',seq,[0,1,2,3],c,'रेखाको दिशा क्रम पहिचान गरी प्रश्नचिह्न (?) को स्थानमा आउने सही रेखा छान्नुहोस्।',s)
          assert len(Q)==30
          assert [x[3][x[4]] for x in Q[15:20]]==[7,8,9,14,11]

          def shape(x,y,k,r=68):
            f={'circle':'#8f0e04','square':'#2563eb','triangle':'#059669','diamond':'#d97706'}[k]; st='#172033'
            if k=='circle':return f'<circle cx="{x}" cy="{y}" r="{r}" fill="{f}" stroke="{st}" stroke-width="6"/>'
            if k=='square':return f'<rect x="{x-r}" y="{y-r}" width="{2*r}" height="{2*r}" rx="12" fill="{f}" stroke="{st}" stroke-width="6"/>'
            if k=='triangle':return f'<polygon points="{x},{y-r-10} {x-r-12},{y+r+10} {x+r+12},{y+r+10}" fill="{f}" stroke="{st}" stroke-width="6"/>'
            return f'<polygon points="{x},{y-r-10} {x+r+10},{y} {x},{y+r+10} {x-r-10},{y}" fill="{f}" stroke="{st}" stroke-width="6"/>'
          def arrow(x,y,d,sc=1):return f'<g transform="translate({x} {y}) rotate({d*90}) scale({sc})"><path d="M-65 22H28V55L92 0 28-55V-22H-65Z" fill="#2563eb" stroke="#172033" stroke-width="6"/></g>'
          def poly(x,y,n,r=68):
            p=[]
            for i in range(n):
              a=-math.pi/2+2*math.pi*i/n;p.append(f'{x+r*math.cos(a):.1f},{y+r*math.sin(a):.1f}')
            return f'<polygon points="{" ".join(p)}" fill="#059669" stroke="#172033" stroke-width="6"/>'
          def line(x,y,d,a=78):
            p=[(x-a,y-a,x+a,y+a),(x-a,y+a,x+a,y-a),(x-a,y,x+a,y),(x,y-a,x,y+a)][d]
            return f'<line x1="{p[0]}" y1="{p[1]}" x2="{p[2]}" y2="{p[3]}" stroke="#8f0e04" stroke-width="13" stroke-linecap="round"/>'
          def card(x,label,body):return f'<rect x="{x}" y="500" width="300" height="300" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="4"/><text x="{x+150}" y="545" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="800" fill="#334155">{label}</text>{body}'
          def render(item):
            k,t,seq,opts,c,q,s=item
            z='<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#fff"/><rect x="24" y="24" width="1552" height="852" rx="28" fill="#f8fafc" stroke="#dbe3ec" stroke-width="4"/><text x="800" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="800" fill="#172033">प्रश्नचिह्न (?) को स्थानमा आउने सही विकल्प छान्नुहोस्</text>'
            xs=[150,430,710,990]
            for j,v in enumerate(seq):
              z+=f'<rect x="{xs[j]-105}" y="120" width="210" height="260" rx="22" fill="#fff" stroke="#94a3b8" stroke-width="4"/>'
              if k=='shape':z+=shape(xs[j],250,v,76)
              elif k=='rotation':z+=arrow(xs[j],250,v,1.08)
              elif k=='sides':z+=poly(xs[j],250,v,76)
              elif k=='line':z+=line(xs[j],250,v,82)
              else:
                z+=f'<polygon points="{xs[j]-58},325 {xs[j]},160 {xs[j]+58},325" fill="#8f0e04" stroke="#172033" stroke-width="6"/><circle cx="{xs[j]+(-40 if v%2==0 else 40)}" cy="{250+(-48 if v//2==0 else 48)}" r="15" fill="#f4c400" stroke="#172033" stroke-width="4"/>'
            z+='<rect x="1260" y="120" width="210" height="260" rx="22" fill="#fff" stroke="#8f0e04" stroke-width="6" stroke-dasharray="14 10"/><text x="1365" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="86" font-weight="900" fill="#8f0e04">?</text>'
            for j,v in enumerate(opts):
              x=40+j*390
              if k=='shape':body=shape(x+150,665,v,72)
              elif k=='rotation':body=arrow(x+150,665,v,.98)
              elif k=='sides':body=poly(x+150,665,v,70)
              elif k=='line':body=line(x+150,665,v,76)
              else:body=f'<polygon points="{x+100},735 {x+150},590 {x+200},735" fill="#8f0e04" stroke="#172033" stroke-width="5"/><circle cx="{x+150+(-38 if v%2==0 else 38)}" cy="{665+(-46 if v//2==0 else 46)}" r="13" fill="#f4c400" stroke="#172033" stroke-width="3"/>'
              z+=card(x,A[j],body)
            return z+'</svg>'
          def texts(item):
            k,t,seq,opts,c,q,s=item
            if k=='shape':return [SH[x] for x in opts]
            if k=='rotation':return [DIR[x] for x in opts]
            if k=='sides':return [f'{x} भुजा' for x in opts]
            if k=='mirror':return ['माथिल्लो बायाँ','माथिल्लो दायाँ','तल्लो बायाँ','तल्लो दायाँ']
            return LINE

          seed=[]; hashes=[]
          for i,item in enumerate(Q,1):
            raw=render(item)
            assert raw.count('<text') >= 6
            assert raw.count('>?</text>') == 1
            png=OUT/f'bo-2.2-{i:03d}.png'
            cairosvg.svg2png(bytestring=raw.encode(),write_to=str(png),output_width=1600,output_height=900)
            hashes.append(hashlib.sha256(png.read_bytes()).hexdigest())
            opts=texts(item); c=item[4]
            seed.append({'id':f'bo-2.2-{i:03d}','examIds':['sakha-adhikrit'],'section':'B','unit':'2.2','subject':'Non-verbal Reasoning','topic':item[1],'level':'L1','type':'pictorial','q':item[5],'question':item[5],'options':opts,'correct':c,'solution':item[6],'image':f'/image/exam/branch-officer-2.2/bo-2.2-{i:03d}.png','imageAlt':item[1]})
          assert len(set(hashes))==30
          assert len(seed)==30 and all(len(x['options'])==4 for x in seed)
          assert [seed[i]['options'][seed[i]['correct']] for i in range(15,20)]==['7 भुजा','8 भुजा','9 भुजा','14 भुजा','11 भुजा']
          assert seed[3]['options'][seed[3]['correct']]=='वृत्त'
          assert seed[6]['options'][seed[6]['correct']]=='वृत्त'
          Path('exam-question-seed/branch-officer-2.2-nonverbal-pictorial.json').write_text(json.dumps(seed,ensure_ascii=False,indent=2),encoding='utf-8')
          print('STRICT AUDIT PASSED: 30/30; 1600x900 PNG; unique figures; exact option-answer sync; Q16-20=7,8,9,14,11')
      - name: Commit generated bank
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add image/exam/branch-officer-2.2 exam-question-seed/branch-officer-2.2-nonverbal-pictorial.json
          git diff --cached --quiet && exit 0
          git commit -m "Generate final audited Branch Officer 2.2 pictorial bank"
          git push