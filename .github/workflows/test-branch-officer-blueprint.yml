name: Test Branch Officer 100-question blueprint

# Parent units include their descendant child units in the validation pool.
on:
  workflow_dispatch:
  push:
    paths:
      - 'exam-data.json'
      - 'netlify/functions/exam-api.js'
      - '.github/workflows/test-branch-officer-blueprint.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate exact Branch Officer paper selection against main dataset
        shell: python
        run: |
          import json
          import random
          from collections import Counter

          with open('exam-data.json', encoding='utf-8') as f:
              data = json.load(f)

          bank = data.get('questions', [])
          assert len(bank) == 2138, f'FAIL: main dataset has {len(bank)}, expected 2138'

          exams = data.get('exams', [])
          exam = next((x for x in exams if x.get('id') == 'sakha-adhikrit' and x.get('enabled', True) is not False), None)
          assert exam, 'FAIL: sakha-adhikrit exam config missing'
          assert int(exam.get('questionCount', 0)) == 100, f"FAIL: questionCount={exam.get('questionCount')}"
          assert int(exam.get('durationMinutes', 0)) == 90, f"FAIL: durationMinutes={exam.get('durationMinutes')}"
          assert float(exam.get('positiveMark', 1)) == 1.0, 'FAIL: positiveMark is not 1'
          assert float(exam.get('negativeMark', 0.2)) == 0.2, 'FAIL: negativeMark is not 0.2'
          assert float(exam.get('passPercent', 45)) == 45.0, 'FAIL: passPercent is not 45'

          sections = exam.get('blueprint', {}).get('sections', [])
          expected_sections = {'A': 50, 'B': 30, 'C': 20}
          assert {s.get('id') for s in sections} == set(expected_sections), 'FAIL: blueprint must contain exactly A, B, C'

          by_section = {}
          for s in sections:
              total = sum(int(u.get('questionCount', 0)) for u in s.get('units', []))
              by_section[s['id']] = total
              assert total == expected_sections[s['id']], f"FAIL: section {s['id']} quota={total}, expected {expected_sections[s['id']]}"

              units = {u.get('id'): int(u.get('questionCount', 0)) for u in s.get('units', [])}
              if s['id'] == 'B':
                  assert {u: units.get(u) for u in ['2.1','2.2','2.3','2.4','2.5']} == {u: 6 for u in ['2.1','2.2','2.3','2.4','2.5']}, f'FAIL: Section B unit quotas {units}'
              if s['id'] == 'C':
                  assert {u: units.get(u) for u in ['3.1','3.2','3.3']} == {'3.1':5,'3.2':7,'3.3':8}, f'FAIL: Section C unit quotas {units}'

          assert by_section == expected_sections, f'FAIL: section totals {by_section}'

          def unit_matches(q, unit):
              a = str(q.get('unit', ''))
              b = str(unit)
              return a == b or a.startswith(b + '.')

          def pick(pool, n):
              if len(pool) < n:
                  raise AssertionError(f'pool too small: {len(pool)} < {n}')
              return random.sample(pool, n)

          for s in sections:
              for u in s.get('units', []):
                  pool = [q for q in bank if q.get('section') == s['id'] and unit_matches(q, u['id'])]
                  need = int(u.get('questionCount', 0))
                  assert len(pool) >= need, f"FAIL: {s['id']}/{u['id']} has {len(pool)}, needs {need}"

          def select_paper():
              selected = []
              for s in sections:
                  for u in s.get('units', []):
                      pool = [q for q in bank if q.get('section') == s['id'] and unit_matches(q, u['id'])]
                      need = int(u.get('questionCount', 0))
                      selected.extend(pick(pool, need))
              random.shuffle(selected)
              return selected

          for trial in range(1, 1001):
              paper = select_paper()
              assert len(paper) == 100, f'FAIL trial {trial}: selected {len(paper)}'
              ids = [q.get('id') for q in paper]
              assert len(ids) == len(set(ids)) == 100, f'FAIL trial {trial}: duplicate IDs'

              counts = Counter(q.get('section') for q in paper)
              assert counts == Counter({'A':50,'B':30,'C':20}), f'FAIL trial {trial}: sections {dict(counts)}'

              for s in sections:
                  for u in s.get('units', []):
                      got = sum(1 for q in paper if q.get('section') == s['id'] and unit_matches(q, u['id']))
                      need = int(u.get('questionCount', 0))
                      assert got == need, f"FAIL trial {trial}: {s['id']}/{u['id']} got {got}, expected {need}"

              assert Counter(q.get('unit') for q in paper if q.get('section') == 'B') == Counter({'2.1':6,'2.2':6,'2.3':6,'2.4':6,'2.5':6})
              assert Counter(q.get('unit') for q in paper if q.get('section') == 'C') == Counter({'3.1':5,'3.2':7,'3.3':8})

          print('PASS: main dataset = 2,138 questions')
          print('PASS: Branch Officer = 100 questions, 90 minutes, +1 / -0.2, pass 45%')
          print('PASS: blueprint = A50 + B30 + C20')
          print('PASS: Section B = 2.1/2.2/2.3/2.4/2.5 = 6/6/6/6/6')
          print('PASS: Section C = 3.1/3.2/3.3 = 5/7/8')
          print('PASS: every blueprint unit has enough questions, including nested parent units')
          print('PASS: 1,000 randomized 100-question papers have exact quotas and no duplicates')
