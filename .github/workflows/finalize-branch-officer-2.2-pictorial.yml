name: Finalize Branch Officer 2.2 pictorial bank
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/finalize-branch-officer-2.2-pictorial.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet cairosvg
      - name: Build, render and audit all 30 questions
        shell: python
        run: |
          import json,math,hashlib
          from pathlib import Path
          import cairosvg
          O=Path('image/exam/branch-officer-2.2'); O.mkdir(parents=True,exist_ok=True)
          A='ABCD'; SH={'circle':'वृत्त','square':'वर्ग','triangle':'त्रिभुज','diamond':'हीरा'}; DIR=['माथि','दायाँ','तल','बायाँ']; LINE=['बायाँ-माथि ↘ दायाँ-तल','बायाँ-तल ↗ दायाँ-माथि','तेर्सो','ठाडो']
          Q=[]
          def add(k,t,seq,o,c,q,s): assert len(o)==4 and o[c] is not None; Q.append((k,t,seq,o,c,q,s))
          data=[
          ('shape','आकृति क्रम',['circle','square','circle','square'],['circle','square','triangle','diamond'],0,'आकृतिहरूको क्रम हेरी प्रश्नचिह्न (?) को स्थानमा आउने सही आकृति छान्नुहोस्।','A-B-A-B क्रम; अर्को वृत्त हो।'),
          ('shape','आकृति क्रम',['triangle','triangle','circle','circle'],['circle','triangle','square','diamond'],1,'आकृतिहरूको क्रम हेरी प्रश्नचिह्न (?) को स्थानमा आउने सही आकृति छान्नुहोस्।','दुई-दुईको समूह दोहोरिन्छ; अर्को त्रिभुज हो।'),
          ('shape','आकृति क्रम',['square','diamond','square','diamond'],['diamond','triangle','square','circle'],2,'आकृतिहरूको क्रम हेरी प्रश्नचिह्न (?) को स्थानमा आउने सही आकृति छान्नुहोस्।','वर्ग र हीरा पालैपालो आउँछन्; अर्को वर्ग हो।'),
          ('shape','आकृति क्रम',['circle','triangle','triangle','circle'],['square','circle','diamond','triangle'],1,'आकृतिहरूको क्रम हेरी प्रश्नचिह्न (?) को स्थानमा आउने सही आकृति छान्नुहोस्।','A-B-B-A क्रम दोहोरिन्छ; अर्को वृत्त हो।'),
          ('shape','आकृति क्रम',['diamond','circle','square','triangle'],['diamond','circle','square','triangle'],0,'आकृतिहरूको क्रम हेरी प्रश्नचिह्न (?) को स्थानमा आउने सही आकृति छान्नुहोस्।','चार आकृतिको चक्रपछि पहिलो आकृति अर्थात् हीरा आउँछ।'),
          ('shape','आकृति क्रम',['triangle','square','diamond','circle'],['square','triangle','diamond','circle'],1,'आकृतिहरूको क्रम हेरी प्रश्नचिह्न (?) को स्थानमा आउने सही आकृति छान्नुहोस्।','चार आकृतिको चक्रपछि फेरि त्रिभुज आउँछ।'),
          ('shape','आकृति क्रम',['circle','diamond','diamond','circle'],['circle','triangle','diamond','square'],0,'आकृतिहरूको क्रम हेरी प्रश्नचिह्न (?) को स्थानमा आउने सही आकृति छान्नुहोस्।','A-B-B-A क्रम; अर्को वृत्त हो।'),
          ('shape','आकृति क्रम',['square','triangle','square','triangle'],['square','triangle','diamond','circle'],0,'आकृतिहरूको क्रम हेरी प्रश्नचिह्न (?) को स्थानमा आउने सही आकृति छान्नुहोस्।','वर्ग र त्रिभुज पालैपालो छन्; अर्को वर्ग हो।'),
          ('shape','आकृति क्रम',['diamond','diamond','square','square'],['diamond','square','circle','triangle'],0,'आकृतिहरूको क्रम हेरी प्रश्नचिह्न (?) को स्थानमा आउने सही आकृति छान्नुहोस्।','दुई हीरा र दुई वर्गको समूहपछि अर्को हीरा हो।'),
          ('shape','आकृति क्रम',['circle','square','triangle','diamond'],['triangle','circle','square','diamond'],1,'आकृतिहरूको क्रम हेरी प्रश्नचिह्न (?) को स्थानमा आउने सही आकृति छान्नुहोस्।','चार आकृतिको चक्रपछि फेरि वृत्त आउँछ।'),
          ('rotation','घुमाइ',[0,1,2,3],[0,1,2,3],0,'तीरको घुमाइको नियम पहिचान गरी प्रश्नचिह्न (?) को स्थानमा आउने दिशा छान्नुहोस्।','९०° दायाँ घुम्ने क्रम; अर्को माथि।'),
          ('rotation','घुमाइ',[1,2,3,0],[0,1,2,3],1,'तीरको घुमाइको नियम पहिचान गरी प्रश्नचिह्न (?) को स्थानमा आउने दिशा छान्नुहोस्।','९०° दायाँ घुम्ने क्रम; अर्को दायाँ।'),
          ('rotation','घुमाइ',[2,0,2,0],[0,1,2,3],2,'तीरको घुमाइको नियम पहिचान गरी प्रश्नचिह्न (?) को स्थानमा आउने दिशा छान्नुहोस्।','तल र माथि पालैपालो; अर्को तल।'),
          ('rotation','घुमाइ',[3,2,1,0],[0,1,2,3],3,'तीरको घुमाइको नियम पहिचान गरी प्रश्नचिह्न (?) को स्थानमा आउने दिशा छान्नुहोस्।','९०° बायाँ घुम्ने क्रम; अर्को बायाँ।'),
          ('rotation','घुमाइ',[0,2,0,2],[0,1,2,3],0,'तीरको घुमाइको नियम पहिचान गरी प्रश्नचिह्न (?) को स्थानमा आउने दिशा छान्नुहोस्।','माथि र तल पालैपालो; अर्को माथि।'),
          ('sides','भुजा क्रम',[3,4,5,6],[7,5,6,8],0,'भुजाको संख्या हेरी प्रश्नचिह्न (?) को स्थानमा आउने सही विकल्प छान्नुहोस्।','हरेक चरणमा १ थपिन्छ; ६ पछि ७।'),
          ('sides','भुजा क्रम',[4,5,6,7],[6,8,5,9],1,'भुजाको संख्या हेरी प्रश्नचिह्न (?) को स्थानमा आउने सही विकल्प छान्नुहोस्।','हरेक चरणमा १ थपिन्छ; ७ पछि ८।'),
          ('sides','भुजा क्रम',[5,6,7,8],[9,6,7,10],0,'भुजाको संख्या हेरी प्रश्नचिह्न (?) को स्थानमा आउने सही विकल्प छान्नुहोस्।','हरेक चरणमा १ थपिन्छ; ८ पछि ९।'),
          ('sides','भुजा क्रम',[6,8,10,12],[10,12,13,14],3,'भुजाको संख्या हेरी प्रश्नचिह्न (?) को स्थानमा आउने सही विकल्प छान्नुहोस्।','हरेक चरणमा २ थपिन्छ; १२ पछि १४।'),
          ('sides','भुजा क्रम',[3,5,7,9],[11,9,10,13],0,'भुजाको संख्या हेरी प्रश्नचिह्न (?) को स्थानमा आउने सही विकल्प छान्नुहोस्।','हरेक चरणमा २ थपिन्छ; ९ पछि ११।')]
          for x in data:add(*x)
          mm={0:1,1:0,2:3,3:2}
          for n,p in enumerate([0,1,2,3,0],21):add('mirror','दर्पण प्रतिबिम्ब २' if n==25 else 'दर्पण प्रतिबिम्ब',[p],[0,1,2,3],mm[p],'ठाडो दर्पण रेखापछाडिको सही प्रतिबिम्ब छान्नुहोस्।',f'ठाडो दर्पणमा बायाँ-दायाँ स्थान उल्टिन्छ; सही प्रतिबिम्ब {A[mm[p]]} विकल्प हो।')
          lines=[([0,1,0,1],0,'पहिलो र दोस्रो विकर्ण पालैपालो दोहोरिन्छन्; अर्को पहिलो विकर्ण।'),([1,2,3,0],1,'चार दिशाको चक्र दोहोरिन्छ; अर्को दोस्रो विकर्ण।'),([2,3,0,1],2,'चार दिशाको चक्र दोहोरिन्छ; अर्को तेर्सो।'),([3,0,1,2],3,'चार दिशाको चक्र दोहोरिन्छ; अर्को ठाडो।'),([0,2,0,2],0,'० र २ पालैपालो छन्; अर्को पहिलो विकर्ण।')]
          for seq,c,s in lines:add('line','रेखा क्रम',seq,[0,1,2,3],c,'रेखाको दिशा क्रम पहिचान गरी प्रश्नचिह्न (?) को स्थानमा आउने सही रेखा छान्नुहोस्।',s)
          assert len(Q)==30
          assert [q[3][q[4]] for q in Q[15:20]]==[7,8,9,14,11]
          def shp(x,y,k,r=72):
            f={'circle':'#8f0e04','square':'#2563eb','triangle':'#059669','diamond':'#d97706'}[k]
            if k=='circle':return f'<circle cx="{x}" cy="{y}" r="{r}" fill="{f}" stroke="#172033" stroke-width="6"/>'
            if k=='square':return f'<rect x="{x-r}" y="{y-r}" width="{2*r}" height="{2*r}" rx="12" fill="{f}" stroke="#172033" stroke-width="6"/>'
            if k=='triangle':return f'<polygon points="{x},{y-r-10} {x-r-12},{y+r+10} {x+r+12},{y+r+10}" fill="{f}" stroke="#172033" stroke-width="6"/>'
            return f'<polygon points="{x},{y-r-10} {x+r+10},{y} {x},{y+r+10} {x-r-10},{y}" fill="{f}" stroke="#172033" stroke-width="6"/>'
          def ar(x,y,d,sc=1):return f'<g transform="translate({x} {y}) rotate({d*90}) scale({sc})"><path d="M-65 22H28V55L92 0 28-55V-22H-65Z" fill="#2563eb" stroke="#172033" stroke-width="6"/></g>'
          def pg(x,y,n,r=72):
            p=[]
            for i in range(n):a=-math.pi/2+2*math.pi*i/n;p.append(f'{x+r*math.cos(a):.1f},{y+r*math.sin(a):.1f}')
            return f'<polygon points="{" ".join(p)}" fill="#059669" stroke="#172033" stroke-width="6"/>'
          def ln(x,y,d,a=80):
            p=[(x-a,y-a,x+a,y+a),(x-a,y+a,x+a,y-a),(x-a,y,x+a,y),(x,y-a,x,y+a)][d];return f'<line x1="{p[0]}" y1="{p[1]}" x2="{p[2]}" y2="{p[3]}" stroke="#8f0e04" stroke-width="13" stroke-linecap="round"/>'
          def render(q):
            k,t,seq,o,c,question,solution=q
            z='<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#fff"/><rect x="24" y="24" width="1552" height="852" rx="28" fill="#f8fafc" stroke="#dbe3ec" stroke-width="4"/><text x="800" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="800" fill="#172033">प्रश्नचिह्न (?) को स्थानमा आउने सही विकल्प छान्नुहोस्</text>'
            if k=='mirror':
              p=seq[0]; col='#2563eb' if t.endswith('२') else '#8f0e04'; z+=f'<rect x="250" y="120" width="360" height="260" rx="22" fill="#fff" stroke="#94a3b8" stroke-width="4"/><line x1="800" y1="105" x2="800" y2="395" stroke="#64748b" stroke-width="6" stroke-dasharray="14 10"/><text x="800" y="95" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#64748b">ठाडो दर्पण रेखा</text><rect x="990" y="120" width="360" height="260" rx="22" fill="#fff" stroke="#8f0e04" stroke-width="6" stroke-dasharray="14 10"/><text x="1170" y="275" text-anchor="middle" font-size="86" font-weight="900" fill="#8f0e04">?</text><polygon points="365,325 430,160 495,325" fill="{col}" stroke="#172033" stroke-width="6"/><circle cx="{390 if p%2==0 else 490}" cy="{250+(-48 if p//2==0 else 48)}" r="15" fill="#f4c400" stroke="#172033" stroke-width="4"/>'
            else:
              xs=[150,430,710,990]
              for j,v in enumerate(seq):
                z+=f'<rect x="{xs[j]-105}" y="120" width="210" height="260" rx="22" fill="#fff" stroke="#94a3b8" stroke-width="4"/>'
                if k=='shape':z+=shp(xs[j],250,v)
                elif k=='rotation':z+=ar(xs[j],250,v,1.08)
                elif k=='sides':z+=pg(xs[j],250,v)
                else:z+=ln(xs[j],250,v)
              z+='<rect x="1260" y="120" width="210" height="260" rx="22" fill="#fff" stroke="#8f0e04" stroke-width="6" stroke-dasharray="14 10"/><text x="1365" y="275" text-anchor="middle" font-size="86" font-weight="900" fill="#8f0e04">?</text>'
            for j,v in enumerate(o):
              x=40+j*390
              if k=='shape':b=shp(x+150,665,v)
              elif k=='rotation':b=ar(x+150,665,v,.98)
              elif k=='sides':b=pg(x+150,665,v,70)
              elif k=='line':b=ln(x+150,665,v,76)
              else:b=f'<polygon points="{x+100},735 {x+150},590 {x+200},735" fill="#8f0e04" stroke="#172033" stroke-width="5"/><circle cx="{x+150+(-38 if v%2==0 else 38)}" cy="{665+(-46 if v//2==0 else 46)}" r="13" fill="#f4c400" stroke="#172033" stroke-width="3"/>'
              z+=f'<rect x="{x}" y="500" width="300" height="300" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="4"/><text x="{x+150}" y="545" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="800" fill="#334155">{A[j]}</text>{b}'
            return z+'</svg>'
          def opts(q):
            k=q[0];o=q[3]
            if k=='shape':return [SH[x] for x in o]
            if k=='rotation':return [DIR[x] for x in o]
            if k=='sides':return [f'{x} भुजा' for x in o]
            if k=='mirror':return ['माथिल्लो बायाँ','माथिल्लो दायाँ','तल्लो बायाँ','तल्लो दायाँ']
            return LINE
          seed=[]; H=[]
          for i,q in enumerate(Q,1):
            raw=render(q); assert raw.count('>?</text>')==1
            p=O/f'bo-2.2-{i:03d}.png'; cairosvg.svg2png(bytestring=raw.encode(),write_to=str(p),output_width=1600,output_height=900); H.append(hashlib.sha256(p.read_bytes()).hexdigest())
            o=opts(q); seed.append({'id':f'bo-2.2-{i:03d}','examIds':['sakha-adhikrit'],'section':'B','unit':'2.2','subject':'Non-verbal Reasoning','topic':q[1],'level':'L1','type':'pictorial','q':q[5],'question':q[5],'options':o,'correct':q[4],'solution':q[6],'image':f'/image/exam/branch-officer-2.2/bo-2.2-{i:03d}.png','imageAlt':q[1]})
          assert len(set(H))==30 and len(seed)==30
          assert all(len(x['options'])==4 and x['options'][x['correct']] for x in seed)
          assert [seed[i]['options'][seed[i]['correct']] for i in range(15,20)]==['7 भुजा','8 भुजा','9 भुजा','14 भुजा','11 भुजा']
          assert seed[3]['options'][seed[3]['correct']]=='वृत्त' and seed[6]['options'][seed[6]['correct']]=='वृत्त'
          Path('exam-question-seed/branch-officer-2.2-nonverbal-pictorial.json').write_text(json.dumps(seed,ensure_ascii=False,indent=2),encoding='utf-8')
          print('FINAL AUDIT PASSED: 30/30, unique 1600x900 PNGs, exact answers, Q16-20=7/8/9/14/11')
      - name: Commit generated bank
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add image/exam/branch-officer-2.2 exam-question-seed/branch-officer-2.2-nonverbal-pictorial.json
          git diff --cached --quiet && exit 0
          git commit -m "Generate final audited Branch Officer 2.2 bank"
          git push