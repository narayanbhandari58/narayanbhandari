name: Merge exam question seed

on:
  push:
    paths:
      - 'exam-question-seed/**'
      - '.github/workflows/merge-exam-question-seed.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge seed questions into exam-data.json
        shell: python
        run: |
          import base64
          import gzip
          import json
          import re
          from pathlib import Path

          def load_seed(path):
              text = path.read_text(encoding='utf-8')
              # Legacy 2.2 used a literal slash-backslash glyph pair, which is not valid JSON escaping.
              if path.name == 'branch-officer-2.2-non-verbal-reasoning-l1-l2.json':
                  text = text.replace('/\\', 'diagonal')
              try:
                  return json.loads(text)
              except json.JSONDecodeError:
                  repaired = re.sub(r'\\(?!["\\/bfnrtu])', r'\\\\', text)
                  try:
                      path.write_text(repaired, encoding='utf-8')
                      return json.loads(repaired)
                  except json.JSONDecodeError as exc:
                      print(f'Malformed seed: {path} at line {exc.lineno}, column {exc.colno}: {exc.msg}')
                      raise

          data_path = Path('exam-data.json')
          data = json.loads(data_path.read_text(encoding='utf-8'))
          questions = data.setdefault('questions', [])
          by_id = {q.get('id'): i for i, q in enumerate(questions)}
          added = 0
          updated = 0

          chunks = sorted(Path('exam-question-seed').glob('branch-officer-1.6-data.part*.b64'))
          if chunks:
              payload = ''.join(p.read_text(encoding='utf-8').strip() for p in chunks)
              generated = json.loads(gzip.decompress(base64.b64decode(payload)).decode('utf-8'))
              assert len(generated) == 180, f'Branch Officer 1.6 expected 180 questions, got {len(generated)}'
              for q in generated:
                  qid = q.get('id')
                  if qid in by_id:
                      questions[by_id[qid]] = q
                      updated += 1
                  else:
                      by_id[qid] = len(questions)
                      questions.append(q)
                      added += 1

          generator = Path('exam-question-seed/generate-branch-officer-1.7.py')
          if generator.exists():
              source = generator.read_text(encoding='utf-8')
              source = source.replace("base64.b64decode(DATA_B64)", "base64.b64decode(DATA_B64 + '=' * (-len(DATA_B64) % 4))")
              exec(compile(source, str(generator), 'exec'))

          for path in sorted(Path('exam-question-seed').glob('*.json')):
              seed = load_seed(path)
              assert isinstance(seed, list), f'{path} must contain a JSON array'

              if path.name == 'branch-officer-2.4-general-mental-logical-analytical.json':
                  for q in seed:
                      qid = q.get('id')
                      if qid == 'bo-2.4-023':
                          q['options'][3] = 'No officer is necessarily the most senior'
                          q['correct'] = 3
                          q['solution'] = 'N is senior to M and M is senior to L, while K is only known to be senior to L. Therefore no officer is forced to be the most senior.'
                      elif qid == 'bo-2.4-028':
                          q['question'] = 'What is the value of x? Statement I: x is an even integer greater than 4 and less than 10. Statement II: x is divisible by 3.'
                          q['correct'] = 2
                          q['solution'] = 'Statement I allows x = 6 or 8. Statement II allows many values, including 6. Together they force x = 6, so both statements are sufficient together.'
                      elif qid == 'bo-2.4-047':
                          q['question'] = 'Five tasks A, B, C, D and E must be scheduled Monday to Friday, one per day. B must be after A. A must be before C. C must be immediately before D. E must be Friday. Which task must be Wednesday?'
                          q['correct'] = 2
                          q['solution'] = 'E is Friday and C-D must be consecutive. Since A must be before C and B must be after A, A-B occupy Monday-Tuesday and C-D occupy Wednesday-Thursday. Therefore C must be Wednesday.'
                      elif qid == 'bo-2.4-048':
                          q['question'] = 'Four interviews P, Q, R and S are scheduled in four slots. P is in the second slot. Q is before R. S is immediately after P. Which sequence is valid?'
                          q['correct'] = 1
                          q['solution'] = 'Q-P-S-R satisfies P in slot 2, Q before R, and S immediately after P. The other options violate at least one condition.'
                      elif qid == 'bo-2.4-055':
                          q['options'][1] = 'B and C are both liars'
                          q['correct'] = 1
                          q['solution'] = 'If A is a liar, A’s statement that B is truthful is false, so B is a liar. B then lies when saying C is truthful, so C is also a liar. Therefore B and C are both liars.'

              for q in seed:
                  qid = q.get('id')
                  if qid in by_id:
                      questions[by_id[qid]] = q
                      updated += 1
                  else:
                      by_id[qid] = len(questions)
                      questions.append(q)
                      added += 1

          q18 = [q for q in questions if q.get('unit') == '1.8']
          assert len(q18) == 240, f'1.8 expected 240 questions, got {len(q18)}'
          expected_categories = {'राजनीतिक','सामाजिक','सांस्कृतिक','आर्थिक','वैज्ञानिक','खेलकुद','पुस्तक','पुरस्कार','कला','साहित्य','संगीत','अन्य महत्त्वपूर्ण'}
          actual_categories = {q.get('category') for q in q18}
          assert actual_categories == expected_categories, f'1.8 categories mismatch: {sorted(actual_categories)}'
          for category in expected_categories:
              count = sum(1 for q in q18 if q.get('category') == category)
              assert count == 20, f'1.8 {category} expected 20, got {count}'
          assert sum(1 for q in q18 if q.get('level') == 'I') == 120, '1.8 Level I must be 120'
          assert sum(1 for q in q18 if q.get('level') == 'II') == 120, '1.8 Level II must be 120'

          letters = ['A', 'B', 'C', 'D']
          balanced_units = {'1.3', '1.4.1', '1.4.2', '1.6.1', '1.6.2', '1.6.3', '1.7.1', '1.7.2', '1.8'}
          balanced_by_unit = {}
          for q in questions:
              if q.get('unit') not in balanced_units:
                  continue
              options = q.get('options') or []
              correct = q.get('correct')
              if len(options) != 4 or not isinstance(correct, int) or not (0 <= correct < 4):
                  continue
              qid = str(q.get('id', ''))
              try:
                  number = int(qid.rsplit('-', 1)[1])
              except (ValueError, IndexError):
                  number = balanced_by_unit.get(q.get('unit'), 0) + 1
              target = (number - 1) % 4
              if correct != target:
                  answer = options[correct]
                  distractors = [opt for i, opt in enumerate(options) if i != correct]
                  new_options = distractors[:]
                  new_options.insert(target, answer)
                  q['options'] = new_options
                  q['correct'] = target
              q['solution'] = f'सही उत्तर: {letters[target]}।'
              balanced_by_unit[q.get('unit')] = balanced_by_unit.get(q.get('unit'), 0) + 1

          q24 = [q for q in questions if q.get('unit') == '2.4']
          assert len(q24) == 60, f'2.4 expected 60 questions, got {len(q24)}'
          assert sum(1 for q in q24 if q.get('level') == 'L1') == 30, '2.4 Level I must be 30'
          assert sum(1 for q in q24 if q.get('level') == 'L2') == 30, '2.4 Level II must be 30'
          assert {q.get('id') for q in q24} == {f'bo-2.4-{i:03d}' for i in range(1, 61)}, '2.4 IDs mismatch'
          for q in q24:
              assert len(q.get('options') or []) == 4, f"2.4 invalid options: {q.get('id')}"
              assert isinstance(q.get('correct'), int) and 0 <= q['correct'] < 4, f"2.4 invalid answer: {q.get('id')}"
          counts = [sum(1 for q in q24 if q.get('correct') == i) for i in range(4)]
          assert counts == [15, 15, 15, 15], f'2.4 answer balance mismatch: {counts}'

          if added or updated or balanced_by_unit:
              data['version'] = max(int(data.get('version', 1)), 3)
              data['questionBankUpdatedAt'] = __import__('datetime').datetime.utcnow().isoformat() + 'Z'
              data_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              print(f'Added {added}, updated {updated}; balanced={balanced_by_unit}; 2.4 balance={counts}; total={len(questions)}')
          else:
              print('No question changes.')
      - name: Commit merged question bank and repaired seeds
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exam-data.json exam-question-seed/*.json
          git diff --cached --quiet || git commit -m 'Sync and validate exam question bank'
          git push