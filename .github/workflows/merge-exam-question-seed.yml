name: Merge exam question seed

on:
  push:
    paths:
      - 'exam-question-seed/**'
      - '.github/workflows/merge-exam-question-seed.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge seed questions into exam-data.json
        shell: python
        run: |
          import base64, gzip, json
          from pathlib import Path

          data_path = Path('exam-data.json')
          data = json.loads(data_path.read_text(encoding='utf-8'))
          questions = data.setdefault('questions', [])
          by_id = {q.get('id'): i for i, q in enumerate(questions)}
          added = updated = 0

          chunks = sorted(Path('exam-question-seed').glob('branch-officer-1.6-data.part*.b64'))
          if chunks:
              payload = ''.join(p.read_text(encoding='utf-8').strip() for p in chunks)
              generated = json.loads(gzip.decompress(base64.b64decode(payload)).decode('utf-8'))
              assert len(generated) == 180
              for q in generated:
                  qid = q.get('id')
                  if qid in by_id:
                      questions[by_id[qid]] = q; updated += 1
                  else:
                      by_id[qid] = len(questions); questions.append(q); added += 1

          generator = Path('exam-question-seed/generate-branch-officer-1.7.py')
          if generator.exists():
              source = generator.read_text(encoding='utf-8')
              source = source.replace('base64.b64decode(DATA_B64)', "base64.b64decode(DATA_B64 + '=' * (-len(DATA_B64) % 4))")
              exec(compile(source, str(generator), 'exec'))

          for path in sorted(Path('exam-question-seed').glob('*.json')):
              try:
                  seed = json.loads(path.read_text(encoding='utf-8'))
              except json.JSONDecodeError as exc:
                  raise RuntimeError(f'Malformed seed {path}: line {exc.lineno}, column {exc.colno}: {exc.msg}') from exc
              assert isinstance(seed, list), f'{path} must contain a JSON array'

              if path.name == 'branch-officer-2.4-general-mental-logical-analytical.json':
                  for q in seed:
                      qid = q.get('id')
                      if qid == 'bo-2.4-023':
                          q['options'][3] = 'No officer is necessarily the most senior'; q['correct'] = 3
                          q['solution'] = 'N is senior to M and M is senior to L, while K is only known to be senior to L. Therefore no officer is forced to be the most senior.'
                      elif qid == 'bo-2.4-028':
                          q['question'] = 'What is the value of x? Statement I: x is an even integer greater than 4 and less than 10. Statement II: x is divisible by 3.'; q['correct'] = 2
                          q['solution'] = 'Statement I allows x = 6 or 8. Statement II allows many values, including 6. Together they force x = 6, so both statements are sufficient together.'
                      elif qid == 'bo-2.4-047':
                          q['question'] = 'Five tasks A, B, C, D and E must be scheduled Monday to Friday, one per day. B must be after A. A must be before C. C must be immediately before D. E must be Friday. Which task must be Wednesday?'; q['correct'] = 2
                          q['solution'] = 'E is Friday and C-D must be consecutive. Since A must be before C and B must be after A, A-B occupy Monday-Tuesday and C-D occupy Wednesday-Thursday. Therefore C must be Wednesday.'
                      elif qid == 'bo-2.4-048':
                          q['question'] = 'Four interviews P, Q, R and S are scheduled in four slots. P is in the second slot. Q is before R. S is immediately after P. Which sequence is valid?'; q['correct'] = 1
                          q['solution'] = 'Q-P-S-R satisfies P in slot 2, Q before R, and S immediately after P. The other options violate at least one condition.'
                      elif qid == 'bo-2.4-055':
                          q['options'][1] = 'B and C are both liars'; q['correct'] = 1
                          q['solution'] = 'If A is a liar, A’s statement that B is truthful is false, so B is a liar. B then lies when saying C is truthful, so C is also a liar. Therefore B and C are both liars.'

              for q in seed:
                  qid = q.get('id')
                  if qid in by_id:
                      questions[by_id[qid]] = q; updated += 1
                  else:
                      by_id[qid] = len(questions); questions.append(q); added += 1

          q18 = [q for q in questions if q.get('unit') == '1.8']
          assert len(q18) == 240
          expected_categories = {'राजनीतिक','सामाजिक','सांस्कृतिक','आर्थिक','वैज्ञानिक','खेलकुद','पुस्तक','पुरस्कार','कला','साहित्य','संगीत','अन्य महत्त्वपूर्ण'}
          assert {q.get('category') for q in q18} == expected_categories
          for c in expected_categories: assert sum(1 for q in q18 if q.get('category') == c) == 20
          assert sum(1 for q in q18 if q.get('level') == 'I') == 120
          assert sum(1 for q in q18 if q.get('level') == 'II') == 120

          balanced_units = {'1.3','1.4.1','1.4.2','1.6.1','1.6.2','1.6.3','1.7.1','1.7.2','1.8','2.4'}
          letters = ['A','B','C','D']
          for unit in balanced_units:
              unit_questions = [q for q in questions if q.get('unit') == unit]
              for q in unit_questions:
                  opts, correct = q.get('options') or [], q.get('correct')
                  if len(opts) != 4 or not isinstance(correct, int) or not 0 <= correct < 4: continue
                  try: number = int(str(q.get('id')).rsplit('-',1)[1])
                  except (ValueError, IndexError): continue
                  target = (number - 1) % 4
                  if correct != target:
                      answer = opts[correct]
                      distractors = [o for i,o in enumerate(opts) if i != correct]
                      distractors.insert(target, answer)
                      q['options'], q['correct'] = distractors, target

          q24 = [q for q in questions if q.get('unit') == '2.4']
          assert len(q24) == 60, f'2.4 expected 60, got {len(q24)}'
          assert {q.get('id') for q in q24} == {f'bo-2.4-{i:03d}' for i in range(1,61)}
          assert sum(q.get('level') == 'L1' for q in q24) == 30
          assert sum(q.get('level') == 'L2' for q in q24) == 30
          for q in q24: assert len(q.get('options') or []) == 4 and isinstance(q.get('correct'), int) and 0 <= q['correct'] < 4
          counts = [sum(q.get('correct') == i for q in q24) for i in range(4)]
          assert counts == [15,15,15,15], f'2.4 balance {counts}'

          data['version'] = max(int(data.get('version',1)),3)
          data['questionBankUpdatedAt'] = __import__('datetime').datetime.utcnow().isoformat() + 'Z'
          data_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Added {added}, updated {updated}; 2.4 balance={counts}; total={len(questions)}')
      - name: Commit merged question bank
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exam-data.json
          git diff --cached --quiet || git commit -m 'Sync and validate exam question bank'
          git push