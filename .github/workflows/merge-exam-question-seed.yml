name: Merge exam question seed

on:
  push:
    paths:
      - 'exam-question-seed/**'
      - '.github/workflows/merge-exam-question-seed.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge seed questions into exam-data.json
        shell: python
        run: |
          import base64
          import gzip
          import json
          from pathlib import Path

          data_path = Path('exam-data.json')
          data = json.loads(data_path.read_text(encoding='utf-8'))
          questions = data.setdefault('questions', [])
          by_id = {q.get('id'): i for i, q in enumerate(questions)}
          added = 0
          updated = 0

          chunks = sorted(Path('exam-question-seed').glob('branch-officer-1.6-data.part*.b64'))
          if chunks:
              payload = ''.join(p.read_text(encoding='utf-8').strip() for p in chunks)
              generated = json.loads(gzip.decompress(base64.b64decode(payload)).decode('utf-8'))
              assert len(generated) == 180, f'Branch Officer 1.6 expected 180 questions, got {len(generated)}'
              for q in generated:
                  qid = q.get('id')
                  if qid in by_id:
                      questions[by_id[qid]] = q
                      updated += 1
                  else:
                      by_id[qid] = len(questions)
                      questions.append(q)
                      added += 1

          generator = Path('exam-question-seed/generate-branch-officer-1.7.py')
          if generator.exists():
              source = generator.read_text(encoding='utf-8')
              source = source.replace("base64.b64decode(DATA_B64)", "base64.b64decode(DATA_B64 + '=' * (-len(DATA_B64) % 4))")
              exec(compile(source, str(generator), 'exec'))

          for path in sorted(Path('exam-question-seed').glob('*.json')):
              if path.name == 'generated-branch-officer-1.7.json':
                  pass
              seed = json.loads(path.read_text(encoding='utf-8'))
              assert isinstance(seed, list), f'{path} must contain a JSON array'
              for q in seed:
                  qid = q.get('id')
                  if qid in by_id:
                      questions[by_id[qid]] = q
                      updated += 1
                  else:
                      by_id[qid] = len(questions)
                      questions.append(q)
                      added += 1

          # 1.8 is a fully current 240-question module: 20 questions in each of 12 areas.
          q18 = [q for q in questions if q.get('unit') == '1.8']
          assert len(q18) == 240, f'1.8 expected 240 questions, got {len(q18)}'
          expected_categories = {'राजनीतिक','सामाजिक','सांस्कृतिक','आर्थिक','वैज्ञानिक','खेलकुद','पुस्तक','पुरस्कार','कला','साहित्य','संगीत','अन्य महत्त्वपूर्ण'}
          actual_categories = {q.get('category') for q in q18}
          assert actual_categories == expected_categories, f'1.8 categories mismatch: {sorted(actual_categories)}'
          for category in expected_categories:
              count = sum(1 for q in q18 if q.get('category') == category)
              assert count == 20, f'1.8 {category} expected 20, got {count}'
          assert sum(1 for q in q18 if q.get('level') == 'I') == 120, '1.8 Level I must be 120'
          assert sum(1 for q in q18 if q.get('level') == 'II') == 120, '1.8 Level II must be 120'

          letters = ['A', 'B', 'C', 'D']
          balanced_units = {'1.3', '1.4.1', '1.4.2', '1.6.1', '1.6.2', '1.6.3', '1.7.1', '1.7.2', '1.8'}
          balanced_by_unit = {}
          for q in questions:
              if q.get('unit') not in balanced_units:
                  continue
              options = q.get('options') or []
              correct = q.get('correct')
              if len(options) != 4 or not isinstance(correct, int) or not (0 <= correct < 4):
                  continue
              qid = str(q.get('id', ''))
              try:
                  number = int(qid.rsplit('-', 1)[1])
              except (ValueError, IndexError):
                  number = balanced_by_unit.get(q.get('unit'), 0) + 1
              target = (number - 1) % 4
              if correct != target:
                  answer = options[correct]
                  distractors = [opt for i, opt in enumerate(options) if i != correct]
                  new_options = distractors[:]
                  new_options.insert(target, answer)
                  q['options'] = new_options
                  q['correct'] = target
              q['solution'] = f'सही उत्तर: {letters[target]}।'
              balanced_by_unit[q.get('unit')] = balanced_by_unit.get(q.get('unit'), 0) + 1

          if added or updated or balanced_by_unit:
              data['version'] = max(int(data.get('version', 1)), 3)
              data['questionBankUpdatedAt'] = __import__('datetime').datetime.utcnow().isoformat() + 'Z'
              data_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              print(f'Added {added}, updated {updated}; balanced={balanced_by_unit}; total={len(questions)}')
          else:
              print('No question changes.')
      - name: Commit merged question bank
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exam-data.json
          git diff --cached --quiet || git commit -m 'Sync exam question bank from seeds'
          git push
