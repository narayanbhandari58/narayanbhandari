name: Add main Admin Exam Management entry
on:
  push:
    paths:
      - '.github/workflows/add-main-question-bank.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add dedicated Exam Management entry to admin.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="admin-exam.js"></script>'
          new='<script src="admin-exam-entry.js"></script>'
          if old in s:
              s=s.replace(old,new)
          elif new not in s:
              s=s.replace('</body>',new+'</body>')
          p.write_text(s,encoding='utf-8')
          css=Path('admin.css')
          add='''\n#onlineExamManagementCard{margin:22px 0}\n#onlineExamManagementCard .exam-bank-note{margin:4px 0 0;color:var(--muted,#666)}\n'''
          oldcss=css.read_text(encoding='utf-8') if css.exists() else ''
          if '#onlineExamManagementCard{' not in oldcss: css.write_text(oldcss+add,encoding='utf-8')
          PY
          if git diff --quiet; then echo 'No changes'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html admin.css
          git commit -m 'Add dedicated Online Exam Management entry'
          git push
