name: Normalize Branch Officer parent-child hierarchy

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/normalize-branch-officer-hierarchy.yml'
      - 'exam-data.json'
      - 'exam-question-seed/**'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize child units and validate blueprint
        shell: python
        run: |
          import json
          from pathlib import Path

          p = Path('exam-data.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          exam = next(x for x in data.get('exams', []) if x.get('id') == 'sakha-adhikrit')
          sections = exam.get('blueprint', {}).get('sections', [])
          bank = data.get('questions', [])

          units = []
          for s in sections:
              for u in s.get('units', []):
                  units.append((str(u.get('id')), s.get('id'), s.get('title')))
          units.sort(key=lambda x: len(x[0]), reverse=True)

          changed = 0
          removed = 0
          for q in bank:
              qid = str(q.get('id', ''))
              if qid.startswith('bo-1.7-00'):
                  removed += 1
                  continue
              uid = str(q.get('unit', ''))
              match = next((x for x in units if uid == x[0] or uid.startswith(x[0] + '.')), None)
              if not match:
                  continue
              unit_id, section_id, section_title = match
              if q.get('examIds') is None:
                  q['examIds'] = ['sakha-adhikrit']
              if q.get('section') != section_id:
                  q['section'] = section_id
                  changed += 1
              parent = unit_id
              if uid != unit_id:
                  if q.get('parentUnit') != parent:
                      q['parentUnit'] = parent
                      changed += 1
                  path = f'{parent} > {uid}'
                  if q.get('unitPath') != path:
                      q['unitPath'] = path
                      changed += 1

          if removed:
              bank = [q for q in bank if not str(q.get('id','')).startswith('bo-1.7-00')]
              data['questions'] = bank

          def matches(q, unit):
              a = str(q.get('unit', ''))
              b = str(unit)
              return a == b or a.startswith(b + '.')

          for s in sections:
              for u in s.get('units', []):
                  uid = str(u.get('id'))
                  need = int(u.get('questionCount', 0))
                  pool = [q for q in bank if q.get('examIds') and 'sakha-adhikrit' in q.get('examIds', []) and q.get('section') == s.get('id') and matches(q, uid)]
                  assert len(pool) >= need, f"FAIL: {s.get('id')}/{uid} has {len(pool)}, needs {need}"
                  if uid == '1.7':
                      assert any(str(q.get('unit','')).startswith('1.7.') for q in pool), 'FAIL: 1.7 has no child-unit questions'

          data['questionBankUpdatedAt'] = __import__('datetime').datetime.utcnow().isoformat() + 'Z'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'PASS: Branch Officer hierarchy validated; changed={changed}; removedTemporary={removed}')
          print('PASS: parent units count their own and descendant child units')

      - name: Commit normalized data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exam-data.json
          git diff --cached --quiet || git commit -m 'Normalize Branch Officer parent-child question hierarchy'
          git push
