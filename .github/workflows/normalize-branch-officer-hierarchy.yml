name: Normalize Branch Officer parent-child hierarchy

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/normalize-branch-officer-hierarchy.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize child units and validate blueprint
        shell: python
        run: |
          import json
          from pathlib import Path

          p = Path('exam-data.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          exam = next(x for x in data.get('exams', []) if x.get('id') == 'sakha-adhikrit')
          sections = exam.get('blueprint', {}).get('sections', [])
          bank = data.get('questions', [])

          units = []
          for s in sections:
              for u in s.get('units', []):
                  units.append((str(u.get('id')), s.get('id')))
          units.sort(key=lambda x: len(x[0]), reverse=True)

          changed = 0
          for q in bank:
              uid = str(q.get('unit', ''))
              match = next((x for x in units if uid == x[0] or uid.startswith(x[0] + '.')), None)
              if not match:
                  continue
              unit_id, section_id = match
              if q.get('section') != section_id:
                  q['section'] = section_id
                  changed += 1
              if uid != unit_id:
                  if q.get('parentUnit') != unit_id:
                      q['parentUnit'] = unit_id
                      changed += 1
                  path = f'{unit_id} > {uid}'
                  if q.get('unitPath') != path:
                      q['unitPath'] = path
                      changed += 1

          before = len(bank)
          bank = [q for q in bank if not str(q.get('id','')).startswith('bo-1.7-00')]
          if len(bank) != before:
              data['questions'] = bank
              changed += before - len(bank)

          def matches(q, unit):
              a = str(q.get('unit', ''))
              b = str(unit)
              return a == b or a.startswith(b + '.')

          for s in sections:
              for u in s.get('units', []):
                  uid = str(u.get('id'))
                  need = int(u.get('questionCount', 0))
                  pool = [q for q in bank if q.get('section') == s.get('id') and matches(q, uid)]
                  assert len(pool) >= need, f"FAIL: {s.get('id')}/{uid} has {len(pool)}, needs {need}"

          pool17 = [q for q in bank if q.get('section') == 'A' and matches(q, '1.7')]
          assert len(pool17) >= 6, f'FAIL: A/1.7 has {len(pool17)}, needs 6'
          assert any(str(q.get('unit','')).startswith('1.7.') for q in pool17), 'FAIL: 1.7 has no child-unit questions'

          if changed:
              p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'PASS: Branch Officer hierarchy validated; changed={changed}')
          print(f'PASS: A/1.7 sees {len(pool17)} questions from 1.7 and its child units')

      - name: Commit normalized data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exam-data.json
          git diff --cached --quiet || git commit -m 'Normalize Branch Officer parent-child question hierarchy'
          git push
