name: Fix final pictorial workflow once
on:
  push:
    paths: ['.github/workflows/fix-finalize-pictorial-once.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix generated output variable
        run: |
          sed -i 's/p=OUT\/f/p=O\/f/g' .github/workflows/finalize-branch-officer-2.2-pictorial.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/finalize-branch-officer-2.2-pictorial.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix final pictorial output path"
          git push