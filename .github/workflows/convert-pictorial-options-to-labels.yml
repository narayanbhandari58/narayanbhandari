name: Convert pictorial options to A B C D

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/convert-pictorial-options-to-labels.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Convert pictorial option values to labels
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('exam-question-seed/branch-officer-2.2-nonverbal-pictorial.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          assert len(data)==30, f'Expected 30 pictorial questions, got {len(data)}'
          for q in data:
              assert q.get('type')=='pictorial', q.get('id')
              assert len(q.get('options',[]))==4, q.get('id')
              assert isinstance(q.get('correct'),int) and 0<=q['correct']<4, q.get('id')
              q['options']=['A','B','C','D']
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('Converted',len(data),'pictorial questions to A/B/C/D options')
          PY

      - name: Validate and commit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('exam-question-seed/branch-officer-2.2-nonverbal-pictorial.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          assert len(data)==30
          assert all(q['options']==['A','B','C','D'] for q in data)
          assert all(isinstance(q['correct'],int) and 0<=q['correct']<4 for q in data)
          assert len({q['id'] for q in data})==30
          assert all(q.get('image') for q in data)
          print('PASS: 30/30 pictorial questions use A/B/C/D labels and retain correct indices/images')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exam-question-seed/branch-officer-2.2-nonverbal-pictorial.json
          git diff --cached --quiet || git commit -m 'Convert pictorial options to A B C D labels'
          git push
