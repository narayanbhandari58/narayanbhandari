name: Verify Loksewa exam blueprints

on:
  push:
    paths:
      - 'exam-data.json'
      - 'netlify/functions/exam-api.js'
      - 'exam.js'
      - 'exam-resume.js'
      - '.github/workflows/verify-exam-blueprints.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate dynamic question-bank and per-exam blueprint rules
        shell: python
        run: |
          import json
          from pathlib import Path

          data = json.loads(Path('exam-data.json').read_text(encoding='utf-8'))
          exams = {e['id']: e for e in data.get('exams', [])}
          questions = data.get('questions', [])
          assert questions, 'Question bank is empty'

          for exam_id in ('sakha-adhikrit', 'nasu', 'kharidar'):
              assert exam_id in exams, f'Missing exam config: {exam_id}'
              exam = exams[exam_id]
              count = int(exam.get('questionCount', 0))
              assert count > 0, f'{exam_id}: invalid questionCount={count}'
              sections = exam.get('blueprint', {}).get('sections', [])
              assert sections, f'{exam_id}: blueprint sections missing'
              unit_total = sum(int(u.get('questionCount', 0)) for s in sections for u in s.get('units', []))
              assert unit_total == count, f'{exam_id}: blueprint unit total {unit_total} != questionCount {count}'

              mapped = [q for q in questions if exam_id in (q.get('examIds') or [])]
              usable = [q for q in mapped if q.get('type') != 'pictorial' or q.get('image') or q.get('imageUrl') or q.get('image_url')]
              print(f'{exam_id}: paper={count}, mapped={len(mapped)}, usable={len(usable)}')

              for section in sections:
                  sid = section.get('id')
                  for unit in section.get('units', []):
                      uid = str(unit.get('id', ''))
                      need = int(unit.get('questionCount', 0))
                      pool = [q for q in usable if q.get('section') == sid and (str(q.get('unit', '')) == uid or str(q.get('unit', '')).startswith(uid + '.'))]
                      if len(pool) < need:
                          print(f'  SHORTAGE {sid}/{uid}: {len(pool)}/{need}')
                  dist = section.get('levelDistribution') or {}
                  if dist:
                      pool = [q for q in usable if q.get('section') == sid]
                      l1 = sum(str(q.get('level', '')).lower() in ('level1','l1','i','1') for q in pool)
                      l2 = sum(str(q.get('level', '')).lower() in ('level2','l2','ii','2') for q in pool)
                      print(f'  LEVEL {sid}: L1={l1}, L2={l2}, required={dist}')

          api = Path('netlify/functions/exam-api.js').read_text(encoding='utf-8')
          assert 'questions.length' not in api or '2138' not in api, 'Hard-coded 2138 detected in exam API'
          assert 'eligibleQuestions(exam, questions)' in api, 'Per-exam eligibility function missing'
          assert 'selectPaper(exam, bank)' in api, 'Per-exam paper selector missing'
          print('Blueprint verification completed.')
