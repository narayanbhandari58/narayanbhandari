name: Remove Admin links from public pages

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/remove-public-admin-links.yml'

permissions:
  contents: write

jobs:
  remove-public-admin-links:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove Admin navigation from public HTML pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [Path('index.html'), Path('about_me.html'), Path('font.html'), Path('loksewa.html')]
          changed = []

          for p in files:
              s = p.read_text(encoding='utf-8')
              original = s

              # Remove the complete navigation <li> that points to admin.html.
              s = re.sub(
                  r'\s*<li\b[^>]*>\s*<a\b[^>]*href=["\']admin\.html(?:\?[^"\']*)?["\'][^>]*>.*?</a>\s*</li>\s*',
                  '\n', s, flags=re.I | re.S
              )

              # Also handle any standalone Admin anchor left outside an li.
              s = re.sub(
                  r'\s*<a\b[^>]*href=["\']admin\.html(?:\?[^"\']*)?["\'][^>]*class=["\'][^"\']*admin-btn[^"\']*["\'][^>]*>.*?</a>\s*',
                  '\n', s, flags=re.I | re.S
              )

              if s != original:
                  p.write_text(s, encoding='utf-8')
                  changed.append(str(p))

          if not changed:
              raise SystemExit('No public Admin links found to remove.')
          print('Updated:', ', '.join(changed))
          PY

      - name: Verify public pages contain no Admin navigation
        run: |
          if grep -nEi 'href=["'"']admin\.html|class=["'"'][^"'"']*admin-btn' index.html about_me.html font.html loksewa.html; then
            echo 'ERROR: Public Admin link still exists.'
            exit 1
          fi
          echo 'Verified: no Admin navigation remains on public pages.'

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html about_me.html font.html loksewa.html
          git commit -m 'Remove Admin links from public pages'
          git push
