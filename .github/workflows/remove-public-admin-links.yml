name: Remove Admin links from public pages

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/remove-public-admin-links.yml'

permissions:
  contents: write

jobs:
  remove-public-admin-links:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove Admin navigation from public HTML pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [Path('index.html'), Path('about_me.html'), Path('font.html'), Path('loksewa.html')]
          changed = []
          for p in files:
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              original = s
              s = re.sub(r'\s*<li\b[^>]*>\s*<a\b[^>]*href=["\']admin\.html(?:\?[^"\']*)?["\'][^>]*>.*?</a>\s*</li>\s*', '\n', s, flags=re.I | re.S)
              s = re.sub(r'\s*<a\b[^>]*href=["\']admin\.html(?:\?[^"\']*)?["\'][^>]*class=["\'][^"\']*admin-btn[^"\']*["\'][^>]*>.*?</a>\s*', '\n', s, flags=re.I | re.S)
              if s != original:
                  p.write_text(s, encoding='utf-8')
                  changed.append(str(p))
          print('Updated:' if changed else 'No public Admin links found; nothing to change.', ', '.join(changed))
          PY

      - name: Verify public pages contain no Admin navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          # Verify actual anchors, not CSS definitions such as .admin-btn { ... }.
          bad = re.compile(r'<a\b[^>]*(?:href=["\'][^"\']*admin\.html|class=["\'][^"\']*admin-btn[^"\']*["\'])[^>]*>.*?Admin.*?</a>', re.I | re.S)
          found = [str(p) for p in map(Path, ['index.html', 'about_me.html', 'font.html', 'loksewa.html']) if p.exists() and bad.search(p.read_text(encoding='utf-8'))]
          if found:
              raise SystemExit('Public Admin navigation still present: ' + ', '.join(found))
          print('Verified: no Admin navigation remains on public pages.')
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html about_me.html font.html loksewa.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Remove Admin links from public pages'
          git push

# trigger
