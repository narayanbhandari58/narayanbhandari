name: Merge Branch Officer 2.2 pictorial bank
on:
  push:
    paths: ['.github/workflows/merge-branch-officer-2.2-pictorial-now.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge pictorial questions into exam-data.json
        shell: python
        run: |
          import json
          from pathlib import Path
          p=Path('exam-data.json'); d=json.loads(p.read_text(encoding='utf-8'))
          seed=json.loads(Path('exam-question-seed/branch-officer-2.2-nonverbal-pictorial.json').read_text(encoding='utf-8'))
          assert len(seed)==30
          assert all(q.get('image') for q in seed)
          qs=d.setdefault('questions',[]); by={q.get('id'):i for i,q in enumerate(qs)}
          for q in seed:
            if q['id'] in by: qs[by[q['id']]]=q
            else: by[q['id']]=len(qs); qs.append(q)
          bank=[q for q in qs if q.get('unit')=='2.2']
          assert len(bank)>=30
          d['questionBankUpdatedAt']=__import__('datetime').datetime.utcnow().isoformat()+'Z'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('2.2 pictorial merged:',len(bank),'questions; total:',len(qs))
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exam-data.json
          git diff --cached --quiet || git commit -m 'Merge Branch Officer pictorial questions into exam-data'
          git push
