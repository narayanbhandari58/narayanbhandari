name: Lock admin entrypoint

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock-admin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove public Admin navigation and enforce /admin canonical URL
        shell: python
        run: |
          from pathlib import Path
          import re

          public_pages = [Path('index.html'), Path('about_me.html'), Path('font.html')]
          admin_li = re.compile(r'\s*<li>\s*<a\s+[^>]*class=["\'][^"\']*admin-btn[^"\']*["\'][^>]*>\s*Admin\s*</a>\s*</li>\s*', re.I | re.S)
          generic_admin_li = re.compile(r'\s*<li>\s*<a\s+[^>]*href=["\'](?:\.\./)?admin\.html[^"\'][^>]*>\s*Admin\s*</a>\s*</li>\s*', re.I | re.S)

          for path in public_pages:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              new = generic_admin_li.sub('\n', admin_li.sub('\n', text))
              new = re.sub(r'\n{4,}', '\n\n\n', new)
              if new != text:
                  path.write_text(new, encoding='utf-8')

          admin = Path('admin.html')
          if admin.exists():
              text = admin.read_text(encoding='utf-8')
              guard = '''<script>\n(function(){\n  var p = window.location.pathname.replace(/\\/+$/, '') || '/';\n  if (p !== '/admin') window.location.replace('/admin');\n})();\n</script>'''
              if "window.location.replace('/admin')" not in text:
                  admin.write_text(text.replace('</head>', guard + '</head>', 1), encoding='utf-8')

          netlify = Path('netlify.toml')
          text = netlify.read_text(encoding='utf-8') if netlify.exists() else ''
          if 'from = "/admin"' not in text:
              text = text.rstrip() + '\n\n[[redirects]]\n  from = "/admin"\n  to = "/admin.html"\n  status = 200\n  force = true\n'
              netlify.write_text(text, encoding='utf-8')

      - name: Verify public HTML has no Admin button
        shell: python
        run: |
          from pathlib import Path
          import re
          # Check actual anchor/navigation markup, not CSS class definitions.
          bad = re.compile(r'<a\b[^>]*(?:href=["\'][^"\']*admin\.html|class=["\'][^"\']*admin-btn[^"\']*["\'])[^>]*>\s*Admin\s*</a>', re.I | re.S)
          found = [str(p) for p in map(Path, ['index.html', 'about_me.html', 'font.html']) if p.exists() and bad.search(p.read_text(encoding='utf-8'))]
          if found:
              raise SystemExit('Public Admin navigation still present: ' + ', '.join(found))
          print('Public Admin navigation check passed.')

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html about_me.html font.html admin.html netlify.toml
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Restrict admin entrypoint to /admin"
          git push
